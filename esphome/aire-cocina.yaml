# Kitchen AC: a SMLIGHT SLWF-01pro (ESP8266) in the indoor unit's USB-shaped
# port, speaking Midea's UART protocol. The only two-way AC in the house — the
# other three are IR (SmartIR + Broadlink). Install, flashing, the entity-registry
# migration off SmartIR and HA onboarding: docs/aire-cocina-slwf01pro.md.

substitutions:
  name: aire-cocina
  friendly_name: Aire Cocina

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp12e

# baud_rate 0 = no serial logging: UART0 is the bus to the AC, and anything
# written there feeds garbage into the protocol. Logs come out over the API.
logger:
  baud_rate: 0

api:
  encryption:
    key: !secret aire_cocina_api_key

ota:
  - platform: esphome
    password: !secret aire_cocina_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Aire-Cocina-Fallback"
    password: !secret ap_password

captive_portal:

web_server:

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

climate:
  - platform: midea
    # Empty: the entity inherits the device friendly_name -> climate.aire_cocina,
    # the same id the SmartIR entity had, so every scene and automation keeps
    # working. The old registry entry has to be deleted first or this lands on
    # climate.aire_cocina_2 — see §7 of the doc.
    name: ""
    period: 1s
    timeout: 2s
    num_attempts: 3
    # Modes, fan speeds, presets and swing come from asking the unit itself.
    autoconf: true
    beeper: false
    visual:
      min_temperature: 17 °C
      max_temperature: 30 °C
      temperature_step: 0.5 °C
    outdoor_temperature:
      name: Temperatura exterior

sensor:
  - platform: wifi_signal
    name: WiFi
    update_interval: 60s
    entity_category: diagnostic
