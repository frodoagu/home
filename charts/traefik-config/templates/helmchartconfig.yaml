# Overrides the values of the k3s-bundled Traefik HelmChart.
# The k3s helm-controller merges this into the upstream traefik chart and
# redeploys Traefik whenever it changes.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: {{ .Values.traefikNamespace }}
spec:
  valuesContent: |-
    # Allow Traefik CRDs (IngressRoute/Middleware) to reference resources in
    # other namespaces. Required so the dashboard's `google-auth-signin` errors
    # middleware (in kube-system) can point at the oauth2-proxy Service in the
    # oauth2-proxy namespace; without this the middleware fails to build and the
    # router that references it returns 404.
    providers:
      kubernetesCRD:
        allowCrossNamespace: true
    # Pin the Traefik container image (overrides the bundled chart's default),
    # so we run a specific Traefik version regardless of the k3s-bundled chart.
    image:
      repository: {{ .Values.image.repository }}
      tag: {{ .Values.image.tag | quote }}
    # Redirect ALL HTTP (:80/web) traffic to HTTPS (:443/websecure) at the
    # entrypoint level, so every route is HTTPS-only regardless of its Ingress.
    # NOTE: these are the correct keys for the Traefik chart shipped with this
    # k3s (chart 39.x / Traefik v3.6): the redirect lives under
    # `ports.web.http.redirections.entryPoint` (the older `ports.web.redirectTo`
    # key is silently ignored), and ACME resolvers use `certificatesResolvers`
    # (not `certResolvers`). ACME HTTP-01 challenges are still served on :80 —
    # Traefik answers the challenge before applying this redirect.
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        tls:
          certResolver: letsencrypt
        {{- if .Values.http3.enabled }}
        # Adds a udp/443 port (name `websecure-http3`) to Traefik's LoadBalancer
        # Service — klipper opens the matching host port — and makes the
        # entrypoint answer QUIC and advertise `Alt-Svc: h3=":443"`.
        # advertisedPort: without it Traefik advertises the container port
        # (h3=":8443"), which nothing outside the pod listens on.
        # Turning http3 on for an EXISTING release does not add the UDP ports:
        # Helm's patch keys Service ports on `port` and container ports on
        # `containerPort`, so 443/UDP and 8443/UDP collapse into their TCP twins.
        # They were added once by hand (docs/tls.md); don't toggle http3 off.
        http3:
          enabled: true
          advertisedPort: 443
        {{- end }}
    certificatesResolvers:
      letsencrypt:
        acme:
          email: {{ .Values.acme.email }}
          storage: {{ .Values.acme.storage }}
          dnsChallenge:
            provider: {{ .Values.acme.dnsChallenge.provider }}
    # Access logs (request/response details) to stdout for debugging. This is
    # the Traefik *chart* key (logs.access); the bare top-level `accessLog`
    # static-config key is not a chart value and is silently ignored. With no
    # filePath set, Traefik writes access logs to stdout (kubectl logs).
    # klipper SNATs every client to 10.42.0.1, so the real IP is only in
    # Cloudflare's header (trustworthy while origin-firewall drops non-CF hits).
    logs:
      access:
        enabled: true
        format: json
        fields:
          headers:
            names:
              Cf-Connecting-IP: keep
    # Cloudflare API token for the lego DNS-01 provider. Sourced from a Secret
    # in the Traefik namespace (see values.yaml) so it never lives in git.
    env:
      - name: {{ .Values.acme.dnsChallenge.tokenKey }}
        valueFrom:
          secretKeyRef:
            name: {{ .Values.acme.dnsChallenge.existingSecret }}
            key: {{ .Values.acme.dnsChallenge.tokenKey }}
    {{- if .Values.persistence.enabled }}
    persistence:
      enabled: true
      name: data
      accessMode: ReadWriteOnce
      size: {{ .Values.persistence.size }}
      path: {{ .Values.persistence.path }}
    # acme.json must be mode 0600; create it with the right perms on startup.
    deployment:
      revisionHistoryLimit: 1
      initContainers:
        - name: volume-permissions
          image: busybox:1.38
          command: ["sh", "-c", "touch {{ .Values.acme.storage }} && chmod -v 600 {{ .Values.acme.storage }}"]
          securityContext:
            runAsNonRoot: true
            runAsGroup: 65532
            runAsUser: 65532
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.path }}
    {{- end }}
    {{- if .Values.dashboard.enabled }}
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`{{ .Values.dashboard.host }}`)
        entryPoints:
          - websecure
        {{- if .Values.googleAuth.enabled }}
        middlewares:
          - name: google-auth-signin
          - name: google-auth
        {{- else if .Values.dashboardAuth.enabled }}
        middlewares:
          - name: dashboard-auth
        {{- end }}
        tls:
          certResolver: letsencrypt
    {{- end }}
