# Default values for the victoria-logs wrapper chart.
#
# One upstream chart is wrapped (keys forwarded verbatim under its name):
#   victoria-logs-single  -> the VictoriaLogs server + bundled Vector collector
#
# Everything here is sized for a single Raspberry Pi running k3s and is biased
# toward FEW DISK WRITES (only an SD card is available): short retention plus a
# hard disk-usage cap so the log DB can never fill the card. If you later add an
# SSD, bump server.retentionPeriod / retentionDiskSpaceUsage and the PVC size.

# ── This wrapper's own resources (templates/) ──────────────────────────────────

# The VictoriaLogs UI (vmui) is exposed via a Traefik IngressRoute and protected
# by a local copy of the google-auth ForwardAuth middleware (delegates to
# oauth2-proxy, same as the other private services). See templates/ingress.yaml.
ingress:
  enabled: true
  host: logs.agu.com.ar
  certResolver: letsencrypt

# ForwardAuth → oauth2-proxy. Mirrors charts/monitoring so the IngressRoute can
# require Google sign-in without relying on Traefik cross-namespace middleware
# references — a local copy of the middleware is created in this namespace
# (see templates/google-auth-middleware.yaml).
googleAuth:
  enabled: true
  forwardAuthAddress: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth"
  signInQuery: "/oauth2/sign_in?rd={url}"
  oauth2ProxyService:
    name: oauth2-proxy
    namespace: oauth2-proxy
    port: 80

# ── victoria-logs-single (upstream) ────────────────────────────────────────────
victoria-logs-single:
  # Predictable service/StatefulSet name so the IngressRoute and the Grafana
  # datasource (in charts/monitoring) can target a stable host:
  #   http://victoria-logs.victoria-logs.svc.cluster.local:9428
  server:
    fullnameOverride: victoria-logs
    statefulSet:
      spec:
        revisionHistoryLimit: 1

    # SD-card friendly retention. VictoriaLogs is very write-efficient, but the
    # collector ships EVERY pod's logs, so cap both by time AND by disk usage.
    # retentionPeriod unit chars: h/d/w/y (bare number = months).
    retentionPeriod: "7d"
    # Hard cap: drop the oldest data once on-disk usage reaches this, so logs can
    # never fill the SD card regardless of volume. Keep below the PVC size.
    retentionDiskSpaceUsage: "4GiB"

    persistentVolume:
      enabled: true
      size: 5Gi
      accessModes:
        - ReadWriteOnce

    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi

  # Bundled Vector agent (DaemonSet) that tails container logs on every node and
  # forwards them to the VictoriaLogs server. The chart auto-wires the sink to the
  # server above; the default customConfig already parses k8s logs as JSON.
  vector:
    enabled: true
    revisionHistoryLimit: 1
    # The kubernetes_logs source watches every pod log on the node and buffers
    # in memory; 192Mi was too tight and got OOMKilled (exit 137). The Pi has
    # 8 GB RAM, so give it real headroom.
    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 512Mi

    # GeoIP: every Traefik access log carrying Cf-Connecting-Ip gets
    # log.client_country (ISO code) and log.client_country_name, looked up in
    # DB-IP's free IP-to-Country Lite database (CC BY 4.0). The init container
    # refreshes it on each pod start into the node's /var/lib/vector, and keeps
    # the cached copy when the download fails. See docs/monitoring.md#geoip.
    initContainers:
      - name: geoip
        image: curlimages/curl:8.11.1
        securityContext:
          runAsUser: 0 # the hostPath data dir belongs to root, like Vector itself
        volumeMounts:
          - name: data
            mountPath: /vector-data-dir
        command:
          - sh
          - -c
          - |
            set -eu
            dir=/vector-data-dir/geoip
            db="$dir/country.mmdb"
            mkdir -p "$dir"
            y=$(date +%Y); m=$(date +%m)
            # The current month's file appears a few days in: fall back to last month's.
            for _ in 1 2; do
              url="https://download.db-ip.com/free/dbip-country-lite-$y-$m.mmdb.gz"
              if curl -fsSL --retry 3 --max-time 120 "$url" | gunzip > "$db.tmp" && [ -s "$db.tmp" ]; then
                mv "$db.tmp" "$db"
                echo "GeoIP: $url"
                exit 0
              fi
              m=$(( ${m#0} - 1 ))
              [ "$m" -eq 0 ] && m=12 && y=$((y - 1))
              m=$(printf %02d "$m")
            done
            rm -f "$db.tmp"
            [ -s "$db" ] && echo "GeoIP: download failed, keeping the cached database" && exit 0
            echo "GeoIP: no database and no download" >&2
            exit 1
    # Merged into the upstream chart's default Vector config (sources, sinks and
    # the parser's inputs stay as shipped).
    customConfig:
      enrichment_tables:
        geoip:
          type: mmdb
          path: /vector-data-dir/geoip/country.mmdb
      transforms:
        parser:
          source: |
            .log = parse_json(.message) ?? .message
            del(.message)
            ip = .log."request_Cf-Connecting-Ip"
            if is_string(ip) {
              geo, err = get_enrichment_table_record("geoip", {"ip": ip})
              if err == null {
                .log.client_country = geo.country.iso_code
                .log.client_country_name = geo.country.names.en
              }
            }
