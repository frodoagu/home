# Custom alerting rules layered on top of the chart's defaultRules: Raspberry Pi
# hardware health (temperature + throttling/under-voltage), basic node capacity,
# and the blackbox uptime/TLS probes. vmalert evaluates these and fires through
# Alertmanager → Telegram.
#
# NOTE: the double-brace expressions inside annotations are Prometheus/Alertmanager
# templates, wrapped in Helm raw-string literals so Helm passes them through untouched.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "monitoring.fullname" . }}-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
spec:
  groups:
    - name: raspberrypi.hardware
      rules:
        - alert: RPiHighTemperature
          expr: node_thermal_zone_temp > 70
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: {{ `Raspberry Pi running hot ({{ $value | printf "%.1f" }} C)` | quote }}
            description: {{ `CPU temperature on {{ $labels.instance }} has been above 70 C for 5m.` | quote }}
        - alert: RPiCriticalTemperature
          expr: node_thermal_zone_temp > 80
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: {{ `Raspberry Pi critically hot ({{ $value | printf "%.1f" }} C)` | quote }}
            description: {{ `CPU temperature on {{ $labels.instance }} is above 80 C — throttling imminent. Check cooling.` | quote }}
        - alert: RPiUnderVoltage
          expr: node_rpi_under_voltage_now == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Raspberry Pi under-voltage detected"
            description: {{ `{{ $labels.instance }} reports under-voltage right now — check the PSU/cable.` | quote }}
        - alert: RPiThrottled
          expr: node_rpi_throttled_now == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Raspberry Pi is throttled"
            description: {{ `{{ $labels.instance }} is actively throttling the CPU right now.` | quote }}
        - alert: RPiUnderVoltageOccurred
          expr: node_rpi_under_voltage_occurred == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Raspberry Pi had under-voltage since boot"
            description: {{ `{{ $labels.instance }} recorded an under-voltage event since last boot (sticky bit). PSU may be marginal.` | quote }}
        - alert: RPiThrottleExporterDown
          expr: node_rpi_exporter_up == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "rpi-throttle-exporter cannot read vcgencmd"
            description: {{ `vcgencmd get_throttled is failing on {{ $labels.instance }}; throttle metrics are stale.` | quote }}

    - name: node.capacity
      rules:
        - alert: NodeFilesystemLow
          expr: 100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 15
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: {{ `Low disk space on {{ $labels.mountpoint }} ({{ $value | printf "%.0f" }}% free)` | quote }}
            description: {{ `{{ $labels.instance }} {{ $labels.mountpoint }} has under 15% free for 15m.` | quote }}
        - alert: NodeMemoryHigh
          expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: {{ `High memory usage ({{ $value | printf "%.0f" }}%)` | quote }}
            description: {{ `{{ $labels.instance }} memory usage above 90% for 15m.` | quote }}
        - alert: NodeExporterDown
          expr: up{job=~".*node-exporter.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "node-exporter target is down"
            description: {{ `node-exporter on {{ $labels.instance }} has been unreachable for 5m.` | quote }}

    - name: workloads.jobs
      rules:
        # The shelly-config CronJob self-heals every 30m (charts/shelly-config);
        # a single missed run is usually just a Shelly briefly off the LAN and
        # is already absorbed by the reconciler's own per-call retries. Only
        # page if it hasn't managed a successful run in a while, i.e. several
        # consecutive scheduled runs in a row failed -- 3 missed runs (90m) plus
        # slack for a delayed tick. The default KubeJobFailed alert (fires 15m
        # after any single failed run) is muted for this CronJob's own runs in
        # the alertmanager routes below so this is the only signal for it; it
        # still fires normally for the shelly-config-sync PostSync hook, where
        # one failure (a git change not applied) is worth paging on immediately.
        - alert: ShellyConfigNotReconciling
          expr: time() - kube_cronjob_status_last_successful_time{namespace="shelly-config", cronjob="shelly-config"} > 100 * 60
          labels:
            severity: warning
          annotations:
            summary: "shelly-config hasn't reconciled successfully in a while"
            description: {{ `shelly-config CronJob has had no successful run for over 100m (several consecutive ticks) -- the outdoor light Shellys may be out of sync or unreachable.` | quote }}

    - name: blackbox.uptime
      rules:
        - alert: ProbeDown
          expr: probe_success == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: {{ `Endpoint down: {{ $labels.instance }}` | quote }}
            description: {{ `Blackbox probe to {{ $labels.instance }} has failed for 5m.` | quote }}
        - alert: ProbeSlow
          expr: probe_duration_seconds > 3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: {{ `Slow endpoint: {{ $labels.instance }} ({{ $value | printf "%.1f" }}s)` | quote }}
            description: {{ `Blackbox probe to {{ $labels.instance }} took over 3s for 10m.` | quote }}
        - alert: ProbeSSLCertExpiringSoon
          expr: probe_ssl_earliest_cert_expiry > 0 and (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: {{ `TLS cert for {{ $labels.instance }} expires in {{ $value | printf "%.0f" }} days` | quote }}
            description: {{ `Certificate for {{ $labels.instance }} expires in under 14 days — Let's Encrypt renewal may be stuck.` | quote }}
        - alert: ProbeSSLCertExpiringCritical
          expr: probe_ssl_earliest_cert_expiry > 0 and (probe_ssl_earliest_cert_expiry - time()) / 86400 < 3
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: {{ `TLS cert for {{ $labels.instance }} expires in {{ $value | printf "%.0f" }} days` | quote }}
            description: {{ `Certificate for {{ $labels.instance }} expires in under 3 days — renewal is failing.` | quote }}

    # psy.agu.com.ar cloud save (images/psy-sync, scraped by the VMPodScrape in
    # charts/psy-sampler). Only the API: the static sampler is covered by the
    # blackbox probe. See docs/monitoring.md#psy-sampler-cloud-save.
    - name: psy-sampler.sync
      rules:
        - alert: PsySyncDown
          expr: up{job="psy-sampler/psy-sampler-sync"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "psy-sync is down"
            description: "The psy.agu.com.ar cloud-save API has failed its scrape for 5m: the page falls back to browser-only saves."
        - alert: PsySyncNotScraped
          expr: absent(up{job="psy-sampler/psy-sampler-sync"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "psy-sync has no scrape target"
            description: "No psy-sync pod has been scraped for 15m (pod gone, metrics port renamed, or the VMPodScrape is missing)."
        - alert: PsySyncServerErrors
          expr: sum(increase(psy_sync_http_requests_total{job="psy-sampler/psy-sampler-sync", status="500"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: {{ `psy-sync answered {{ $value | printf "%.0f" }} internal errors in 15m` | quote }}
            description: "Unhandled exceptions in the cloud-save API; the pod log has the route and message."
        - alert: PsySyncSignInFailures
          expr: sum(increase(psy_sync_http_requests_total{job="psy-sampler/psy-sampler-sync", route="POST /api/session", status="401"}[1h])) > 20
          labels:
            severity: warning
          annotations:
            summary: {{ `{{ $value | printf "%.0f" }} rejected Google sign-ins in the last hour` | quote }}
            description: "Many ID tokens failed verification: forged tokens, or a client id / clock problem that locks everyone out."
        - alert: PsySyncUsersNearCap
          expr: psy_sync_users / psy_sync_users_max > 0.8
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: {{ `psy-sync accounts at {{ $value | humanizePercentage }} of the cap` | quote }}
            description: "New sign-ups stop at sync.maxUsers (charts/psy-sampler); raise it or prune accounts."
        - alert: PsySyncSignupsClosed
          expr: psy_sync_users >= psy_sync_users_max
          labels:
            severity: critical
          annotations:
            summary: "psy-sync is full: new sign-ups get 503"
            description: "The account cap (sync.maxUsers) is reached; existing accounts still work."
        - alert: PsySyncSignupBurst
          expr: delta(psy_sync_users[1h]) > 25
          labels:
            severity: warning
          annotations:
            summary: {{ `{{ $value | printf "%.0f" }} new psy-sync accounts in an hour` | quote }}
            description: "Unusual sign-up rate for psy.agu.com.ar: a mention somewhere, or scripted accounts filling the cap."
        - alert: PsySyncAnonymousBurst
          expr: delta(psy_sync_visitors_stored[1h]) > 500
          labels:
            severity: warning
          annotations:
            summary: {{ `{{ $value | printf "%.0f" }} new anonymous browsers in an hour` | quote }}
            description: "Visitor ids are client-made: a burst this size is most likely a script inflating the anonymous count."
        - alert: PsySyncVisitorsCapReached
          expr: psy_sync_visitors_stored >= psy_sync_visitors_max
          labels:
            severity: warning
          annotations:
            summary: "psy-sync stopped recording new browsers"
            description: "The visitor table is at its cap, so anonymous-visitor counts are frozen until old rows are pruned (90 days)."
        - alert: PsySyncWorkspaceNearLimit
          expr: psy_sync_user_workspace_bytes / ignoring(email) group_left psy_sync_workspace_bytes_limit > 0.9
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: {{ `{{ $labels.email }}'s workspace is at {{ $value | humanizePercentage }} of the size limit` | quote }}
            description: {{ `Saves from {{ $labels.email }} get 413 once the workspace passes the API limit (MAX_BYTES in images/psy-sync).` | quote }}
        - alert: PsySyncDataVolumeHigh
          expr: sum without(file) (psy_sync_db_bytes) / psy_sync_volume_request_bytes > 0.8 and psy_sync_volume_request_bytes > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: {{ `psy-sync database at {{ $value | humanizePercentage }} of its PVC request` | quote }}
            description: "The SQLite files outgrow sync.persistence.size. local-path does not enforce it, so this eats the SD card's free space."
