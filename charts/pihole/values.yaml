# Default values for pihole.
# Pi-hole runs as the LAN's DNS ad-blocker AND DHCP server. DHCP is enabled
# because the router cannot be told to hand out a custom DNS server — so Pi-hole
# takes over DHCP and advertises ITSELF as the DNS resolver. The router's own
# DHCP server MUST be turned off (two DHCP servers on one LAN conflict).

replicaCount: 1

image:
  repository: pihole/pihole
  pullPolicy: IfNotPresent
  # Pin to an explicit version (keep Chart.yaml appVersion in sync). Avoid
  # floating tags like "latest".
  tag: "2026.07.2"

nameOverride: ""
fullnameOverride: ""

# IANA timezone — used for the query log / lease timestamps.
timezone: "America/Argentina/Buenos_Aires"

# Pi-hole serves its web UI on this plain-HTTP port. It is deliberately OFF 80/443
# because the pod runs in hostNetwork and those host ports are taken by the
# bundled Traefik (which terminates TLS and reverse-proxies to this port).
webPort: 8080

# ClusterIP service that fronts the web UI for the Traefik IngressRoute. DNS (53)
# and DHCP (67) are reached directly on the node via hostNetwork, not through a
# Service, so they are not listed here.
service:
  type: ClusterIP
  port: 8080

# Persistent storage for /etc/pihole (pihole.toml, gravity.db, the FTL query DB
# and dnsmasq.d). On the RPi's SD card, so keep it modest.
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 2Gi
  existingClaim: ""

# Web UI via Traefik IngressRoute, gated by the google-auth ForwardAuth middleware.
ingress:
  enabled: true
  host: pihole.agu.com.ar
  certResolver: letsencrypt

# ForwardAuth → oauth2-proxy (Google sign-in). Mirrors charts/monitoring so the
# IngressRoute can require sign-in without relying on Traefik cross-namespace
# middleware references — a local copy of the middleware is created in this
# namespace (see templates/google-auth-middleware.yaml).
googleAuth:
  enabled: true
  forwardAuthAddress: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth"
  signInQuery: "/oauth2/sign_in?rd={url}"
  oauth2ProxyService:
    name: oauth2-proxy
    namespace: oauth2-proxy
    port: 80

# Admin password for the Pi-hole web UI.
#
# The UI is already gated by google-auth, so Pi-hole's OWN login is disabled by
# default (disablePassword: true → empty FTLCONF_webserver_api_password). This is
# effectively REQUIRED with this google-auth setup: the google-auth-signin errors
# middleware catches 401-403 responses, including the ones Pi-hole's API returns
# during its own login — which breaks the SPA ("Server unreachable!"). With no
# password the API never 401s, so it stays out of the middleware's way.
#
# To use a password instead, set disablePassword: false and point existingSecret
# at a secret created out-of-band (never in git):
#   kubectl create secret generic pihole-admin -n pihole --from-literal=password=CHANGEME
# (existingSecret takes precedence over disablePassword.)
admin:
  disablePassword: true
  existingSecret: ""
  existingSecretKey: password

dns:
  # Upstream resolvers Pi-hole forwards cache misses to (semicolon-separated).
  upstreams: "1.1.1.1;1.0.0.1"
  # LOCAL = only answer the directly-connected subnet | ALL | BIND | SINGLE.
  # ALL is safe here: :53 is not exposed to the internet (no port-forward).
  listeningMode: "all"
  dnssec: false
  # Local DNS domain handed to DHCP clients (dnsmasq `domain=`). Pi-hole answers
  # every DHCP lease AND every static reservation under it, using the entry's
  # `name`, so `lavarropas.lan` resolves to whatever dhcp.reservations says — the
  # reservation list below is the single source of truth for those addresses and
  # consumers can stop hardcoding IPs. Bare names resolve too, but the qualified
  # form is what works from inside the cluster (see clusterForwarding).
  #
  # "lan" is also FTL's default; it is set explicitly because the CoreDNS stanza
  # below and several consumers now depend on this exact suffix.
  domain: "lan"
  # Make `*.<dns.domain>` resolvable from INSIDE the cluster.
  #
  # Pods resolve through CoreDNS, which forwards everything it doesn't own to the
  # node's upstream — not to Pi-hole — so `lavarropas.lan` is NXDOMAIN in a pod
  # even though it resolves fine on the LAN. This renders the `coredns-custom`
  # ConfigMap that k3s already mounts into CoreDNS (optional volume at
  # /etc/coredns/custom, imported by the stock Corefile's `import
  # /etc/coredns/custom/*.server`), adding one server block that forwards the
  # local domain back to Pi-hole on the node.
  #
  # piholeIP must be the node's LAN address: Pi-hole runs hostNetwork, so :53 is
  # served on the host, not through a Service.
  clusterForwarding:
    enabled: true
    piholeIP: "192.168.0.100"
  # Local DNS records (split-horizon DNS): on the LAN, these hostnames resolve
  # straight to the Pi's own IP instead of Cloudflare's, so traffic to
  # *.agu.com.ar never has to leave the network and come back. Traefik on the
  # Pi still does the host-based routing, so this only shortcuts the path —
  # behavior is identical to the public route. Off-LAN devices are unaffected
  # (they don't use this resolver). Each entry is one IP with the hostnames
  # that share it.
  localRecords:
    - ip: "192.168.0.100"
      hosts:
        - agu.com.ar
        - www.agu.com.ar
        - home.agu.com.ar
        - argocd.agu.com.ar
        - traefik.agu.com.ar
        - auth.agu.com.ar
        - grafana.agu.com.ar
        - pihole.agu.com.ar
        - logs.agu.com.ar
        - dash.agu.com.ar

# DHCP server. The router's own DHCP is OFF and the Pi has a static IP, so Pi-hole
# owns DHCP and advertises itself as the resolver. (Keep this in sync with the
# router: never run both DHCP servers at once.)
#
# Address plan for 192.168.0.0/24 — the static and the dynamic halves must never
# meet, so a device that is addressed by IP somewhere else can't have its address
# handed to a phone while it is off:
#
#   .1              router (gateway)
#   .10 – .99       STATIC reservations, grouped by device class (see below)
#   .100            the Pi itself — static on the host (NetworkManager), not here
#   .150 – .250     DYNAMIC pool
#
# dnsmasq does keep a reserved address out of the pool even when it falls inside
# start–end, so the split is not what makes this correct — it is what makes it
# legible, and it leaves .101–.149 free as headroom on both sides.
dhcp:
  enabled: true
  # Dynamic pool. Must stay clear of the .10–.99 static block above.
  start: "192.168.0.150"
  end: "192.168.0.250"
  # Default gateway advertised to clients (the router).
  router: "192.168.0.1"
  leaseTime: "24h"
  ipv6: false
  rapidCommit: false
  # Static DHCP reservations (MAC -> fixed IP), for devices that MUST keep their
  # address because something else addresses them by IP: Home Assistant config
  # entries (Broadlink, webOS TVs), the Shelly reconciler + proxy, the Candy
  # package. Each entry: { mac, ip, name? } -> one dnsmasq `dhcp-host`.
  #
  # One decade per device class, in ascending order. Add a device to its own
  # decade and keep the list sorted; a new class takes the next free decade.
  #   .10–.19  ESPHome / BLE proxies
  #   .20–.29  Shelly relays
  #   .30–.39  Broadlink IR blasters
  #   .40–.49  electrodomesticos
  #   .50–.59  TVs / media
  #
  # Renumbering one of these is never just an edit here: grep the repo for the
  # old address (charts/shelly-*, packages/lavarropas.yaml, scripts/candyctl.py,
  # docs/) and re-point the matching Home Assistant config entry by hand — those
  # are config-flow integrations, so git cannot set their host.
  reservations:
    # ESPHome BLE proxies — relay the Mopeka gas sensor and the BTHome
    # thermometers that sit out of the Pi's Bluetooth range.
    - { mac: "d4:d4:da:4a:06:70", ip: "192.168.0.10", name: "esphome-btproxy" }
    - { mac: "30:76:f5:e6:ab:38", ip: "192.168.0.11", name: "ble-proxy" }
    # SLWF-01pro, the Wi-Fi module in the kitchen AC (esphome/aire-cocina.yaml).
    - { mac: "78:1c:3c:86:70:2e", ip: "192.168.0.12", name: "aire-cocina" }
    # Shelly Mini 1 Gen4 — the two outdoor doors. Addressed by IP from
    # charts/shelly-config (reconciler), charts/shelly-proxy (nginx) and
    # scripts/luces-afuera.js (the gang script's peer list).
    - { mac: "7c:2c:67:67:2c:90", ip: "192.168.0.20", name: "shelly-escalera" }
    - { mac: "7c:2c:67:60:94:38", ip: "192.168.0.21", name: "shelly-puerta-principal" }
    # Broadlink IR blasters — Home Assistant addresses each one by IP.
    - { mac: "34:8e:89:2d:d9:ca", ip: "192.168.0.30", name: "broadlink-1" }        # dormitorio
    - { mac: "34:8e:89:2d:c3:19", ip: "192.168.0.31", name: "broadlink-2" }        # living
    - { mac: "34:8e:89:2d:bb:4b", ip: "192.168.0.32", name: "broadlink-3" }        # pieza de los chicos
    # Lavasecarropas Candy simply-Fi: packages/lavarropas.yaml and
    # scripts/candyctl.py hit its local HTTP API by IP.
    - { mac: "48:55:19:c1:90:bb", ip: "192.168.0.40", name: "lavarropas" }
    # LG webOS TVs — pinned so Home Assistant's webostv host (and the WoL magic
    # packet target) never drift when the DHCP lease renews.
    - { mac: "4c:ba:d7:11:bb:12", ip: "192.168.0.50", name: "tv-sala" }
    - { mac: "44:cb:8b:e4:44:c8", ip: "192.168.0.51", name: "tv-dormitorio" }

# Resource requests/limits – tuned small for the RPi.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# hostNetwork is REQUIRED: DNS (53) and DHCP broadcasts (67) must reach the
# physical LAN, which the pod overlay network cannot do.
hostNetwork: true

# DHCP needs NET_ADMIN (manage interfaces/leases) and NET_RAW (raw/broadcast
# packets); NET_BIND_SERVICE lets FTL bind :53 if it runs unprivileged.
securityContext:
  capabilities:
    add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE

nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables (e.g. additional FTLCONF_* overrides).
env: []

# Extra volumes / mounts if ever needed.
extraVolumes: []
extraVolumeMounts: []
