{{- if .Values.gravityUpdate.enabled }}
# Daily adlist refresh through Pi-hole's API (`pihole -g`). See
# docs/pihole.md#adlists-gravitydb.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pihole.fullname" . }}-gravity
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.gravityUpdate.schedule | quote }}
  timeZone: {{ .Values.timezone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "pihole.name" . }}-gravity
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          # The image names its user (curl_user) instead of a UID, so runAsNonRoot
          # needs the number to verify it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
          containers:
            - name: gravity
              image: {{ .Values.gravityUpdate.image }}
              command: ["/bin/sh", "-c"]
              # FTL answers 401 to any Host but its own names, the Service's included.
              # The output streams with a 200 before gravity runs, so success is its
              # closing "Done." line, not the status code.
              args:
                - >-
                  curl -sSN --max-time 900 -X POST
                  -H "Host: {{ .Values.ingress.host }}"
                  "http://{{ include "pihole.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}/api/action/gravity"
                  | tee /dev/stderr | grep -q "Done\."
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
{{- end }}
