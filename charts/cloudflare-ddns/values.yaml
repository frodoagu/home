# Cloudflare dynamic-DNS updater (favonia/cloudflare-ddns).
# Keeps the A records below in sync with this network's public IPv4 address.

revisionHistoryLimit: 1

image:
  repository: favonia/cloudflare-ddns
  # Human-readable tag (used only when digest is empty). Releases:
  # https://github.com/favonia/cloudflare-ddns/releases
  tag: "1.17.1"
  # Pin by digest for reproducible deploys (takes precedence over tag).
  # This is the digest currently running; update deliberately on upgrade.
  # Multi-arch manifest-list (index) digest for 1.17.1 — lets the arm64 node
  # select its image. Do NOT pin a per-arch image digest here.
  digest: "sha256:5e61736b982b87d84a1120b4767c4deff0f2cc55ca3ee9dcb1dc58623039b5cb"
  pullPolicy: IfNotPresent

cloudflare:
  # Cloudflare API token with Zone:DNS:Edit. The domains below span TWO zones
  # (agu.com.ar AND yaskia.com), so the token must cover both.
  # Create the secret out-of-band so the token never lives in git:
  #   kubectl create secret generic cloudflare-ddns-token \
  #     -n cloudflare-ddns --from-literal=CLOUDFLARE_API_TOKEN='your-token'
  # The secret must contain the key CLOUDFLARE_API_TOKEN.
  existingSecret: "cloudflare-ddns-token"
  # Inline token (NOT recommended – committed to git). Leave empty to use
  # existingSecret above.
  apiToken: ""

# Domains whose A (and AAAA, if enabled) records track the public IP.
# favonia creates the records if they don't exist yet.
domains:
  - agu.com.ar
  - www.agu.com.ar
  - home.agu.com.ar
  - argocd.agu.com.ar
  - traefik.agu.com.ar
  - auth.agu.com.ar
  - grafana.agu.com.ar
  - pihole.agu.com.ar
  - logs.agu.com.ar
  - dash.agu.com.ar
  - shelly.agu.com.ar
  - alertmanager.agu.com.ar
  - www.yaskia.com
  - yaskia.com

# Proxy all records through Cloudflare (orange cloud). Safe here because TLS
# certs are issued via ACME DNS-01 (see charts/traefik-config), which needs no
# inbound HTTP-01 challenge. All hosts are single-level under agu.com.ar, so
# Cloudflare Universal SSL (*.agu.com.ar) covers them at the edge. Set false for
# DNS-only (grey cloud) if you need the browser to reach Traefik directly.
proxied: true

# IP detection. IPv4 via Cloudflare's trace endpoint; IPv6 disabled by default.
ip4Provider: "cloudflare.trace"
ip6Provider: "none"

# How often to check/update (favonia internal cron syntax).
updateCron: "@every 5m"

# Optional timezone for log timestamps / cron.
timezone: "America/Argentina/Buenos_Aires"

# No CPU limit: the pod idles between checks and each check is a sub-second
# multi-threaded burst, so any CFS quota throttles most of the few periods it
# runs in and CPUThrottlingHigh flaps. Memory stays bounded.
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 32Mi

nodeSelector: {}
tolerations: []
affinity: {}
