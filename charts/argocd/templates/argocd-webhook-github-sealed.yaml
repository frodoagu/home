# GitHub signs every push webhook to /api/webhook with this secret; the same
# value is the hook's secret on GitHub. Referenced from argocd-secret as
# $argocd-webhook-github:secret (charts/argocd/values.yaml), which needs the
# part-of label below.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-webhook-github
  namespace: argocd
spec:
  encryptedData:
    secret: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: argocd
      name: argocd-webhook-github
      namespace: argocd
