{{- if and .Values.ingress.enabled .Values.googleAuth.enabled }}
# Local copy of the google-auth ForwardAuth middleware, living in THIS namespace.
#
# The canonical pair lives in kube-system (charts/traefik-config). Traefik does
# not allow IngressRoutes to reference middlewares across namespaces by default,
# so the IngressRoute here needs the middleware in its own namespace. Both copies
# just delegate to the cluster-wide oauth2-proxy, so duplicating them is cheap
# and keeps this chart self-contained.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: google-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unifi.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.googleAuth.forwardAuthAddress }}
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
    trustForwardHeader: true
---
# Turns oauth2-proxy 401 (no session) responses into a browser redirect to
# sign-in. Scoped to 401 ONLY, following the lesson from charts/pihole: the
# controller's own API returns 403 in normal operation, and catching 403 here
# would hijack that backend response into an endless sign-in loop.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: google-auth-signin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unifi.labels" . | nindent 4 }}
spec:
  errors:
    status:
      - "401"
    service:
      name: {{ .Values.googleAuth.oauth2ProxyService.name }}
      namespace: {{ .Values.googleAuth.oauth2ProxyService.namespace }}
      port: {{ .Values.googleAuth.oauth2ProxyService.port }}
    query: {{ .Values.googleAuth.signInQuery | quote }}
{{- end }}
