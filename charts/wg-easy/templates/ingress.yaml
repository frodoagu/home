{{- if .Values.ingress.enabled }}
# Traefik IngressRoute for the admin UI. The gate is wg-easy's own Google
# sign-in (no auto-register), not the google-auth ForwardAuth.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "wg-easy.fullname" . }}
  labels:
    {{- include "wg-easy.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      {{- with .Values.ingress.middlewares }}
      middlewares:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ include "wg-easy.fullname" . }}
          port: {{ .Values.service.port }}
  tls:
    certResolver: {{ .Values.ingress.certResolver }}
{{- end }}
