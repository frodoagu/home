apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wg-easy.fullname" . }}
  labels:
    {{- include "wg-easy.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: 1
  # One SQLite database on one PVC: never two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "wg-easy.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wg-easy.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Pod network, not hostNetwork: wg-easy's MASQUERADE and FORWARD rules
      # stay in this pod's netns instead of the host tables flannel and
      # kube-proxy own.
      initContainers:
        - name: sysctls
          image: {{ .Values.sysctlImage }}
          command:
            - sysctl
            - -w
            - net.ipv4.ip_forward=1
            - net.ipv4.conf.all.src_valid_mark=1
          securityContext:
            privileged: true
      containers:
        - name: wg-easy
          image: {{ include "wg-easy.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Always iptables-nft, like k3s. The image's own CMD runs it through
          # `iptables-backend`, which picks legacy whenever `iptables-legacy -L`
          # works: on this kernel that would autoload the host's ip_tables
          # modules. So select nft and start the server without that wrapper.
          command:
            - sh
            - -c
            - |
              update-alternatives --set iptables /usr/sbin/iptables-nft
              update-alternatives --set ip6tables /usr/sbin/ip6tables-nft
              exec /usr/bin/dumb-init node server/index.mjs
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: wireguard
              containerPort: {{ .Values.wireguard.port }}
              protocol: UDP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: DISABLE_IPV6
              value: "true"
            - name: DISABLE_VERSION_CHECK
              value: "true"
            - name: TRUSTED_PROXIES
              value: {{ .Values.trustedProxies | quote }}
            - name: OAUTH_PROVIDERS
              value: google
            - name: OAUTH_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.existingSecret }}
                  key: OAUTH_GOOGLE_CLIENT_ID
            - name: OAUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.existingSecret }}
                  key: OAUTH_GOOGLE_CLIENT_SECRET
            # Off even though the fork registers newcomers as `client`: on, any
            # Google account could create a device and leave through the home
            # IP. Users come in with scripts/vpn-user.sh.
            - name: OAUTH_AUTO_REGISTER
              value: "false"
            - name: OAUTH_ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.adminsSecret }}
                  key: OAUTH_ADMIN_EMAILS
            - name: OAUTH_AUTO_LAUNCH
              value: google
            - name: DISABLE_PASSWORD_AUTH
              value: "true"
            - name: INIT_ENABLED
              value: "true"
            - name: INIT_USERNAME
              value: {{ .Values.init.username | quote }}
            - name: INIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.init.existingSecret }}
                  key: INIT_PASSWORD
            - name: INIT_HOST
              value: {{ .Values.wireguard.host | quote }}
            - name: INIT_PORT
              value: {{ .Values.wireguard.port | quote }}
            - name: INIT_DNS
              value: {{ .Values.wireguard.dns | quote }}
            - name: INIT_ALLOWED_IPS
              value: {{ .Values.wireguard.allowedIps | quote }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: data
              mountPath: /etc/wireguard
          {{- if .Values.metrics.enabled }}
          # Waits for the server to create its tables, then turns the Prometheus
          # endpoint on. Never fails: a hook error would kill the container.
          lifecycle:
            postStart:
              exec:
                command:
                  - node
                  - -e
                  - |
                    const fs = require("fs");
                    const Database = require("/app/server/node_modules/libsql");
                    const path = "/etc/wireguard/wg-easy.db";
                    const deadline = Date.now() + 120000;
                    while (Date.now() < deadline) {
                      try {
                        if (fs.existsSync(path)) {
                          const db = new Database(path);
                          db.exec("PRAGMA busy_timeout = 10000");
                          db.prepare("UPDATE general_table SET metrics_prometheus = 1 WHERE metrics_prometheus = 0").run();
                          process.exit(0);
                        }
                      } catch {}
                      Atomics.wait(new Int32Array(new SharedArrayBuffer(4)), 0, 0, 2000);
                    }
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "wg show | grep -q interface"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "wg-easy.fullname" . }}-data
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
