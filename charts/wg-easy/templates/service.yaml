# The admin UI, reached only through the IngressRoute.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wg-easy.fullname" . }}
  labels:
    {{- include "wg-easy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "wg-easy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
# WireGuard on the node's 51820/udp. A separate Service so the LoadBalancer
# never publishes the UI's port on the node.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wg-easy.fullname" . }}-wireguard
  labels:
    {{- include "wg-easy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.wireguardType }}
  selector:
    {{- include "wg-easy.selectorLabels" . | nindent 4 }}
  ports:
    - name: wireguard
      port: {{ .Values.wireguard.port }}
      targetPort: wireguard
      protocol: UDP
