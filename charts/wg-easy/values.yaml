# wg-easy: a WireGuard VPN server plus its web admin, on the pod network.
# Clients connect to wg.agu.com.ar:51820/udp (DNS-only record, router forward)
# and leave through the home IP; the admin lives at vpn.agu.com.ar.
# See docs/vpn.md.

revisionHistoryLimit: 1
image:
  # Our fork (github.com/frodoagu/wg-easy, branch feat/per-user-clients):
  # upstream master plus per-user client ownership and OAUTH_ADMIN_EMAILS.
  # The fork's CI (.github/workflows/fork-image.yml) tags each push with the
  # branch name and the sha. Argo CD Image Updater follows the branch tag and
  # pins its digest into image.tag (like origin-firewall), so what runs is an
  # immutable digest — don't hand-edit it.
  repository: ghcr.io/frodoagu/wg-easy
  tag: "feat-per-user-clients@sha256:473807098f1450de17c008e7797d5f20ea2e64e56acb1f4370ddce6a076c1c4f"
  digest: ""
  pullPolicy: IfNotPresent
# The image holds nothing private (the fork is public), so the GHCR package is
# public and needs no pull secret. GHCR creates it PRIVATE on the first push:
# flip it once (GitHub > Packages > wg-easy > Change visibility) or the pod
# sits in ImagePullBackOff.
imagePullSecrets: []
# Sets the pod netns' forwarding sysctls. They aren't on Kubernetes' "safe"
# list, so a privileged init container writes them instead of
# securityContext.sysctls (which would need kubelet --allowed-unsafe-sysctls).
sysctlImage: "docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec"
wireguard:
  # Public endpoint the client configs point at. Must be a DNS-only (grey)
  # Cloudflare record: Cloudflare can't proxy UDP. charts/cloudflare-ddns
  # keeps it in `dnsOnly`.
  host: wg.agu.com.ar
  # Also the pod's hostPort on the node (no Service: see deployment.yaml).
  port: 51820
  # Pi-hole: ad blocking and .lan names for the clients too.
  dns: "192.168.0.100"
  # Full tunnel, so everything leaves through the home IP. ::/0 sends IPv6 into
  # the tunnel (where there is none) instead of leaking it past the VPN.
  allowedIps: "0.0.0.0/0,::/0"
# The UI's peer: Traefik in the pod CIDR. wg-easy only trusts X-Forwarded-* from
# here, and builds the Google OAuth redirect URI from them.
trustedProxies: "10.42.0.0/16"
# Sign-in is Google only, and only for accounts whose email is already a
# wg-easy user (scripts/vpn-user.sh adds them). Those emails live in the
# database, never in git. Same OAuth client as oauth2-proxy and Argo CD.
oauth:
  # Keys OAUTH_GOOGLE_CLIENT_ID / OAUTH_GOOGLE_CLIENT_SECRET.
  existingSecret: wg-easy-oauth
  # Key OAUTH_ADMIN_EMAILS (comma-separated): who gets the admin role. Sealed so
  # the emails stay out of this public repo. On every Google sign-in the fork
  # re-syncs the role of password-less users: listed → admin, everyone else →
  # client (sees and manages only the devices they created, can't change their
  # addresses or routes).
  adminsSecret: wg-easy-admins
# wg-easy reads INIT_* on the first start only, to skip its setup wizard. The
# admin it creates has a random password that nobody uses: password sign-in is
# off. Key INIT_PASSWORD.
init:
  username: bootstrap
  existingSecret: wg-easy-init
service:
  # The admin UI, for the IngressRoute only.
  port: 51821
ingress:
  enabled: true
  host: vpn.agu.com.ar
  certResolver: letsencrypt
  # No google-auth here: wg-easy's own Google sign-in is the gate, so people
  # outside oauth2-proxy's allowlist can use the VPN admin without reaching
  # the other dashboards.
  middlewares: []
# Prometheus metrics on the UI port (/metrics/prometheus): per-client traffic
# and handshakes, read by a VMPodScrape for the "WireGuard — VPN" dashboard in
# charts/monitoring. wg-easy keeps the on/off switch in its database (Admin >
# General), so a postStart hook switches it on at every start. No bearer
# password: the IngressRoute never routes /metrics, so only the cluster reaches it.
metrics:
  enabled: true
persistence:
  # SQLite database (users, clients, keys) + the generated wg0.conf.
  size: 100Mi
  accessMode: ReadWriteOnce
  storageClass: ""
resources:
  requests:
    cpu: 20m
    memory: 96Mi
  limits:
    memory: 256Mi
nodeSelector: {}
tolerations: []
affinity: {}
