views:
- title: Lavasecarropas
  path: principal
  icon: mdi:washing-machine
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Ahora
      icon: mdi:washing-machine
      heading_style: subtitle
    - type: tile
      entity: sensor.lavasecarropas_estado
      name: Estado
    - type: tile
      entity: sensor.lavasecarropas_fase
      name: Fase del ciclo
  - type: grid
    cards:
    - type: heading
      heading: Tiempo
      icon: mdi:timer-sand
      heading_style: subtitle
    - type: entities
      entities:
      - entity: sensor.lavasecarropas_tiempo_restante
        name: Faltan
      - entity: sensor.lavasecarropas_fin_estimado
        name: Termina a las
        format: time
  - type: grid
    cards:
    - type: heading
      heading: Programa
      icon: mdi:playlist-music
      heading_style: subtitle
    - type: tile
      entity: sensor.lavasecarropas_programa
      name: Programa
    - type: tile
      entity: sensor.lavasecarropas_temperatura
      name: Temperatura
    - type: tile
      entity: sensor.lavasecarropas_centrifugado
      name: Centrifugado
    - type: tile
      entity: sensor.lavasecarropas_nivel_de_suciedad
      name: Nivel de suciedad
    - type: tile
      entity: sensor.lavasecarropas_nivel_de_secado
      name: Nivel de secado
  - type: grid
    cards:
    - type: heading
      heading: Opciones
      icon: mdi:tune-variant
      heading_style: subtitle
    - type: tile
      entity: sensor.lavasecarropas_opciones_activas
      name: Opciones activas
    - type: tile
      entity: sensor.lavasecarropas_inicio_diferido
      name: Inicio diferido
    - type: tile
      entity: binary_sensor.lavasecarropas_vapor
      name: Vapor
  - type: grid
    cards:
    - type: heading
      heading: Historial y diagnostico
      icon: mdi:chart-timeline-variant
      heading_style: subtitle
    - type: tile
      entity: sensor.lavasecarropas_error
      name: Codigo de error
    - type: history-graph
      hours_to_show: 12
      entities:
      - entity: sensor.lavasecarropas_fase
        name: Fase
      - entity: sensor.lavasecarropas_estado
        name: Estado
- title: Control
  path: control
  icon: mdi:play-box-outline
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Que lavar
      icon: mdi:playlist-check
      heading_style: subtitle
    - type: entities
      entities:
      - entity: input_select.lavasecarropas_preset
        name: Preset
    - type: conditional
      conditions:
      - condition: state
        entity: input_select.lavasecarropas_preset
        state: Manual
      card:
        type: entities
        title: A mano
        entities:
        - entity: input_select.lavasecarropas_programa_manual
          name: Programa
        - entity: input_select.lavasecarropas_temperatura_manual
          name: Temperatura
        - entity: input_select.lavasecarropas_centrifugado_manual
          name: Centrifugado
        - entity: input_select.lavasecarropas_secado_manual
          name: Secado
    - type: button
      name: Seleccionar
      icon: mdi:tray-arrow-down
      tap_action:
        action: perform-action
        perform_action: script.lavasecarropas_aplicar
        data:
          arrancar: false
  - type: grid
    cards:
    - type: heading
      heading: Cargado en el equipo
      icon: mdi:check-decagram
      heading_style: subtitle
    - type: entities
      entities:
      - entity: sensor.lavasecarropas_programa
        name: Programa
      - entity: sensor.lavasecarropas_temperatura
        name: Temperatura
      - entity: sensor.lavasecarropas_centrifugado
        name: Centrifugado
      - entity: sensor.lavasecarropas_nivel_de_secado
        name: Secado
      - entity: sensor.lavasecarropas_tiempo_restante
        name: Duracion
      - entity: sensor.lavasecarropas_estado
        name: Estado
    - type: button
      name: Arrancar
      icon: mdi:play
      tap_action:
        action: perform-action
        perform_action: script.lavasecarropas_aplicar
        data:
          arrancar: true
        confirmation:
          text: Arrancar el ciclo con el programa seleccionado?
    - type: button
      name: Detener
      icon: mdi:stop
      tap_action:
        action: perform-action
        perform_action: script.lavasecarropas_detener
        confirmation:
          text: Cancelar el ciclo en curso?
