# Telegram bot token for Home Assistant's `notify.telegram` (the gas-level
# alerts in packages/gas.yaml). Injected into the pod as TELEGRAM_BOT_TOKEN and
# read back with HA's `!env_var` tag -- see values.yaml `telegram.*` and
# docs/gas-mopeka.md.
#
# It is the SAME bot token as monitoring's `alertmanager-telegram`, but the
# ciphertext is NOT reusable: SealedSecrets are strict-scoped, so it is bound to
# name+namespace and only decrypts as `home-assistant/ha-telegram`. Rotating the
# bot means re-sealing BOTH files.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ha-telegram
  namespace: home-assistant
spec:
  encryptedData:
    bot-token: 
  template:
    metadata:
      name: ha-telegram
      namespace: home-assistant
      annotations:
        sealedsecrets.bitnami.com/managed: 'true'
    type: Opaque
