# HA package: the bathroom light by the hour. The WiZ motion sensor's rule in
# the WiZ app turns the bathroom lamp on and off; whenever it comes on from
# outside HA (the sensor or the WiZ app), this sets its brightness and colour
# for the time of day, and follows them while it stays on. Every change is a
# straight line between these points:
#
#   21:00             100 %  6500 K (cool, all day until here)
#   21:30             100 %  5250 K (starts dimming)
#   22:00              90 %  4000 K
#   23:00              70 %  4000 K
#   00:00              40 %  4000 K
#   01:00              10 %  4000 K
#   02:00 -> sunrise   10 %  amber (no blue, to spare sleep); 2200 K right before
#   sunrise + 1 h     100 %  6500 K
#
# Nothing gets brighter before sunrise. Amber is RGB, so it can't be a point on
# a white line: the lamp crosses into it at 02:00 and out of it at sunrise,
# both times at its warmest white (2200 K), where the step is smallest.
# `sensor.lampara_bano_brillo` is that curve (colour in its attributes).
#
# It doesn't watch the wiz occupancy entity: that one only follows changes the
# sensor makes, so after an off from HA or the app it stays `on` and never fires
# again. A turn-on from HA (UI, Google, a script) is left alone.
# See docs/home-assistant.md#bathroom-light.

template:
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    action:
      - variables:
          # Minutes since noon (custom_templates/curva.jinja): 21:00 is 540.
          curva: >-
            {%- from 'curva.jinja' import curva, sol, minutos %}
            {%- set amanecer = sol('next_rising') | int %}
            {%- set p = [[540, 100, 6500], [570, 100, 5250], [600, 90, 4000], [660, 70, 4000], [720, 40, 4000],
                         [780, 10, 4000], [840, 10, 2200], [amanecer, 10, 2200], [amanecer + 60, 100, 6500]] %}
            {%- set m = minutos(now()) | int %}
            {{- {'brillo': curva(p, 1, m) | float | round(0) | int,
                 'kelvin': (curva(p, 2, m) | float / 50) | round(0) | int * 50,
                 'ambar': 840 <= m < amanecer} }}
    sensor:
      - name: Lámpara baño - Brillo según la hora
        unique_id: lampara_bano_brillo
        default_entity_id: sensor.lampara_bano_brillo
        unit_of_measurement: "%"
        icon: mdi:brightness-6
        state: "{{ curva.brillo }}"
        attributes:
          kelvin: "{{ curva.kelvin }}"
          ambar: "{{ curva.ambar }}"

automation:
  - id: luces_bano
    alias: Luces baño - Brillo según la hora
    description: >-
      Cuando la luz del baño se prende desde afuera de HA (el sensor de
      movimiento o la app WiZ), le pone el brillo y el color de la hora, y los
      sigue mientras está prendida, todo en línea recta: fría y al 100 % hasta
      las 21, empieza a bajar a las 21:30, neutra y al 90 % a las 22, 70 % a
      las 23, 40 % a las 0 y 10 % a la 1, ámbar de las 2 al amanecer y vuelve
      a fría al 100 % en la hora siguiente. Si alguien la cambia, la deja hasta que se vuelva a prender.
    trigger:
      - platform: state
        entity_id: light.lampara_bano
        from: "off"
        to: "on"
        id: prendida
      - platform: state
        entity_id: sensor.lampara_bano_brillo
        id: curva
    condition:
      - condition: state
        entity_id: light.lampara_bano
        state: "on"
      - "{{ is_number(states('sensor.lampara_bano_brillo')) }}"
    action:
      - variables:
          brillo: "{{ states('sensor.lampara_bano_brillo') | int }}"
          kelvin: "{{ state_attr('sensor.lampara_bano_brillo', 'kelvin') | int }}"
          ambar: "{{ state_attr('sensor.lampara_bano_brillo', 'ambar') | bool }}"
          # A change made through HA carries the user or the calling automation.
          desde_afuera: >-
            {{- trigger.id == 'prendida' and trigger.to_state.context.user_id is none
                and trigger.to_state.context.parent_id is none }}
          # Still where the curve was before this step: same brightness (1-2 %
          # of slack for the 0-255 round trip) and same colour.
          sigue: >-
            {%- set antes = trigger.from_state if trigger.id == 'curva' else none %}
            {%- set l = states.light.lampara_bano %}
            {%- set pct = (l.attributes.brightness | int(0) * 100 / 255) | round(0) | int %}
            {{- antes is not none and is_number(antes.state)
                and (pct - antes.state | int) | abs <= 2
                and (l.attributes.color_mode == 'rgbw' if antes.attributes.ambar
                     else l.attributes.color_mode == 'color_temp'
                          and (l.attributes.color_temp_kelvin | int(0) - antes.attributes.kelvin | int(0)) | abs <= 50) }}
      - if: "{{ desde_afuera or sigue }}"
        then:
          - if: "{{ ambar }}"
            then:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.lampara_bano
                data:
                  brightness_pct: "{{ brillo }}"
                  rgb_color: [255, 110, 0]
            else:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.lampara_bano
                data:
                  brightness_pct: "{{ brillo }}"
                  color_temp_kelvin: "{{ kelvin }}"
    mode: queued
