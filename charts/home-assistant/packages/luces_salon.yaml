# HA package: the living-room lamp's white follows the sun.
#
#   sunrise          -> sunset          6500 K (cool)
#   sunset           -> sunset + 2 h    4000 K (neutral)
#   sunset + 2 h     -> sunrise         2700 K (warm)
#
# It sets the colour temperature when the lamp comes on and at each change while
# it's on, and only that: brightness and on/off stay with whoever switched it. A
# lamp showing a colour or a WiZ scene is left alone.
# See docs/home-assistant.md#living-room-lamp.

automation:
  - id: luces_salon
    alias: Luces salón - Blanco según el sol
    description: >-
      Pone la lámpara del salón en luz fría de día, neutra las 2 horas después
      del atardecer y cálida desde ahí hasta el amanecer, al prenderse y en
      cada cambio. No toca el brillo ni una lámpara con color o escena.
    trigger:
      - platform: state
        entity_id: light.lampara_salon
        from: "off"
        to: "on"
      - platform: sun
        event: sunrise
        id: frio
      - platform: sun
        event: sunset
        id: neutro
      - platform: sun
        event: sunset
        offset: "02:00:00"
        id: calido
      - platform: homeassistant
        event: start
    condition:
      - condition: state
        entity_id: light.lampara_salon
        state: "on"
      - "{{ state_attr('light.lampara_salon', 'color_mode') == 'color_temp' }}"
      - "{{ state_attr('light.lampara_salon', 'effect') in [none, 'off'] }}"
    action:
      - variables:
          # A sun trigger names its own phase: at that instant `sun.sun` may
          # not have moved on yet. `next_setting` is today's or tomorrow's
          # sunset, a minute or two apart, so only its time of day is used.
          kelvin: >-
            {%- set ocaso = state_attr('sun.sun', 'next_setting') | as_datetime(none) %}
            {%- set ocaso = today_at((ocaso | as_local).strftime('%H:%M')) if ocaso else none %}
            {%- if trigger.id == 'frio' %}6500
            {%- elif trigger.id == 'neutro' %}4000
            {%- elif trigger.id == 'calido' %}2700
            {%- elif is_state('sun.sun', 'above_horizon') %}6500
            {%- elif ocaso is not none and ocaso <= now() < ocaso + timedelta(hours=2) %}4000
            {%- else %}2700
            {%- endif %}
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: light.lampara_salon
        data:
          color_temp_kelvin: "{{ kelvin }}"
    mode: queued
