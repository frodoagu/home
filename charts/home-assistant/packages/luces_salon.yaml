# HA package: the living-room lamp's white follows the sun, in straight lines.
#
#   sunrise          -> sunrise + 1 h     2700 K up to 6500 K
#   sunrise + 1 h    -> sunset            6500 K (cool)
#   sunset           -> sunset + 2 h      6500 K down to 4000 K (neutral)
#   sunset + 2 h     -> 23:30             4000 K down to 2700 K (warm)
#   23:30            -> sunrise           2700 K
#
# `sensor.lampara_salon_blanco` is that curve. The lamp takes it when it comes
# on and on HA start, and follows each step while it's on as long as it still
# sits where the curve was, so a white picked by hand stays until the next
# turn-on. Colour temperature only: brightness and on/off stay with whoever
# switched it, and a lamp showing a colour or a WiZ scene is left alone.
#
# Except after a power cut or an HA start: the lamp also hangs off a wall
# switch, and back from `unavailable` it boots in its last state. Then it gets
# the white and the lamps' brightness for the hour (`sensor.brillo_segun_la_hora`,
# luces_llave.yaml, the same line as the evening ramp), whatever it was showing.
# An HA start restores it as `unavailable` too, so it gets the same, except
# while the presence simulation (which drives this lamp) runs.
# See docs/home-assistant.md#living-room-lamp.

template:
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    action:
      - variables:
          # Minutes since noon (custom_templates/curva.jinja): 23:30 is 690.
          curva: >-
            {%- from 'curva.jinja' import curva, sol %}
            {%- set amanecer = sol('next_rising') | int %}
            {%- set ocaso = sol('next_setting') | int %}
            {%- set p = [[ocaso, 6500], [ocaso + 120, 4000], [690, 2700], [amanecer, 2700], [amanecer + 60, 6500]] %}
            {{- (curva(p) | float / 50) | round(0) | int * 50 }}
    sensor:
      - name: Lámpara salón - Blanco según el sol
        unique_id: lampara_salon_blanco
        default_entity_id: sensor.lampara_salon_blanco
        unit_of_measurement: K
        icon: mdi:white-balance-sunny
        state: "{{ curva }}"

automation:
  - id: luces_salon
    alias: Luces salón - Blanco según el sol
    description: >-
      Lleva el blanco de la lámpara del salón en línea recta: fría de día, baja
      a neutra en las 2 horas después del atardecer y a cálida a las 23:30, y
      vuelve a fría en la hora después del amanecer. Lo pone al prenderse y lo
      sigue mientras está prendida, salvo que alguien haya elegido otro blanco.
      No toca el brillo ni una lámpara con color o escena, salvo cuando vuelve
      la corriente (la llave de la pared): ahí le pone el blanco y el brillo de
      la hora.
    trigger:
      - platform: state
        entity_id: light.lampara_salon
        from: "off"
        to: "on"
        id: prendida
      - platform: homeassistant
        event: start
        id: prendida
      - platform: state
        entity_id: sensor.lampara_salon_blanco
        id: curva
      - platform: state
        entity_id: light.lampara_salon
        from: unavailable
        to: "on"
        id: corriente
    condition:
      - condition: state
        entity_id: light.lampara_salon
        state: "on"
      - "{{ is_number(states('sensor.lampara_salon_blanco')) }}"
    action:
      # An HA start restores the lamp as `unavailable` before the wiz
      # integration loads it, so it comes back through here too.
      - if: >-
          {%- set arranque = trigger.id == 'corriente'
                and trigger.from_state.attributes.restored is defined
                and now() - trigger.from_state.last_changed <= timedelta(minutes=1) %}
          {%- set simulacion = is_state('input_boolean.simulacion_presencia_ausencia', 'on')
                and is_state('input_boolean.simulacion_presencia_pausa', 'off') %}
          {{- trigger.id == 'corriente' and not (arranque and simulacion) }}
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.lampara_salon
            data:
              brightness_pct: "{{ states('sensor.brillo_segun_la_hora') | int(100) }}"
              color_temp_kelvin: "{{ states('sensor.lampara_salon_blanco') | int }}"
          - stop: Back from a power cut or an HA start.
      - condition: template
        value_template: >-
          {{- state_attr('light.lampara_salon', 'color_mode') == 'color_temp'
              and state_attr('light.lampara_salon', 'effect') in [none, 'off'] }}
      - variables:
          kelvin: "{{ states('sensor.lampara_salon_blanco') | int }}"
          actual: "{{ state_attr('light.lampara_salon', 'color_temp_kelvin') | int(0) }}"
          # Still where the curve was before this step.
          sigue: >-
            {{- trigger.id == 'curva' and trigger.from_state is not none
                and is_number(trigger.from_state.state)
                and (actual - trigger.from_state.state | int) | abs <= 50 }}
      - if: "{{ (trigger.id == 'prendida' or sigue) and actual != kelvin }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: light.lampara_salon
            data:
              color_temp_kelvin: "{{ kelvin }}"
    mode: queued
