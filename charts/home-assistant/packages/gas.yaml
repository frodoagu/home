# HA package: level of the 45 kg gas cylinder (Mopeka Pro Check Universal, via
# the native `mopeka` integration). Full context in docs/gas-mopeka.md.
#
# `tank_level` is the LIQUID HEIGHT in mm above the sensor (stuck to the BOTTOM
# of the cylinder, firing upward): more gas => bigger reading, empty = 0 mm.
#
# The chain: `tank_level` (raw) -> `gas_altura` (drops the double echo) ->
# `gas_altura_suave` (moving average) -> `gas_restante` (kg) -> level % and
# `gas_bajo`. The height-to-kg conversion lives in ONE place, `gas_restante`.
# The `availability` guards cover startup, so initialization order doesn't
# matter.
#
# ┌─ CYLINDER CONSTANTS ─────────────────────────────────────────────────────────┐
# │ a      = 0.0748 m²  inner cross-section. CALIBRATED on a full cylinder:      │
# │                     mounted 2026-08-23, the height extrapolated to that      │
# │                     moment is 1168 mm at 11 °C, and solving 45 kg from it    │
# │                     gives this section (31 cm equivalent diameter, 97 cm of  │
# │                     perimeter: checkable with a tape).                       │
# │ v_tubo = 0.108 m³   total inner volume. NOT calibrated: the typical capacity │
# │                     of a 45 kg cylinder. Usually stamped on the collar as    │
# │                     water capacity, in litres.                               │
# └──────────────────────────────────────────────────────────────────────────────┘
# `a` barely depends on `v_tubo` (moving v_tubo between 0.100 and 0.115 shifts
# `a` 0.5 %): at a full cylinder the vapour term weighs almost nothing. `v_tubo`
# matters at the other end, where it sets the ~1.6 kg vapour floor at height 0.
# Both are written inside `gas_restante`; change them there and nowhere else.
template:
  # With a short liquid column the direct echo is weak and the sensor latches
  # onto the second bounce (surface -> floor -> surface), reporting ~2x the
  # real height. An upward jump of 1.4x-3x is that double echo: it is dropped,
  # holding the last good height. Above 3x it's a refill and passes. Above
  # 300 mm the direct echo dominates and every reading passes.
  #
  # The `condition` lets only positive readings through: otherwise an
  # `unknown` from the sensor would come in as 0 mm, an empty cylinder. So this
  # entity holds its last good value instead of going unavailable, and the
  # alert that readings keep coming (`gas_aviso_sin_datos`) watches the raw
  # sensor.
  - trigger:
      - platform: state
        entity_id: sensor.pro_check_universal_5343_tank_level
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state | float(0) > 0 }}
    sensor:
      - name: "Gas altura"
        unique_id: gas_altura
        unit_of_measurement: "mm"
        device_class: distance
        state_class: measurement
        icon: mdi:propane-tank
        state: >-
          {% set raw = trigger.to_state.state | float(0) %}
          {% set prev = this.state | float(raw) %}
          {{ raw if prev >= 300 or raw < prev * 1.4 or raw > prev * 3 else prev }}

  - sensor:
      # Gas mass in the cylinder, adding BOTH PHASES. The liquid expands ~0.3 %
      # per °C and the vapour condenses as it cools, so the HEIGHT moves with
      # no gas used: up to 52 mm over a 20 °C swing on a full cylinder, with
      # the sign flipped near the bottom (condensation wins there and cooling
      # RAISES the level). Counting both phases cancels both: condensing gas
      # moves from one term to the other and the total stays put.
      #
      # Saturated-propane correlations, fitted to tables within 1 % between 0
      # and 40 °C (kg/m³, T in °C). A propane-butane mix raises rho_liq and
      # lowers rho_vap noticeably; they would need refitting.
      #
      # Height 0 does NOT give 0 kg: ~1.6 kg of vapour remain, real gas that
      # still burns. Hence the % below floors at ~3.9 % and the alerts are in kg.
      #
      # The temperature comes in the same advertisement as the height, so a
      # fresh height means a fresh temperature; the 15 °C default is a safety
      # net.
      - name: "Gas restante"
        unique_id: gas_restante
        unit_of_measurement: "kg"
        device_class: weight
        state_class: measurement
        icon: mdi:propane-tank
        availability: >-
          {{ states('sensor.gas_altura_suave') not in ['unknown', 'unavailable']
             and states('sensor.gas_altura_suave') | float(0) > 0 }}
        state: >-
          {% set a = 0.0748 %}
          {% set v_tubo = 0.108 %}
          {% set h = states('sensor.gas_altura_suave') | float(0) / 1000 %}
          {% set t = states('sensor.pro_check_universal_5343_temperature') | float(15) %}
          {% set rho_liq = 528 - 1.5 * t %}
          {% set rho_vap = 10.8 + 0.27 * t + 0.006 * t * t %}
          {% set v_liq = [a * h, v_tubo] | min %}
          {{ (rho_liq * v_liq + rho_vap * (v_tubo - v_liq)) | round(2) }}

      # The decimals are in the state: the template YAML schema has no
      # `suggested_display_precision`, and raising the precision in the UI on
      # an integer state only adds zeros.
      - name: "Gas nivel"
        unique_id: gas_nivel
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:propane-tank
        availability: >-
          {{ states('sensor.gas_restante') not in ['unknown', 'unavailable'] }}
        state: >-
          {{ min(max(states('sensor.gas_restante') | float(0) / 45 * 100, 0), 100) | round(2) }}

  - binary_sensor:
      # Threshold in kg, not %: the % includes the vapour and floors at ~3.9 %.
      #
      # Long `delay_on`: the moving average already smooths the sloshing, and
      # 2 h straight under the threshold keep a run of bad readings from
      # alerting.
      - name: "Gas bajo"
        unique_id: gas_bajo
        device_class: problem
        icon: mdi:propane-tank-outline
        availability: >-
          {{ states('sensor.gas_restante') not in ['unknown', 'unavailable'] }}
        state: >-
          {{ states('sensor.gas_restante') | float(99) < 10 }}
        delay_on: "02:00:00"

# Burning gas boils the liquid and the surface sloshes: the same hour can vary
# ±20-40 mm (2-4 points of %). The moving average takes that noise out, and the
# daily thermal swing with it. The window is short next to the days of gas
# left, and the alerts add 2 h of debounce on top.
sensor:
  - platform: filter
    name: "Gas altura suave"
    unique_id: gas_altura_suave
    entity_id: sensor.gas_altura
    filters:
      - filter: time_simple_moving_average
        window_size: "03:00:00"
        precision: 0

# Alerts go through `script.avisar_telegram` (avisos.yaml).
automation:
  - id: gas_aviso_bajo
    alias: Gas - Aviso de nivel bajo
    description: >-
      Avisa por Telegram cuando quedan menos de 10 kg. Dispara en la transición
      del binary_sensor, que ya trae 2 h de debounce, así que manda un solo
      mensaje por cruce de umbral y no repite mientras siga bajo.
    trigger:
      - platform: state
        entity_id: binary_sensor.gas_bajo
        from: "off"
        to: "on"
    action:
      - action: script.avisar_telegram
        data:
          mensaje: >-
            Gas bajo: el tubo está al {{ states('sensor.gas_nivel') }}%
            (~{{ states('sensor.gas_restante') }} kg). Ir pidiendo el recambio.
    mode: single

  - id: gas_aviso_critico
    alias: Gas - Aviso de nivel crítico
    description: >-
      Segundo aviso a los 6 kg, que es donde avisaba el 10% del cálculo por
      altura sola. En kg y no en %, por lo mismo que `gas_bajo`: el % ahora
      cuenta el vapor y tiene piso en ~3,9%. `for` de 2 h por la misma razón que
      el binary_sensor: filtrar lecturas sueltas malas. numeric_state sólo
      dispara al cruzar el umbral, así que no repite.
    trigger:
      - platform: numeric_state
        entity_id: sensor.gas_restante
        below: 6
        for: "02:00:00"
    action:
      - action: script.avisar_telegram
        data:
          mensaje: >-
            Gas crítico: el tubo está al {{ states('sensor.gas_nivel') }}%
            (~{{ states('sensor.gas_restante') }} kg). Se acaba.
    mode: single

  - id: gas_aviso_bateria_sensor
    alias: Gas - Batería baja del sensor
    description: >-
      La CR2032 del Mopeka. Sin esto el monitoreo se muere en silencio: el
      sensor deja de emitir y nadie se entera hasta quedarse sin gas.
    trigger:
      - platform: numeric_state
        entity_id: sensor.pro_check_universal_5343_battery
        below: 15
        for: "01:00:00"
    action:
      - action: script.avisar_telegram
        data:
          mensaje: >-
            Sensor de gas: la batería del Mopeka está al
            {{ states('sensor.pro_check_universal_5343_battery') }}%. Cambiar la CR2032.
    mode: single

  - id: gas_aviso_sin_datos
    alias: Gas - Sin datos del sensor
    description: >-
      La otra forma de morir en silencio: el sensor sale de rango Bluetooth, se
      le agota la batería de golpe, o se despega del tubo. Mira el sensor CRUDO,
      que es el único de la cadena que se cae cuando dejan de llegar
      advertisements — `gas_altura` retiene el último valor bueno a propósito.
      12 h de tolerancia para no avisar por un corte breve; cualquier lectura
      válida en el medio reinicia la cuenta.
    trigger:
      - platform: state
        entity_id: sensor.pro_check_universal_5343_tank_level
        to:
          - "unavailable"
          - "unknown"
        for: "12:00:00"
    action:
      - action: script.avisar_telegram
        data:
          mensaje: >-
            Sensor de gas: hace 12 h que no llegan lecturas del tubo (Mopeka Pro
            Check Universal). Revisar el emparejamiento Bluetooth en HA o la
            batería del sensor.
    mode: single
