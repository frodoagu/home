# HA package: nivel del tubo de gas de 45 kg (Mopeka Pro Check Universal, vía la
# integración nativa `mopeka`). Contexto completo en docs/gas-mopeka.md.
#
# `tank_level` es la ALTURA DE LÍQUIDO en mm sobre el sensor (va pegado ABAJO del
# tubo, dispara hacia arriba): más gas => lectura más grande, tubo vacío = 0 mm.
#
# La cadena es: `tank_level` (crudo) -> `gas_altura` (descarta el eco doble) ->
# `gas_altura_suave` (promedio móvil) -> `gas_restante` (kg) -> nivel % y
# `gas_bajo`. La conversión de altura a kg vive en UN solo lugar, en
# `gas_restante`: es larga y triplicarla sería peor que encadenar. Las guardas de
# `availability` cubren el arranque, así que el orden de inicialización no importa.
#
# ┌─ CONSTANTES DEL TUBO (las dos son medibles, ninguna está calibrada todavía) ─┐
# │ a      = 0,0811 m²  sección interna. Se saca con una cinta métrica alrededor │
# │                     del tubo: a = C² / (4π). Este valor sale de suponer      │
# │                     1090 mm de líquido a tubo lleno, y da 32 cm de diámetro  │
# │                     equivalente — un 45 kg real mide más, así que sobreestima│
# │                     la altura y subestima la sección.                        │
# │ v_tubo = 0,108 m³   volumen interno total. Suele venir estampado en la cofia │
# │                     como capacidad de agua, en litros.                       │
# └──────────────────────────────────────────────────────────────────────────────┘
# Están escritas dentro de `gas_restante`; al medirlas hay que tocarlas ahí y
# nada más.
template:
  # Con la columna de líquido corta el eco directo es débil y el sensor engancha
  # el segundo rebote (superficie -> fondo -> superficie), así que reporta ~2× la
  # altura real. Un salto hacia arriba de entre 1,4× y 3× es ese eco doble y se
  # descarta reteniendo la última altura buena; por encima de 3× es una recarga y
  # se acepta. Arriba de 300 mm el eco directo domina y la lectura pasa derecho.
  #
  # La `condition` deja pasar sólo lecturas positivas: sin ella un `unknown` del
  # sensor entraría como 0 mm y se leería como tubo vacío. Como contrapartida
  # esta entidad retiene el último valor bueno en vez de quedar no disponible,
  # así que quien vigila que sigan llegando lecturas es `gas_aviso_sin_datos`,
  # apuntado al sensor crudo.
  - trigger:
      - platform: state
        entity_id: sensor.pro_check_universal_5343_tank_level
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state.state not in ['unknown', 'unavailable']
             and trigger.to_state.state | float(0) > 0 }}
    sensor:
      - name: "Gas altura"
        unique_id: gas_altura
        unit_of_measurement: "mm"
        device_class: distance
        state_class: measurement
        icon: mdi:propane-tank
        state: >-
          {% set raw = trigger.to_state.state | float(0) %}
          {% set prev = this.state | float(raw) %}
          {{ raw if prev >= 300 or raw < prev * 1.4 or raw > prev * 3 else prev }}

  - sensor:
      # Masa de gas en el tubo, sumando LAS DOS FASES. El líquido se dilata ~0,3 %
      # por °C y el vapor se condensa cuando baja la temperatura, así que la
      # ALTURA se mueve sola aunque no se consuma nada: hasta 52 mm en un swing
      # de 20 °C con el tubo lleno, y con el signo dado vuelta cerca del fondo
      # (ahí manda la condensación y enfriar SUBE el nivel). Contar las dos fases
      # cancela las dos cosas: al condensarse, el gas pasa de un término al otro
      # y el total no se mueve.
      #
      # Correlaciones de propano saturado, ajustadas a tabla con <1 % de error
      # entre 0 y 40 °C (kg/m³, T en °C). Si el tubo trajera mezcla con butano,
      # rho_liq sube y rho_vap baja bastante — habría que reajustarlas.
      #
      # Con altura 0 esto NO da 0 kg: quedan ~1,6 kg de vapor, que son gas real y
      # todavía se queman. Por eso el % de abajo tiene piso en ~3,9 % y por eso
      # los avisos van por kg y no por %.
      #
      # La temperatura viene en el mismo advertisement que la altura, así que si
      # la altura está fresca la temperatura también; el default de 15 °C es sólo
      # una red de contención.
      - name: "Gas restante"
        unique_id: gas_restante
        unit_of_measurement: "kg"
        device_class: weight
        state_class: measurement
        icon: mdi:propane-tank
        availability: >-
          {{ states('sensor.gas_altura_suave') not in ['unknown', 'unavailable']
             and states('sensor.gas_altura_suave') | float(0) > 0 }}
        state: >-
          {% set a = 0.0811 %}
          {% set v_tubo = 0.108 %}
          {% set h = states('sensor.gas_altura_suave') | float(0) / 1000 %}
          {% set t = states('sensor.pro_check_universal_5343_temperature') | float(15) %}
          {% set rho_liq = 528 - 1.5 * t %}
          {% set rho_vap = 10.8 + 0.27 * t + 0.006 * t * t %}
          {% set v_liq = [a * h, v_tubo] | min %}
          {{ (rho_liq * v_liq + rho_vap * (v_tubo - v_liq)) | round(2) }}

      # Los decimales van en el estado: el schema YAML de template no tiene
      # `suggested_display_precision`, así que subir la precisión en la UI sobre
      # un estado entero sólo agrega ceros.
      - name: "Gas nivel"
        unique_id: gas_nivel
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:propane-tank
        availability: >-
          {{ states('sensor.gas_restante') not in ['unknown', 'unavailable'] }}
        state: >-
          {{ min(max(states('sensor.gas_restante') | float(0) / 45 * 100, 0), 100) | round(2) }}

  - binary_sensor:
      # Umbral en kg, no en %: el % ahora incluye el vapor y tiene piso en ~3,9 %,
      # así que "20 %" ya no significa lo mismo. 10 kg reproduce el punto de aviso
      # que daba el 20 % del cálculo por altura sola.
      #
      # `delay_on` largo: aunque el promedio móvil ya alisa el chapoteo, 2 h
      # continuas bajo el umbral evitan avisar por una racha de lecturas malas.
      - name: "Gas bajo"
        unique_id: gas_bajo
        device_class: problem
        icon: mdi:propane-tank-outline
        availability: >-
          {{ states('sensor.gas_restante') not in ['unknown', 'unavailable'] }}
        state: >-
          {{ states('sensor.gas_restante') | float(99) < 10 }}
        delay_on: "02:00:00"

# Consumir gas hace hervir el líquido y la superficie chapotea: la misma hora
# puede variar ±20-40 mm (2-4 puntos de %). El promedio móvil se lleva ese ruido
# y de paso el vaivén térmico diario. La ventana es corta contra los días de
# autonomía que quedan, y las alertas ya traen 2 h de debounce encima.
sensor:
  - platform: filter
    name: "Gas altura suave"
    unique_id: gas_altura_suave
    entity_id: sensor.gas_altura
    filters:
      - filter: time_simple_moving_average
        window_size: "03:00:00"
        precision: 0

# ────────────────────────────────────────────────────────────────────────────
# CÓMO SE MANDA A TELEGRAM. NO por `notify.telegram` ni por un `telegram_bot:`
# en YAML: desde 2026.7 la integración es `config_flow: true` (un bloque
# `telegram_bot:` en un package falla con "cannot be merged, expected a dict")
# y el servicio `notify.telegram` quedó deprecado — se rompe en 2026.8.0.
#
# La forma actual es una ENTIDAD notify por chat id, creada como *subentry*
# (`allowed_chat_ids`) del config entry de Telegram desde la UI, disparada con
# `notify.send_message`. El entity_id NO es un título que uno elige: sale de
# `<nombre del device del bot>_<nombre del chat>`, los dos autocompletados por
# Telegram (el nombre propio del bot vía `getMe()`, y el nombre del contacto al
# agregarlo como chat permitido) — confirmado a mano en esta instancia, dio
# `notify.afuera_telegram_gateway_fede_a` sin haber tipeado ninguna de las dos
# partes. Si el bot se re-crea o se agrega otro chat, VERIFICAR el entity_id
# real en HA en vez de asumirlo — no hay forma de fijarlo desde git.
#
# OJO: `notify.send_message` NO acepta `title` (sólo `message`), por eso el
# título va plegado dentro del mensaje.
# ────────────────────────────────────────────────────────────────────────────
automation:
  - id: gas_aviso_bajo
    alias: Gas - Aviso de nivel bajo
    description: >-
      Avisa por Telegram cuando quedan menos de 10 kg. Dispara en la transición
      del binary_sensor, que ya trae 2 h de debounce, así que manda un solo
      mensaje por cruce de umbral y no repite mientras siga bajo.
    trigger:
      - platform: state
        entity_id: binary_sensor.gas_bajo
        from: "off"
        to: "on"
    action:
      - action: notify.send_message
        target:
          entity_id: notify.afuera_telegram_gateway_fede_a
        data:
          message: >-
            Gas bajo: el tubo está al {{ states('sensor.gas_nivel') }}%
            (~{{ states('sensor.gas_restante') }} kg). Ir pidiendo el recambio.
    mode: single

  - id: gas_aviso_critico
    alias: Gas - Aviso de nivel crítico
    description: >-
      Segundo aviso a los 6 kg, que es donde avisaba el 10% del cálculo por
      altura sola. En kg y no en %, por lo mismo que `gas_bajo`: el % ahora
      cuenta el vapor y tiene piso en ~3,9%. `for` de 2 h por la misma razón que
      el binary_sensor: filtrar lecturas sueltas malas. numeric_state sólo
      dispara al cruzar el umbral, así que no repite.
    trigger:
      - platform: numeric_state
        entity_id: sensor.gas_restante
        below: 6
        for: "02:00:00"
    action:
      - action: notify.send_message
        target:
          entity_id: notify.afuera_telegram_gateway_fede_a
        data:
          message: >-
            Gas crítico: el tubo está al {{ states('sensor.gas_nivel') }}%
            (~{{ states('sensor.gas_restante') }} kg). Se acaba.
    mode: single

  - id: gas_aviso_bateria_sensor
    alias: Gas - Batería baja del sensor
    description: >-
      La CR2032 del Mopeka. Sin esto el monitoreo se muere en silencio: el
      sensor deja de emitir y nadie se entera hasta quedarse sin gas.
    trigger:
      - platform: numeric_state
        entity_id: sensor.pro_check_universal_5343_battery
        below: 15
        for: "01:00:00"
    action:
      - action: notify.send_message
        target:
          entity_id: notify.afuera_telegram_gateway_fede_a
        data:
          message: >-
            Sensor de gas: la batería del Mopeka está al
            {{ states('sensor.pro_check_universal_5343_battery') }}%. Cambiar la CR2032.
    mode: single

  - id: gas_aviso_sin_datos
    alias: Gas - Sin datos del sensor
    description: >-
      La otra forma de morir en silencio: el sensor sale de rango Bluetooth, se
      le agota la batería de golpe, o se despega del tubo. Mira el sensor CRUDO,
      que es el único de la cadena que se cae cuando dejan de llegar
      advertisements — `gas_altura` retiene el último valor bueno a propósito.
      12 h de tolerancia para no avisar por un corte breve; cualquier lectura
      válida en el medio reinicia la cuenta.
    trigger:
      - platform: state
        entity_id: sensor.pro_check_universal_5343_tank_level
        to:
          - "unavailable"
          - "unknown"
        for: "12:00:00"
    action:
      - action: notify.send_message
        target:
          entity_id: notify.afuera_telegram_gateway_fede_a
        data:
          message: >-
            Sensor de gas: hace 12 h que no llegan lecturas del tubo (Mopeka Pro
            Check Universal). Revisar el emparejamiento Bluetooth en HA o la
            batería del sensor.
    mode: single
