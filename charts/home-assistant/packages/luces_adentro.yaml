# HA package: the indoor lamps' evening while Fede is home. 10 min after sunset
# the bedroom, office and living-room lamps come on at 100 % in warm white and
# dim in a straight line to 10 % at 23:30, where they stay until 01:30, when
# they go off while anyone is home (an empty house keeps the simulation's off time).
# With PC-Fede on, they go off when it does, if that's before dawn.
# Getting home inside the ramp's window turns on the lamps that are off at the
# ramp's current level.
# See docs/home-assistant.md#evening-lamps.
#
# The ramp only ever lowers a lamp that is following it: one dimmed by hand
# sits below the ramp, one turned up by hand sits above where the ramp was
# 30 min ago, and both are left alone. It sends brightness only, so a colour
# or scene picked in the evening stays.
#
# With the house empty, simulacion_presencia.yaml drives the same lamps. They
# never act at once: this one needs `binary_sensor.fede_en_casa` on, the
# simulation needs `binary_sensor.casa_ocupada` (Fede or Irupé) off. Lamps the
# simulation left on are below this ramp or less than 30 min ahead of it, so
# after a return they hold until the ramp comes down to them, or follow it at
# once.
#
# While PC-Fede is on, the office lamp is out of all of this: it goes to violet
# at 100 % when the PC comes on, at any hour, and the ramp leaves it alone.
# When the PC goes off it returns to warm white at the ramp's level (10 % from
# 23:30 to 01:30, off after that and in daytime). The PC is on while it has
# queried Pi-hole in the last 5 min (it queries every 1-2 min while on, never
# when off).

rest:
  - resource: http://192.168.0.100:8080/api/queries?client_ip=192.168.0.70&length=1
    scan_interval: 60
    timeout: 10
    sensor:
      - name: PC Fede - última consulta DNS
        unique_id: pc_fede_ultima_consulta_dns
        device_class: timestamp
        icon: mdi:desktop-tower
        value_template: >-
          {%- set q = value_json.queries | default([]) %}
          {{- ((q[0].time if q else 0) | as_datetime).isoformat() }}

template:
  - binary_sensor:
      - name: PC Fede prendida
        unique_id: pc_fede_prendida
        default_entity_id: binary_sensor.pc_fede_prendida
        device_class: power
        state: >-
          {%- set t = states('sensor.pc_fede_ultima_consulta_dns') | as_datetime(none) %}
          {{- t is not none and now() - t < timedelta(minutes=5) }}
        availability: "{{ has_value('sensor.pc_fede_ultima_consulta_dns') }}"

automation:
  - id: luces_adentro
    alias: Luces adentro - Atardecer con Fede en casa
    description: >-
      Con Fede en casa, prende las lámparas del dormitorio, la oficina y el
      salón 10 min después del atardecer al 100 % en blanco cálido y las baja en línea recta
      hasta 10 % a las 23:30. Si llega en ese horario, prende las que están
      apagadas al nivel que corresponde. No baja una lámpara que alguien movió
      a mano. Con la PC de Fede prendida la lámpara de la oficina va violeta
      al 100 % y la rampa no la toca; al apagarse vuelve al blanco cálido.
    trigger:
      - platform: sun
        event: sunset
        offset: "00:10:00"
        id: encender
      - platform: state
        entity_id: binary_sensor.fede_en_casa
        from: "off"
        to: "on"
        id: llegada
      - platform: time_pattern
        minutes: "/5"
        id: rampa
      - platform: state
        entity_id: binary_sensor.pc_fede_prendida
        from: "off"
        to: "on"
        id: pc_prendida
      - platform: state
        entity_id: binary_sensor.pc_fede_prendida
        from: "on"
        to: "off"
        id: pc_apagada
    condition:
      - condition: or
        conditions:
          - condition: trigger
            id: pc_prendida
          - condition: state
            entity_id: binary_sensor.fede_en_casa
            state: "on"
    action:
      - variables:
          # Unavailable counts as on, so a Pi-hole outage never repaints it.
          lamparas: >-
            {{ ['light.lampara_dormitorio_grupo', 'light.lampara_salon']
               + (['light.lampara_oficina'] if is_state('binary_sensor.pc_fede_prendida', 'off') else []) }}
          kelvin: 2700
          color_pc: [7, 0, 255, 0]
          # `next_setting` is today's or tomorrow's sunset, a minute or two
          # apart, so only its time of day is used.
          inicio: >-
            {%- set ocaso = state_attr('sun.sun', 'next_setting') | as_datetime(none) %}
            {{- today_at((ocaso | as_local + timedelta(minutes=10)).strftime('%H:%M')).isoformat() if ocaso else '' }}
          fin: "{{ today_at('23:30').isoformat() }}"
          # The 23:30 tick lands a moment after 23:30.
          dentro: >-
            {%- set i = inicio | as_datetime(none) %}
            {{- i is not none and i <= now() < fin | as_datetime + timedelta(minutes=1) }}
          largo: >-
            {%- set i = inicio | as_datetime(none) %}
            {{- (fin | as_datetime - i).total_seconds() if i else 0 }}
          # The ramp's level now, and 30 min ago (`tope`).
          brillo: >-
            {%- set i = inicio | as_datetime(none) %}
            {%- set avance = (now() - i).total_seconds() / largo if i and largo > 0 else 0 %}
            {{- [[100 - 90 * avance, 10] | max, 100] | min | round(0) | int }}
          tope: >-
            {%- set i = inicio | as_datetime(none) %}
            {%- set avance = (now() - timedelta(minutes=30) - i).total_seconds() / largo if i and largo > 0 else 0 %}
            {{- [[100 - 90 * avance, 10] | max, 100] | min | round(0) | int }}
          # 1-2 % of slack for the 0-255 round trip.
          bajar: >-
            {%- set ns = namespace(lista=[]) %}
            {%- for e in lamparas if is_state(e, 'on') %}
            {%- set pct = (state_attr(e, 'brightness') | int(0) * 100 / 255) | round(0) | int %}
            {%- if brillo + 1 < pct <= tope + 2 %}
            {%- set ns.lista = ns.lista + [e] %}
            {%- endif %}
            {%- endfor %}
            {{- ns.lista }}
          apagadas: "{{ lamparas | select('is_state', 'off') | list }}"
          # Where the office lamp goes when the PC goes off; 0 is off.
          nivel_oficina: >-
            {%- set i = inicio | as_datetime(none) %}
            {%- if i is not none and now() >= i %}{{ brillo }}
            {%- elif now() < today_at('01:30') %}10
            {%- else %}0
            {%- endif %}
      - choose:
          - conditions: "{{ trigger.id == 'pc_prendida' }}"
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.lampara_oficina
                data:
                  brightness_pct: 100
                  rgbw_color: "{{ color_pc }}"
          - conditions: "{{ trigger.id == 'pc_apagada' and nivel_oficina | int > 0 }}"
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.lampara_oficina
                data:
                  brightness_pct: "{{ nivel_oficina }}"
                  color_temp_kelvin: "{{ kelvin }}"
          - conditions: "{{ trigger.id == 'pc_apagada' }}"
            sequence:
              - action: light.turn_off
                continue_on_error: true
                target:
                  entity_id: light.lampara_oficina
          - conditions: "{{ trigger.id == 'encender' }}"
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ lamparas }}"
                data:
                  brightness_pct: 100
                  color_temp_kelvin: "{{ kelvin }}"
          - conditions: "{{ trigger.id == 'llegada' and dentro and apagadas | count > 0 }}"
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ apagadas }}"
                data:
                  brightness_pct: "{{ brillo }}"
                  color_temp_kelvin: "{{ kelvin }}"
          - conditions: "{{ trigger.id == 'rampa' and dentro and bajar | count > 0 }}"
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ bajar }}"
                data:
                  brightness_pct: "{{ brillo }}"
    mode: queued

  - id: luces_adentro_apagar
    alias: Luces adentro - Apagar a la 01:30
    description: >-
      Apaga las lámparas del dormitorio, la oficina y el salón a la 01:30 si hay alguien
      en casa. Con la PC de Fede prendida espera a que se apague, si es antes
      del amanecer.
    trigger:
      - platform: time
        at: "01:30:00"
      - platform: state
        entity_id: binary_sensor.pc_fede_prendida
        from: "on"
        to: "off"
    condition:
      - condition: time
        after: "01:30:00"
        before: "12:00:00"
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.pc_fede_prendida
            state: "on"
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.casa_ocupada
            state: "off"
    action:
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id:
            - light.lampara_dormitorio_grupo
            - light.lampara_oficina
            - light.lampara_salon
    mode: single
