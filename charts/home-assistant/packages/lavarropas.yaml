# HA package: lavasecarropas Candy simply-Fi. Contexto completo en
# docs/lavarropas-candy.md.
#
# La integración `candy` (HACS) publica sólo 3 sensores y descarta 10 campos que
# el equipo sí reporta (Err, SLevel, Opt1..Opt8, Steam, DryT, DelVal, RecipeId,
# CheckUpState). Este package lee el MISMO endpoint local y los expone todos.
#
# El endpoint devuelve el JSON hex-encodeado, a veces además cifrado con XOR de
# clave repetida de 16 chars y a veces en claro pese al `encrypted=1` — el
# firmware es inconsistente. Por eso el decode mira si el hex ya arranca con `{`
# y sólo aplica el XOR cuando no. La clave va en claro acá a propósito: se
# recupera del propio tráfico del equipo en segundos, así que es ofuscación y no
# un secreto (docs §2).
#
# El equipo atiende UNA conexión por vez y corta la que no puede servir, así que
# el comando reintenta 5 veces: una lectura suelta devuelve vacío. La integración
# `candy` de HACS se sacó justamente porque poleaba el mismo endpoint cada 60 s y
# chocaba con este fetch (docs §3.1) — no volver a agregarla.

command_line:
  - sensor:
      # Un único fetch por ciclo; todo lo demás son template sensors sobre estos
      # atributos, para no multiplicar requests contra un equipo que no los tolera.
      name: "Lavasecarropas datos"
      unique_id: lavasecarropas_datos
      # Presupuesto de tiempo: 5 intentos x (8 s de curl + 2 s de espera) = 50 s
      # peor caso, bajo el command_timeout de 55 y el scan_interval de 60. La
      # version anterior pedia 3 intentos de 15 s pero cortaba a los 45, asi que
      # nunca llegaba al tercero. El equipo responde en 1-2 s cuando responde,
      # de modo que conviene timeout corto y mas intentos.
      command: >-
        for i in 1 2 3 4 5; do H=$(curl -sS -m 8 "http://lavarropas.lan/http-read.json?encrypted=1"); [ -n "$H" ] && break; sleep 2; done;
        printf '%s' "$H" | python3 -c "import json,sys;k=b'aeaclekbgmjjcebg';r=bytes.fromhex(sys.stdin.read().strip());d=r if r.lstrip().startswith(b'{') else bytes(c^k[i%16] for i,c in enumerate(r));print(json.dumps(json.loads(d)['statusLavatrice']))"
      command_timeout: 55
      scan_interval: 60
      value_template: "{{ value_json.MachMd }}"
      json_attributes:
        - WiFiStatus
        - Err
        - MachMd
        - Pr
        - PrPh
        - SLevel
        - Temp
        - SpinSp
        - Opt1
        - Opt2
        - Opt3
        - Opt4
        - Opt5
        - Opt6
        - Opt7
        - Opt8
        - Steam
        - DryT
        - DelVal
        - RemTime
        - RecipeId
        - CheckUpState

template:
  - sensor:
      - name: "Lavasecarropas estado"
        unique_id: lavasecarropas_estado
        icon: mdi:washing-machine
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set m = state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) %}
          {{ {1: 'En reposo', 2: 'En marcha', 3: 'En pausa',
              4: 'Inicio diferido (selección)', 5: 'Inicio diferido programado',
              6: 'Error', 7: 'Completado', 8: 'Completado'}.get(m, 'Desconocido') }}

      - name: "Lavasecarropas fase"
        unique_id: lavasecarropas_fase
        icon: mdi:water-sync
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set p = state_attr('sensor.lavasecarropas_datos', 'PrPh') | int(-1) %}
          {{ {0: 'Parado', 1: 'Pre-lavado', 2: 'Lavando', 3: 'Aclarado',
              4: 'Último aclarado', 5: 'Fin', 6: 'Secando', 7: 'Error',
              8: 'Vapor', 9: 'Centrifugando (noche)', 10: 'Centrifugando'}.get(p, 'Desconocido') }}

      # RemTime viene en MINUTOS. La integración lo divide por 60 asumiendo
      # segundos y publica ~60x menos; este sensor es el valor correcto.
      #
      # Al terminar el ciclo el equipo pone 65535 (0xFFFF) = "sin dato". Sin este
      # filtro el sensor publica 65535 minutos y ensucia las estadisticas; no
      # disponible es la representacion correcta de un dato que no existe.
      - name: "Lavasecarropas tiempo restante"
        unique_id: lavasecarropas_tiempo_restante_real
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:timer-sand
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'RemTime') | int(65535) != 65535 }}
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'RemTime') | int(0) }}"

      # Sólo con la máquina en marcha: parada, RemTime es la duración del
      # programa seleccionado y una hora de fin no significaría nada.
      - name: "Lavasecarropas fin estimado"
        unique_id: lavasecarropas_fin_estimado
        device_class: timestamp
        icon: mdi:clock-end
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) == 2 }}
        state: >-
          {{ (now() + timedelta(minutes = state_attr('sensor.lavasecarropas_datos', 'RemTime') | int(0))).isoformat() }}

      # 255 (0xFF) = "sin dato", que el equipo publica al terminar el ciclo.
      - name: "Lavasecarropas temperatura"
        unique_id: lavasecarropas_temperatura
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-water
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'Temp') | int(255) != 255 }}
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'Temp') | int(0) }}"

      # SpinSp viene en centenas de rpm, con el mismo centinela 255: sin filtrar,
      # al terminar el ciclo publicaria 25500 rpm.
      - name: "Lavasecarropas centrifugado"
        unique_id: lavasecarropas_centrifugado
        unit_of_measurement: "rpm"
        state_class: measurement
        icon: mdi:rotate-3d-variant
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'SpinSp') | int(255) != 255 }}
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'SpinSp') | int(0) * 100 }}"

      # Los numeros de programa son ESPECIFICOS DEL MODELO: son posiciones de la
      # perilla y no estan documentados en ningun lado. Este mapeo sale de leer
      # el panel del equipo: las posiciones numeran EN SENTIDO HORARIO desde
      # APAGADO, empezando en 1.
      #
      # CONFIRMADO empiricamente: solo Pr=2, observado en un ciclo real con la
      # perilla en Perfect Mix. El resto se deduce del orden del panel. El
      # sentido de giro NO es una suposicion libre: en antihorario el 2 caeria
      # en "Rapido L&S", que contradice la observacion.
      #
      # Verificar el resto con `scripts/candyctl.py learn`. Lo que no este en el
      # diccionario cae al numero crudo.
      - name: "Lavasecarropas programa"
        unique_id: lavasecarropas_programa
        icon: mdi:playlist-music
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set p = state_attr('sensor.lavasecarropas_datos', 'Pr') | int(-1) %}
          {% set nombres = {
            1: 'Planchado Facil',
            2: 'Perfect Mix',
            3: 'Anti-alergias',
            4: 'Perfect Rapid 59 min',
            5: 'Rapidos 14/30/44 min',
            6: 'Algodon',
            7: 'Delicados',
            8: 'Aclarados',
            9: 'Desague + Centrifugado',
            10: 'Lana/Seda',
            11: 'Lana',
            12: 'Mixtos',
            13: 'Algodon eco',
            14: 'Rapido L&S 59 min',
            15: 'Smart Fi+',
          } %}
          {{ nombres.get(p, 'Programa ' ~ p) }}

      # El panel NO tiene selector de suciedad: solo "Seleccion Temperatura" y
      # "Seleccion Centrifugado". Asi que SLevel no se elige y probablemente sea
      # constante en 3 (o lo fije el programa). Queda sin nombres a proposito;
      # si `learn` confirma que nunca cambia, esta entidad sale del dashboard.
      # Mismo centinela 255 al terminar el ciclo.
      - name: "Lavasecarropas nivel de suciedad"
        unique_id: lavasecarropas_nivel_suciedad
        icon: mdi:liquid-spot
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'SLevel') | int(255) != 255 }}
        state: >-
          {% set n = state_attr('sensor.lavasecarropas_datos', 'SLevel') | int(-1) %}
          {% set nombres = {} %}
          {{ nombres.get(n, 'Nivel ' ~ n) }}

      # El mapeo replica DryerCycleState de la integración. El equipo reporta
      # DryT (no DryLev, que es el campo que ese enum cubre oficialmente), así
      # que la escala es probable pero NO está confirmada — ver docs §5.
      - name: "Lavasecarropas nivel de secado"
        unique_id: lavasecarropas_nivel_secado
        icon: mdi:tumble-dryer
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set d = state_attr('sensor.lavasecarropas_datos', 'DryT') | int(-1) %}
          {{ {0: 'Sin secado', 1: 'Secado para planchar', 2: 'Secado para colgar',
              3: 'Secado para guardar', 4: 'Secado extra'}.get(d, 'Desconocido') }}

      # 255 es el centinela de "sin inicio diferido".
      - name: "Lavasecarropas inicio diferido"
        unique_id: lavasecarropas_inicio_diferido
        icon: mdi:clock-start
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set d = state_attr('sensor.lavasecarropas_datos', 'DelVal') | int(255) %}
          {{ 'Sin programar' if d == 255 else d }}

      # Ídem: 255 significa "sin error".
      - name: "Lavasecarropas error"
        unique_id: lavasecarropas_error
        icon: mdi:alert-circle-outline
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set e = state_attr('sensor.lavasecarropas_datos', 'Err') | int(255) %}
          {{ 'Sin error' if e == 255 else e }}

      - name: "Lavasecarropas opciones activas"
        unique_id: lavasecarropas_opciones_activas
        icon: mdi:tune-variant
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set ns = namespace(activas = []) %}
          {% for n in range(1, 9) %}
            {% if state_attr('sensor.lavasecarropas_datos', 'Opt' ~ n) | int(0) != 0 %}
              {% set ns.activas = ns.activas + [n | string] %}
            {% endif %}
          {% endfor %}
          {{ ns.activas | join(', ') if ns.activas else 'Ninguna' }}

  - binary_sensor:
      - name: "Lavasecarropas en marcha"
        unique_id: lavasecarropas_en_marcha
        device_class: running
        icon: mdi:washing-machine
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) == 2 }}"

      # MachMd 7 y 8 son ambos "Finished" en la integración.
      - name: "Lavasecarropas ciclo terminado"
        unique_id: lavasecarropas_ciclo_terminado
        icon: mdi:check-circle-outline
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) in [7, 8] }}"

      - name: "Lavasecarropas problema"
        unique_id: lavasecarropas_problema
        device_class: problem
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {{ state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) == 6
             or state_attr('sensor.lavasecarropas_datos', 'Err') | int(255) != 255 }}

      - name: "Lavasecarropas vapor"
        unique_id: lavasecarropas_vapor
        icon: mdi:kettle-steam
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'Steam') | int(0) != 0 }}"

# El aviso dispara por TRANSICIÓN de estado, nunca por el tiempo restante: ese
# campo se revisa a la baja al pesar la carga y ademas emite valores espurios
# sueltos (docs/lavarropas-candy.md §5).
automation:
  - id: lavasecarropas_ciclo_terminado
    alias: Lavasecarropas - Avisar cuando termina el ciclo
    description: >-
      Notifica al celular cuando MachMd pasa a 7/8 (Finished). El equipo se
      queda en ese estado hasta que alguien lo abre, asi que el aviso sale una
      sola vez por ciclo.
    trigger:
      # `from: "off"` es lo que evita el aviso fantasma al arrancar HA: el
      # command_line tarda hasta 60 s en su primera lectura, con lo cual el
      # binary_sensor pasa por unavailable y despues resuelve. Sin el `from`,
      # esa transicion se veria como un ciclo recien terminado.
      - platform: state
        entity_id: binary_sensor.lavasecarropas_ciclo_terminado
        from: "off"
        to: "on"
    action:
      - action: notify.mobile_app_motorola_edge_70
        data:
          title: Lavasecarropas
          # NO citar temperatura ni centrifugado: justo al terminar el ciclo el
          # equipo los pone en 255, asi que el aviso saldria "a 255 grados". Pr
          # sigue siendo valido en ese momento, pero el sensor puede estar
          # momentaneamente no disponible si el fetch colisiono, y entonces el
          # mensaje diria "(unavailable)": de ahi el guardia.
          message: >-
            {% set prog = states('sensor.lavasecarropas_programa') %}
            Termino el ciclo{{ ' (' ~ prog ~ ')' if prog not in ['unknown', 'unavailable'] else '' }}.
            Hay que sacar la ropa.
          data:
            channel: Lavasecarropas
            importance: high
            notification_icon: mdi:washing-machine
    mode: single

# --------------------------------------------------------------------------
# Control (escritura). Protocolo confirmado contra el equipo — ver docs §8.
#
# La escritura va por `GET /http-write.json?encrypted=1&data=<HEX>`, donde HEX
# es el texto plano en ASCII hexeado y NO cifrado: el `encrypted=1` es
# obligatorio (con `encrypted=0` contesta BAD REQUEST) pero el equipo no
# descifra nada. Mandar el blob XOR de la clave de lectura no produce ningun
# efecto, que es lo que hace ver la escritura como imposible.
#
# La respuesta es SIEMPRE {"response":"SUCCESS"}, incluso ante un pedido vacio
# o con parametros inexistentes, asi que no confirma nada: el unico testigo de
# que un comando entro es el cambio de los campos en http-read.
#
# Los nombres de escritura NO son los de lectura: se escribe PrNm/TmpTgt/SpdTgt/
# Dry y se lee Pr/Temp/SpinSp/DryT. Escribir `Temp=30` no hace nada.
# --------------------------------------------------------------------------

input_select:
  # Los numeros de PrNm salen de barrer el equipo y anotar la receta que carga
  # cada uno (docs §8.3). PrNm no coincide con el Pr que despues se lee: PrNm=3
  # se lee como Pr=2. Los nombres son descriptivos de la receta MEDIDA, no de
  # la leyenda de la perilla, que no esta confirmada.
  lavasecarropas_preset:
    name: Lavasecarropas preset
    icon: mdi:playlist-check
    options:
      - "Diario 40° (mixtos)"
      - "Algodón largo"
      - "Rápido 59 min"
      - "Delicados 30°"
      - "Sólo secado"
      - "Lavar y secar"
      - "Desagüe"
      - "Manual"

  # El PrNm crudo no le dice nada a nadie, asi que la lista va por nombre. Las
  # etiquetas describen la receta MEDIDA (docs §8.3), no la leyenda de la
  # perilla: de esa leyenda solo estan confirmados Pr=2 (Perfect Mix) y Pr=15
  # (Smart Fi+), y la medicion contradice el resto — PrNm=11 carga un secado
  # donde el panel dice "Lana". Los que no se pudieron caracterizar quedan como
  # "Programa N" con su receta al lado, que es lo unico cierto que se puede
  # decir de ellos. PrNm 1 y 2 no aparecen porque el equipo los rechaza.
  lavasecarropas_programa_manual:
    name: Lavasecarropas programa (manual)
    icon: mdi:playlist-music
    options:
      - "Perfect Mix · 40° · 1h57"
      - "Rápido · 40° · 59'"
      - "Algodón · 40° · 3h52"
      - "Programa 7 · 40° · 400 rpm · 59'"
      - "Programa 8 · 40° · 400 rpm · 59'"
      - "Lana/Seda · 30° · 48'"
      - "Sólo secado · 2h"
      - "Lavar y secar · 3h50"
      - "Programa 16 · 59'"
      - "Desagüe · sin centrifugado · 1'"
      - "Programa 19 · 30° · 45'"
      - "Programa 20 · 59'"
      - "Smart Fi+ (reposo)"

  lavasecarropas_temperatura_manual:
    name: Lavasecarropas temperatura (manual)
    icon: mdi:thermometer
    options: ["Del programa", "20", "30", "40", "60", "90"]

  # El equipo recibe centenas de rpm (SpdTgt=10 -> 1000), igual que las publica.
  lavasecarropas_centrifugado_manual:
    name: Lavasecarropas centrifugado (manual)
    icon: mdi:rotate-3d-variant
    options: ["Del programa", "0", "400", "800", "1000", "1200", "1400"]

  # `Dry` no es la misma escala que el `DryT` que se lee: Dry=3 vuelve como
  # DryT=2. Los nombres siguen el orden creciente de secado y hay que
  # confirmarlos contra el panel; el valor crudo es lo unico seguro.
  lavasecarropas_secado_manual:
    name: Lavasecarropas secado (manual)
    icon: mdi:tumble-dryer
    options: ["Del programa", "Sin secado", "Planchar", "Colgar", "Guardar", "Extra"]

shell_command:
  # HA pasa a create_subprocess_exec (sin shell) apenas el comando trae una
  # plantilla, de ahi el `sh -c` explicito. `comando` viaja como argumento
  # posicional y se hexea en python, no se interpola en la URL: asi el `&` de
  # los parametros no se parte ni necesita escaping.
  #
  # Tres intentos espaciados y nada mas: el equipo atiende UNA conexion por vez
  # y una rafaga de escrituras lo cuelga hasta el corte de energia (docs §8.4).
  lavasecarropas_enviar: >-
    sh -c 'H=$(python3 -c "import sys;print(sys.argv[1].encode().hex().upper())" "$1");
    for i in 1 2 3; do
    curl -sS -m 8 "http://lavarropas.lan/http-write.json?encrypted=1&data=$H" >/dev/null && exit 0;
    sleep 3; done; exit 1' _ "{{ comando }}"

script:
  lavasecarropas_aplicar:
    alias: Lavasecarropas - Aplicar receta
    description: >-
      Arma el comando desde el preset elegido (o desde los controles manuales) y
      lo manda. Con arrancar=false solo deja el programa seleccionado, que es lo
      que conviene para mirar en los sensores que el equipo lo acepto antes de
      largar el ciclo.
    mode: single
    fields:
      arrancar:
        name: Arrancar
        description: Agrega StSt=1 y larga el ciclo.
        default: false
        selector:
          boolean:
    variables:
      recetas:
        "Diario 40° (mixtos)": {PrNm: 3, TmpTgt: 40, SpdTgt: 10}
        "Algodón largo": {PrNm: 6, TmpTgt: 40, SpdTgt: 14}
        "Rápido 59 min": {PrNm: 4, TmpTgt: 40, SpdTgt: 10}
        "Delicados 30°": {PrNm: 10, TmpTgt: 30, SpdTgt: 8}
        "Sólo secado": {PrNm: 11}
        "Lavar y secar": {PrNm: 13}
        "Desagüe": {PrNm: 17}
      programas:
        "Perfect Mix · 40° · 1h57": 3
        "Rápido · 40° · 59'": 4
        "Algodón · 40° · 3h52": 6
        "Programa 7 · 40° · 400 rpm · 59'": 7
        "Programa 8 · 40° · 400 rpm · 59'": 8
        "Lana/Seda · 30° · 48'": 10
        "Sólo secado · 2h": 11
        "Lavar y secar · 3h50": 13
        "Programa 16 · 59'": 16
        "Desagüe · sin centrifugado · 1'": 17
        "Programa 19 · 30° · 45'": 19
        "Programa 20 · 59'": 20
        "Smart Fi+ (reposo)": 15
      secados:
        "Sin secado": 0
        "Planchar": 1
        "Colgar": 2
        "Guardar": 3
        "Extra": 4
      comando: >-
        {% set preset = states('input_select.lavasecarropas_preset') %}
        {% set ns = namespace(partes=['Write=1']) %}
        {% if preset == 'Manual' %}
          {% set ns.partes = ns.partes + ['PrNm=' ~ programas.get(states('input_select.lavasecarropas_programa_manual'), 15)] %}
          {% set t = states('input_select.lavasecarropas_temperatura_manual') %}
          {% if t != 'Del programa' %}
            {% set ns.partes = ns.partes + ['TmpTgt=' ~ t | int] %}
          {% endif %}
          {% set s = states('input_select.lavasecarropas_centrifugado_manual') %}
          {% if s != 'Del programa' %}
            {% set ns.partes = ns.partes + ['SpdTgt=' ~ (s | int // 100)] %}
          {% endif %}
          {% set d = states('input_select.lavasecarropas_secado_manual') %}
          {% if d != 'Del programa' %}
            {% set ns.partes = ns.partes + ['Dry=' ~ secados.get(d, 0)] %}
          {% endif %}
        {% else %}
          {% for k, v in recetas.get(preset, {'PrNm': 15}).items() %}
            {% set ns.partes = ns.partes + [k ~ '=' ~ v] %}
          {% endfor %}
        {% endif %}
        {% if arrancar | default(false) %}
          {% set ns.partes = ns.partes + ['StSt=1'] %}
        {% endif %}
        {{ ns.partes | join('&') }}
    sequence:
      # Arrancar sobre un ciclo en marcha es la unica combinacion que puede
      # sorprender; seleccionar un programa con la maquina andando no la altera.
      - condition: template
        value_template: >-
          {{ not (arrancar | default(false))
             or state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) != 2 }}
      - action: shell_command.lavasecarropas_enviar
        data:
          comando: "{{ comando }}"

  lavasecarropas_detener:
    alias: Lavasecarropas - Detener / cancelar
    description: >-
      StSt=0 corta el ciclo y tambien limpia un inicio diferido armado. Deja Pr
      en 0 o 15 segun el momento; ambos son reposo.
    mode: single
    sequence:
      - action: shell_command.lavasecarropas_enviar
        data:
          comando: "Write=1&StSt=0"
