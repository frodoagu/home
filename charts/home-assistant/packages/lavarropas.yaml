# HA package: Candy simply-Fi washer-dryer. Full context in
# docs/lavarropas-candy.md.
#
# The HACS `candy` integration publishes only 3 sensors and drops 10 fields the
# machine does report (Err, SLevel, Opt1..Opt8, Steam, DryT, DelVal, RecipeId,
# CheckUpState). This package reads the SAME local endpoint and exposes them all.
#
# The endpoint returns hex-encoded JSON, sometimes also XOR'd with a repeating
# 16-char key and sometimes plain despite `encrypted=1`: the firmware is
# inconsistent. So the decode checks whether the hex already starts with `{`
# and XORs only when it doesn't. The key is in the clear on purpose: it comes
# back out of the machine's own traffic in seconds, so it's obfuscation, not a
# secret (docs §2).
#
# The machine serves ONE connection at a time and drops the rest, so the
# command retries 5 times: a single read comes back empty. Don't add the HACS
# `candy` integration back: it polled the same endpoint every 60 s and collided
# with this fetch (docs §3.1).

command_line:
  - sensor:
      # One fetch per cycle; everything else is template sensors on these
      # attributes, so a machine that can't take requests doesn't get more.
      name: "Lavasecarropas datos"
      unique_id: lavasecarropas_datos
      # Time budget: 5 tries x (8 s of curl + 2 s of wait) = 50 s worst case,
      # under the 55 s command_timeout and the 60 s scan_interval. The machine
      # answers in 1-2 s when it answers, so a short timeout and more tries.
      command: >-
        for i in 1 2 3 4 5; do H=$(curl -sS -m 8 "http://lavarropas.lan/http-read.json?encrypted=1"); [ -n "$H" ] && break; sleep 2; done;
        printf '%s' "$H" | python3 -c "import json,sys;k=b'aeaclekbgmjjcebg';r=bytes.fromhex(sys.stdin.read().strip());d=r if r.lstrip().startswith(b'{') else bytes(c^k[i%16] for i,c in enumerate(r));print(json.dumps(json.loads(d)['statusLavatrice']))"
      command_timeout: 55
      scan_interval: 60
      value_template: "{{ value_json.MachMd }}"
      json_attributes:
        - WiFiStatus
        - Err
        - MachMd
        - Pr
        - PrPh
        - SLevel
        - Temp
        - SpinSp
        - Opt1
        - Opt2
        - Opt3
        - Opt4
        - Opt5
        - Opt6
        - Opt7
        - Opt8
        - Steam
        - DryT
        - DelVal
        - RemTime
        - RecipeId
        - CheckUpState

template:
  - sensor:
      - name: "Lavasecarropas estado"
        unique_id: lavasecarropas_estado
        icon: mdi:washing-machine
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set m = state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) %}
          {{ {1: 'En reposo', 2: 'En marcha', 3: 'En pausa',
              4: 'Inicio diferido (selección)', 5: 'Inicio diferido programado',
              6: 'Error', 7: 'Completado', 8: 'Completado'}.get(m, 'Desconocido') }}

      - name: "Lavasecarropas fase"
        unique_id: lavasecarropas_fase
        icon: mdi:water-sync
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set p = state_attr('sensor.lavasecarropas_datos', 'PrPh') | int(-1) %}
          {{ {0: 'Parado', 1: 'Pre-lavado', 2: 'Lavando', 3: 'Aclarado',
              4: 'Último aclarado', 5: 'Fin', 6: 'Secando', 7: 'Error',
              8: 'Vapor', 9: 'Centrifugando (noche)', 10: 'Centrifugando'}.get(p, 'Desconocido') }}

      # RemTime is in MINUTES. The integration divides it by 60 assuming
      # seconds and publishes ~60x less; this sensor is the right value.
      #
      # At the end of a cycle the machine sets 65535 (0xFFFF) = "no data".
      # Unfiltered, the sensor would publish 65535 minutes and spoil the
      # statistics; unavailable is the right way to show a value that isn't there.
      - name: "Lavasecarropas tiempo restante"
        unique_id: lavasecarropas_tiempo_restante_real
        unit_of_measurement: "min"
        device_class: duration
        state_class: measurement
        icon: mdi:timer-sand
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'RemTime') | int(65535) != 65535 }}
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'RemTime') | int(0) }}"

      # Only while running: stopped, RemTime is the selected program's length
      # and an end time would mean nothing.
      - name: "Lavasecarropas fin estimado"
        unique_id: lavasecarropas_fin_estimado
        device_class: timestamp
        icon: mdi:clock-end
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) == 2 }}
        state: >-
          {{ (now() + timedelta(minutes = state_attr('sensor.lavasecarropas_datos', 'RemTime') | int(0))).isoformat() }}

      # 255 (0xFF) = "no data", which the machine publishes at the end of a cycle.
      - name: "Lavasecarropas temperatura"
        unique_id: lavasecarropas_temperatura
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-water
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'Temp') | int(255) != 255 }}
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'Temp') | int(0) }}"

      # SpinSp comes in hundreds of rpm, with the same 255 sentinel: unfiltered,
      # the end of a cycle would publish 25500 rpm.
      - name: "Lavasecarropas centrifugado"
        unique_id: lavasecarropas_centrifugado
        unit_of_measurement: "rpm"
        state_class: measurement
        icon: mdi:rotate-3d-variant
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'SpinSp') | int(255) != 255 }}
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'SpinSp') | int(0) * 100 }}"

      # Program numbers are MODEL-SPECIFIC: knob positions, documented nowhere.
      # This mapping comes from reading the machine's panel: positions count
      # CLOCKWISE from OFF, starting at 1.
      #
      # CONFIRMED by observation: only Pr=2, seen in a real cycle with the knob
      # on Perfect Mix. The rest follows the panel's order. The direction isn't
      # a free guess: counter-clockwise, 2 would land on "Rapido L&S", which
      # contradicts what was seen.
      #
      # Check the rest with `scripts/candyctl.py learn`. Anything not in the
      # dictionary falls back to the raw number.
      - name: "Lavasecarropas programa"
        unique_id: lavasecarropas_programa
        icon: mdi:playlist-music
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set p = state_attr('sensor.lavasecarropas_datos', 'Pr') | int(-1) %}
          {% set nombres = {
            1: 'Planchado Facil',
            2: 'Perfect Mix',
            3: 'Anti-alergias',
            4: 'Perfect Rapid 59 min',
            5: 'Rapidos 14/30/44 min',
            6: 'Algodon',
            7: 'Delicados',
            8: 'Aclarados',
            9: 'Desague + Centrifugado',
            10: 'Lana/Seda',
            11: 'Lana',
            12: 'Mixtos',
            13: 'Algodon eco',
            14: 'Rapido L&S 59 min',
            15: 'Smart Fi+',
          } %}
          {{ nombres.get(p, 'Programa ' ~ p) }}

      # The panel has NO soil selector, only "Seleccion Temperatura" and
      # "Seleccion Centrifugado", so SLevel isn't chosen and is probably
      # constant at 3 (or set by the program). It keeps no names on purpose; if
      # `learn` shows it never changes, this entity leaves the dashboard.
      # Same 255 sentinel at the end of a cycle.
      - name: "Lavasecarropas nivel de suciedad"
        unique_id: lavasecarropas_nivel_suciedad
        icon: mdi:liquid-spot
        availability: >-
          {{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable']
             and state_attr('sensor.lavasecarropas_datos', 'SLevel') | int(255) != 255 }}
        state: >-
          {% set n = state_attr('sensor.lavasecarropas_datos', 'SLevel') | int(-1) %}
          {% set nombres = {} %}
          {{ nombres.get(n, 'Nivel ' ~ n) }}

      # The mapping copies the integration's DryerCycleState. The machine
      # reports DryT (not DryLev, the field that enum officially covers), so the
      # scale is likely but NOT confirmed; see docs §5.
      - name: "Lavasecarropas nivel de secado"
        unique_id: lavasecarropas_nivel_secado
        icon: mdi:tumble-dryer
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set d = state_attr('sensor.lavasecarropas_datos', 'DryT') | int(-1) %}
          {{ {0: 'Sin secado', 1: 'Secado para planchar', 2: 'Secado para colgar',
              3: 'Secado para guardar', 4: 'Secado extra'}.get(d, 'Desconocido') }}

      # 255 is the "no delayed start" sentinel.
      - name: "Lavasecarropas inicio diferido"
        unique_id: lavasecarropas_inicio_diferido
        icon: mdi:clock-start
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set d = state_attr('sensor.lavasecarropas_datos', 'DelVal') | int(255) %}
          {{ 'Sin programar' if d == 255 else d }}

      # Likewise: 255 means "no error".
      - name: "Lavasecarropas error"
        unique_id: lavasecarropas_error
        icon: mdi:alert-circle-outline
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set e = state_attr('sensor.lavasecarropas_datos', 'Err') | int(255) %}
          {{ 'Sin error' if e == 255 else e }}

      - name: "Lavasecarropas opciones activas"
        unique_id: lavasecarropas_opciones_activas
        icon: mdi:tune-variant
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {% set ns = namespace(activas = []) %}
          {% for n in range(1, 9) %}
            {% if state_attr('sensor.lavasecarropas_datos', 'Opt' ~ n) | int(0) != 0 %}
              {% set ns.activas = ns.activas + [n | string] %}
            {% endif %}
          {% endfor %}
          {{ ns.activas | join(', ') if ns.activas else 'Ninguna' }}

  - binary_sensor:
      - name: "Lavasecarropas en marcha"
        unique_id: lavasecarropas_en_marcha
        device_class: running
        icon: mdi:washing-machine
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) == 2 }}"

      # MachMd 7 and 8 are both "Finished" in the integration.
      - name: "Lavasecarropas ciclo terminado"
        unique_id: lavasecarropas_ciclo_terminado
        icon: mdi:check-circle-outline
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) in [7, 8] }}"

      - name: "Lavasecarropas problema"
        unique_id: lavasecarropas_problema
        device_class: problem
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: >-
          {{ state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) == 6
             or state_attr('sensor.lavasecarropas_datos', 'Err') | int(255) != 255 }}

      - name: "Lavasecarropas vapor"
        unique_id: lavasecarropas_vapor
        icon: mdi:kettle-steam
        availability: "{{ states('sensor.lavasecarropas_datos') not in ['unknown', 'unavailable'] }}"
        state: "{{ state_attr('sensor.lavasecarropas_datos', 'Steam') | int(0) != 0 }}"

# The alert fires on a state TRANSITION, never on the remaining time: that
# field is revised down once the load is weighed and also emits stray bogus
# values (docs/lavarropas-candy.md §5).
automation:
  - id: lavasecarropas_ciclo_terminado
    alias: Lavasecarropas - Avisar cuando termina el ciclo
    description: >-
      Notifica al celular cuando MachMd pasa a 7/8 (Finished). El equipo se
      queda en ese estado hasta que alguien lo abre, asi que el aviso sale una
      sola vez por ciclo.
    trigger:
      # `from: "off"` is what keeps HA's startup from sending a phantom alert:
      # the command_line takes up to 60 s for its first read, so the
      # binary_sensor goes through unavailable before it resolves. Without the
      # `from`, that would look like a cycle that just ended.
      - platform: state
        entity_id: binary_sensor.lavasecarropas_ciclo_terminado
        from: "off"
        to: "on"
    action:
      - action: script.avisar_celu
        data:
          titulo: Lavasecarropas
          # Don't quote temperature or spin: right at the end of a cycle the
          # machine sets them to 255, so the alert would say "at 255 degrees".
          # Pr is still valid then, but the sensor can be briefly unavailable if
          # the fetch collided, and the message would say "(unavailable)":
          # hence the guard.
          mensaje: >-
            {% set prog = states('sensor.lavasecarropas_programa') %}
            Termino el ciclo{{ ' (' ~ prog ~ ')' if prog not in ['unknown', 'unavailable'] else '' }}.
            Hay que sacar la ropa.
          extras:
            channel: Lavasecarropas
            importance: high
            notification_icon: mdi:washing-machine
    mode: single

# --------------------------------------------------------------------------
# Control (writing). Protocol confirmed against the machine; see docs §8.
#
# Writes go through `GET /http-write.json?encrypted=1&data=<HEX>`, where HEX is
# the plain ASCII text hex-encoded and NOT encrypted: `encrypted=1` is required
# (`encrypted=0` answers BAD REQUEST) but the machine decrypts nothing. Sending
# the read key's XOR blob has no effect, which is what makes writing look
# impossible.
#
# The reply is ALWAYS {"response":"SUCCESS"}, even for an empty request or made-up
# parameters, so it confirms nothing: the only proof a command landed is the
# fields changing in http-read.
#
# Write names are NOT read names: PrNm/TmpTgt/SpdTgt/Dry are written and
# Pr/Temp/SpinSp/DryT read. Writing `Temp=30` does nothing.
# --------------------------------------------------------------------------

input_select:
  # The PrNm numbers come from sweeping the machine and noting the recipe each
  # one loads (docs §8.3). PrNm doesn't match the Pr read back: PrNm=3 reads as
  # Pr=2. The names describe the MEASURED recipe, not the knob's legend, which
  # isn't confirmed.
  lavasecarropas_preset:
    name: Lavasecarropas preset
    icon: mdi:playlist-check
    options:
      - "Diario 40° (mixtos)"
      - "Algodón largo"
      - "Rápido 59 min"
      - "Delicados 30°"
      - "Sólo secado"
      - "Lavar y secar"
      - "Desagüe"
      - "Manual"

  # A raw PrNm means nothing to anyone, so the list goes by name. The labels
  # describe the MEASURED recipe (docs §8.3), not the knob's legend: of that
  # legend only Pr=2 (Perfect Mix) and Pr=15 (Smart Fi+) are confirmed, and the
  # measurements contradict the rest (PrNm=11 loads a dry cycle where the panel
  # says "Lana"). The ones that couldn't be characterized stay "Programa N" with
  # their recipe next to them, the only sure thing about them. PrNm 1 and 2 are
  # missing because the machine rejects them.
  lavasecarropas_programa_manual:
    name: Lavasecarropas programa (manual)
    icon: mdi:playlist-music
    options:
      - "Perfect Mix · 40° · 1h57"
      - "Rápido · 40° · 59'"
      - "Algodón · 40° · 3h52"
      - "Programa 7 · 40° · 400 rpm · 59'"
      - "Programa 8 · 40° · 400 rpm · 59'"
      - "Lana/Seda · 30° · 48'"
      - "Sólo secado · 2h"
      - "Lavar y secar · 3h50"
      - "Programa 16 · 59'"
      - "Desagüe · sin centrifugado · 1'"
      - "Programa 19 · 30° · 45'"
      - "Programa 20 · 59'"
      - "Smart Fi+ (reposo)"

  lavasecarropas_temperatura_manual:
    name: Lavasecarropas temperatura (manual)
    icon: mdi:thermometer
    options: ["Del programa", "20", "30", "40", "60", "90"]

  # The machine takes hundreds of rpm (SpdTgt=10 -> 1000), as it publishes them.
  lavasecarropas_centrifugado_manual:
    name: Lavasecarropas centrifugado (manual)
    icon: mdi:rotate-3d-variant
    options: ["Del programa", "0", "400", "800", "1000", "1200", "1400"]

  # `Dry` isn't on the same scale as the `DryT` read back: Dry=3 comes back as
  # DryT=2. The names follow increasing drying and need confirming against the
  # panel; the raw value is the only sure thing.
  lavasecarropas_secado_manual:
    name: Lavasecarropas secado (manual)
    icon: mdi:tumble-dryer
    options: ["Del programa", "Sin secado", "Planchar", "Colgar", "Guardar", "Extra"]

shell_command:
  # HA switches to create_subprocess_exec (no shell) as soon as the command
  # has a template, hence the explicit `sh -c`. `comando` travels as a
  # positional argument and is hex-encoded in python, not interpolated into the
  # URL, so the parameters' `&` neither splits nor needs escaping.
  #
  # Three spaced tries and no more: the machine serves ONE connection at a time
  # and a burst of writes wedges it until a power cycle (docs §8.4).
  lavasecarropas_enviar: >-
    sh -c 'H=$(python3 -c "import sys;print(sys.argv[1].encode().hex().upper())" "$1");
    for i in 1 2 3; do
    curl -sS -m 8 "http://lavarropas.lan/http-write.json?encrypted=1&data=$H" >/dev/null && exit 0;
    sleep 3; done; exit 1' _ "{{ comando }}"

script:
  lavasecarropas_aplicar:
    alias: Lavasecarropas - Aplicar receta
    description: >-
      Arma el comando desde el preset elegido (o desde los controles manuales) y
      lo manda. Con arrancar=false solo deja el programa seleccionado, que es lo
      que conviene para mirar en los sensores que el equipo lo acepto antes de
      largar el ciclo.
    mode: single
    fields:
      arrancar:
        name: Arrancar
        description: Agrega StSt=1 y larga el ciclo.
        default: false
        selector:
          boolean:
    variables:
      recetas:
        "Diario 40° (mixtos)": {PrNm: 3, TmpTgt: 40, SpdTgt: 10}
        "Algodón largo": {PrNm: 6, TmpTgt: 40, SpdTgt: 14}
        "Rápido 59 min": {PrNm: 4, TmpTgt: 40, SpdTgt: 10}
        "Delicados 30°": {PrNm: 10, TmpTgt: 30, SpdTgt: 8}
        "Sólo secado": {PrNm: 11}
        "Lavar y secar": {PrNm: 13}
        "Desagüe": {PrNm: 17}
      programas:
        "Perfect Mix · 40° · 1h57": 3
        "Rápido · 40° · 59'": 4
        "Algodón · 40° · 3h52": 6
        "Programa 7 · 40° · 400 rpm · 59'": 7
        "Programa 8 · 40° · 400 rpm · 59'": 8
        "Lana/Seda · 30° · 48'": 10
        "Sólo secado · 2h": 11
        "Lavar y secar · 3h50": 13
        "Programa 16 · 59'": 16
        "Desagüe · sin centrifugado · 1'": 17
        "Programa 19 · 30° · 45'": 19
        "Programa 20 · 59'": 20
        "Smart Fi+ (reposo)": 15
      secados:
        "Sin secado": 0
        "Planchar": 1
        "Colgar": 2
        "Guardar": 3
        "Extra": 4
      comando: >-
        {% set preset = states('input_select.lavasecarropas_preset') %}
        {% set ns = namespace(partes=['Write=1']) %}
        {% if preset == 'Manual' %}
          {% set ns.partes = ns.partes + ['PrNm=' ~ programas.get(states('input_select.lavasecarropas_programa_manual'), 15)] %}
          {% set t = states('input_select.lavasecarropas_temperatura_manual') %}
          {% if t != 'Del programa' %}
            {% set ns.partes = ns.partes + ['TmpTgt=' ~ t | int] %}
          {% endif %}
          {% set s = states('input_select.lavasecarropas_centrifugado_manual') %}
          {% if s != 'Del programa' %}
            {% set ns.partes = ns.partes + ['SpdTgt=' ~ (s | int // 100)] %}
          {% endif %}
          {% set d = states('input_select.lavasecarropas_secado_manual') %}
          {% if d != 'Del programa' %}
            {% set ns.partes = ns.partes + ['Dry=' ~ secados.get(d, 0)] %}
          {% endif %}
        {% else %}
          {% for k, v in recetas.get(preset, {'PrNm': 15}).items() %}
            {% set ns.partes = ns.partes + [k ~ '=' ~ v] %}
          {% endfor %}
        {% endif %}
        {% if arrancar | default(false) %}
          {% set ns.partes = ns.partes + ['StSt=1'] %}
        {% endif %}
        {{ ns.partes | join('&') }}
    sequence:
      # Starting over a running cycle is the one combination that can
      # surprise; selecting a program while the machine runs doesn't change it.
      - condition: template
        value_template: >-
          {{ not (arrancar | default(false))
             or state_attr('sensor.lavasecarropas_datos', 'MachMd') | int(-1) != 2 }}
      - action: shell_command.lavasecarropas_enviar
        data:
          comando: "{{ comando }}"

  lavasecarropas_detener:
    alias: Lavasecarropas - Detener / cancelar
    description: >-
      StSt=0 corta el ciclo y tambien limpia un inicio diferido armado. Deja Pr
      en 0 o 15 segun el momento; ambos son reposo.
    mode: single
    sequence:
      - action: shell_command.lavasecarropas_enviar
        data:
          comando: "Write=1&StSt=0"
