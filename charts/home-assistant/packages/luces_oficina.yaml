# HA package: the office lamp's brightness by the hour, always in warm white
# (2700 K). It hangs off a plain wall switch, so off means no power: HA sees it
# go `unavailable`, and switched back on it boots in its last state.
#
#   sunrise          -> sunrise + 1 h     10 % up to 100 %
#   sunrise + 1 h    -> sunset + 10 min   100 %
#   sunset + 10 min  -> 23:30             100 % down to 10 % (the evening lamps' ramp)
#   23:30            -> sunrise           10 %
#
# Every change is a straight line, and nothing gets brighter before sunrise.
# `sensor.lampara_oficina_brillo` is that curve. Back from `unavailable` the
# lamp goes to it at once; while it's on it follows each step of the curve as
# long as it still sits where the curve was, so a level set by hand stays until
# the next time it's switched on at the wall.
# See docs/home-assistant.md#office-lamp.

template:
  - trigger:
      - platform: time_pattern
        minutes: "/1"
      - platform: homeassistant
        event: start
    action:
      - variables:
          # Minutes since noon, so the night is one stretch: 23:30 is 690.
          # `next_rising` / `next_setting` are today's or tomorrow's, a minute
          # or two apart, so only their time of day is used.
          curva: >-
            {%- macro hora(attr, extra=0) %}
            {%- set t = state_attr('sun.sun', attr) | as_datetime | as_local %}
            {{- (t.hour * 60 + t.minute + extra - 720) % 1440 }}
            {%- endmacro %}
            {%- set amanecer = hora('next_rising') | int %}
            {%- set p = [[hora('next_setting', 10) | int, 100], [690, 10], [amanecer, 10], [amanecer + 60, 100]] %}
            {%- set m = (now().hour * 60 + now().minute - 720) % 1440 %}
            {%- set ns = namespace(a=p[0], b=p[0], f=0) %}
            {%- for i in range(p | count - 1) if p[i][0] <= m %}
            {%- set ns.a = p[i] %}
            {%- set ns.b = p[i + 1] %}
            {%- set ns.f = [(m - ns.a[0]) / (ns.b[0] - ns.a[0]) if ns.b[0] > ns.a[0] else 1, 1] | min %}
            {%- endfor %}
            {{- (ns.a[1] + (ns.b[1] - ns.a[1]) * ns.f) | round(0) | int }}
    sensor:
      - name: Lámpara oficina - Brillo según la hora
        unique_id: lampara_oficina_brillo
        default_entity_id: sensor.lampara_oficina_brillo
        unit_of_measurement: "%"
        icon: mdi:brightness-6
        state: "{{ curva }}"

automation:
  - id: luces_oficina
    alias: Lámpara oficina - Brillo según la hora
    description: >-
      Al prender la lámpara de la oficina con la llave la pone en blanco cálido
      al brillo que corresponde a la hora, y mientras está prendida lo va
      siguiendo: 100 % de día, baja en línea recta hasta 10 % entre el
      atardecer y las 23:30, queda en 10 % hasta el amanecer y sube a 100 % en
      la hora siguiente. Si alguien le cambia el brillo, lo deja hasta la
      próxima vez que se prenda.
    trigger:
      - platform: state
        entity_id: light.lampara_oficina
        from: unavailable
        to: "on"
        id: prendida
      - platform: state
        entity_id: sensor.lampara_oficina_brillo
        id: curva
    condition:
      - condition: state
        entity_id: light.lampara_oficina
        state: "on"
      - "{{ is_number(states('sensor.lampara_oficina_brillo')) }}"
    action:
      - variables:
          brillo: "{{ states('sensor.lampara_oficina_brillo') | int }}"
          pct: "{{ (state_attr('light.lampara_oficina', 'brightness') | int(0) * 100 / 255) | round(0) | int }}"
          # Still where the curve was before this step; 1-2 % of slack for the
          # 0-255 round trip.
          sigue: >-
            {{- trigger.id == 'curva' and trigger.from_state is not none
                and is_number(trigger.from_state.state)
                and (pct - trigger.from_state.state | int) | abs <= 2 }}
          # An HA start restores the lamp as `unavailable` before the wiz
          # integration loads it; that isn't a turn-on at the wall.
          encendida: >-
            {{- trigger.id == 'prendida'
                and (trigger.from_state.attributes.restored is not defined
                     or now() - trigger.from_state.last_changed > timedelta(minutes=1)) }}
      - choose:
          - conditions: "{{ encendida }}"
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.lampara_oficina
                data:
                  brightness_pct: "{{ brillo }}"
                  color_temp_kelvin: 2700
          - conditions: "{{ sigue and pct != brillo }}"
            sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.lampara_oficina
                data:
                  brightness_pct: "{{ brillo }}"
    mode: queued
