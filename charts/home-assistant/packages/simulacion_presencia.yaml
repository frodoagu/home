# HA package: presence simulation. While nobody is home, the bedroom and office
# lamps follow an evening routine, at different times every night, so the house
# doesn't look empty from the street.
# See docs/home-assistant.md#presence-simulation.
#
# ────────────────────────────────────────────────────────────────────────────
# THE NIGHT'S SCHEDULE is the two timestamp sensors below. A "night" runs from
# noon to noon, so an off time past midnight still belongs to the evening that
# started it (and to that evening's weekday). Each sensor draws a random minute
# inside its window:
#
#   lamps on   sunset - 15 min, kept within 19:30-20:00, + 0-44 min
#   lamps off  00:15 + 0-44 min   (+60 min on Friday and Saturday nights)
#
# The windows follow Argentine habits rather than the house's own history (too
# little of it so far): an average bedtime around 01:00. The lamps wait for dusk
# in summer, when sunset is past 20:00.
#
# They draw at 12:00 and at HA start, but a start KEEPS a restored time that
# still falls in tonight's window: only a stale schedule (HA was down at noon)
# is drawn again. So a restart never moves a time that already went by.
#
# ────────────────────────────────────────────────────────────────────────────
# WHO DRIVES WHAT. The two times turn the lamps on or off. The other triggers
# (the absence starting, un-pausing, an HA start) reconcile them with where the
# schedule says they should be right now, which is the catch-up for a time that
# went by with HA down (same reason as luces_afuera.yaml). A reconcile also
# turns OFF a lamp that is on outside the window: with nobody home, a lamp left
# on at 10:00 goes off when the absence starts.
#
# The two lamps move together, in warm white (2700 K), dimming from 100 % when
# they come on down to 10 % at 23:00, where they stay until they go off. Every
# 5 min the ramp re-dims the lamps that are on; one switched off remotely holds
# until the next on time. Nothing else re-applies the schedule.
#
# ────────────────────────────────────────────────────────────────────────────
# "NOBODY HOME" is `zone.home` == 0, the count of `person`s inside the zone
# (both have the mobile app's device_tracker, see climate.yaml). An ABSENCE is
# that count held at 0 for 15 min, so a GPS blip at the edge of the zone isn't
# one. It's recorded in `input_boolean.simulacion_presencia_ausencia` rather
# than read from `zone.home`'s last_changed, which an HA restart resets. A
# return is the count above 0 for 5 min, for the same reason.
#
# Anyone without a tracked phone is invisible to it: kids with a babysitter,
# guests, or someone home with a dead phone. For that there's
# `input_boolean.simulacion_presencia_pausa`: while it's on nothing here acts.
# A return clears it, so a pause covers one outing and can't be forgotten on.
# Pausing does not turn off what is already on.
#
# The bedroom lamp is driven through its group, `light.lampara_dormitorio_grupo`,
# not the wiz entity: the group survives the upstream zone split unchanged (see
# lampara_dormitorio.yaml), the wiz entity becomes zone A.
# ────────────────────────────────────────────────────────────────────────────

# No `initial` on any of them: the state is restored across restarts, and a
# brand-new helper starts off.
input_boolean:
  simulacion_presencia_pausa:
    name: Pausar simulación de presencia
    icon: mdi:home-off-outline
  simulacion_presencia_ausencia:
    name: Simulación de presencia - casa vacía
    icon: mdi:home-export-outline

template:
  - trigger:
      - platform: time
        at: "12:00:00"
      - platform: homeassistant
        event: start
    sensor:
      - name: "Simulación presencia - prende lámpara"
        unique_id: simulacion_presencia_lampara_prender
        default_entity_id: sensor.simulacion_presencia_lampara_prender
        device_class: timestamp
        icon: mdi:lamp
        # `desde` window start (HH:MM; before 12:00 means after midnight),
        # `minutos` its length, `finde` the shift on Friday and Saturday nights.
        # `next_setting` is today's or tomorrow's sunset, a minute or two off
        # tonight's; only its time of day is used.
        variables:
          desde: >-
            {%- set ocaso = state_attr('sun.sun', 'next_setting') | as_datetime(none) %}
            {%- set hora = (ocaso | as_local - timedelta(minutes=15)).strftime('%H:%M') if ocaso else '19:30' %}
            {{- [[hora, '19:30'] | max, '20:00'] | min }}
          minutos: 45
          finde: 0
        # The 5 min of slack keep a restored lamp time when the sunset has moved
        # a minute between the noon draw and a restart.
        state: &horario >-
          {%- set dia = (1 if desde < '12:00' else 0) - (1 if now().hour < 12 else 0) %}
          {%- set inicio = today_at(desde) + timedelta(days=dia) %}
          {%- set tarde = inicio - timedelta(hours=12) %}
          {%- set inicio = inicio + timedelta(minutes=finde if tarde.weekday() in [4, 5] else 0) %}
          {%- set holgura = timedelta(minutes=5) %}
          {%- set hora = this.state | as_datetime(none) %}
          {%- if hora is none or not inicio - holgura <= hora < inicio + timedelta(minutes=minutos) + holgura %}
          {%- set hora = inicio + timedelta(minutes=range(minutos) | random) %}
          {%- endif %}
          {{- hora.isoformat() }}

      - name: "Simulación presencia - apaga lámpara"
        unique_id: simulacion_presencia_lampara_apagar
        default_entity_id: sensor.simulacion_presencia_lampara_apagar
        device_class: timestamp
        icon: mdi:lamp-outline
        variables:
          desde: "00:15"
          minutos: 45
          finde: 60
        state: *horario

automation:
  # On a start the 15 min count from the start: `zone.home` has no history
  # across a restart, and an absence already under way is restored on.
  - id: simulacion_presencia_ausencia
    alias: Simulación de presencia - Casa vacía
    description: >-
      Marca la casa como vacía cuando no queda nadie durante 15 min. Es lo que
      arranca la simulación.
    trigger:
      - platform: state
        entity_id: zone.home
        to: "0"
        for: "00:15:00"
      - platform: homeassistant
        event: start
        id: arranque
    action:
      - if:
          - condition: trigger
            id: arranque
        then:
          - wait_template: "{{ not is_state('zone.home', '0') }}"
            timeout: "00:15:00"
          - condition: template
            value_template: "{{ not wait.completed }}"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.simulacion_presencia_ausencia
    mode: restart

  - id: simulacion_presencia_lamparas
    alias: Simulación de presencia - Lámparas
    description: >-
      Con la casa vacía prende y apaga las lámparas del dormitorio y la oficina
      a los horarios de los sensores "Simulación presencia", que cambian cada
      noche. Van en blanco cálido y bajan de 100 % al prender a 10 % a las
      23:00. Al vaciarse la casa, al sacar la pausa y al arrancar HA las deja
      como tendrían que estar a esa hora.
    trigger:
      - platform: time
        at: sensor.simulacion_presencia_lampara_prender
        id: lampara_prender
      - platform: time
        at: sensor.simulacion_presencia_lampara_apagar
        id: lampara_apagar
      - platform: state
        entity_id: input_boolean.simulacion_presencia_ausencia
        from: "off"
        to: "on"
        id: conciliar
      - platform: state
        entity_id: input_boolean.simulacion_presencia_pausa
        from: "on"
        to: "off"
        id: conciliar
      - platform: homeassistant
        event: start
        id: arranque
      - platform: time_pattern
        minutes: "/5"
        id: rampa
    # The conditions live in the action, after the start's delay: a top-level
    # condition would read the person/zone states before they've settled.
    action:
      - if:
          - condition: trigger
            id: arranque
        then:
          - delay: "00:01:00"
      - condition: state
        entity_id: input_boolean.simulacion_presencia_pausa
        state: "off"
      - condition: state
        entity_id: input_boolean.simulacion_presencia_ausencia
        state: "on"
      - condition: state
        entity_id: zone.home
        state: "0"
      - variables:
          # 'on', 'off', or '' to leave the lamps alone. A time trigger says
          # it outright; a reconcile reads the window, and so does the ramp,
          # which never turns anything off. Without a valid schedule nothing is
          # touched.
          lampara: >-
            {%- set desde = states('sensor.simulacion_presencia_lampara_prender') | as_datetime(none) %}
            {%- set hasta = states('sensor.simulacion_presencia_lampara_apagar') | as_datetime(none) %}
            {%- if trigger.id == 'lampara_prender' %}on
            {%- elif trigger.id == 'lampara_apagar' %}off
            {%- elif trigger.id in ['conciliar', 'arranque'] and desde and hasta %}
            {{- 'on' if desde <= now() < hasta else 'off' }}
            {%- elif trigger.id == 'rampa' and desde and hasta and desde <= now() < hasta %}on
            {%- endif %}
          lamparas:
            - light.lampara_dormitorio_grupo
            - light.lampara_oficina
          kelvin: 2700
          # 100 % at tonight's on time down to 10 % (WiZ's floor) at 23:00, in
          # a straight line, then held.
          brillo: >-
            {%- set desde = states('sensor.simulacion_presencia_lampara_prender') | as_datetime(none) %}
            {%- if desde %}
            {%- set fin = (desde | as_local).replace(hour=23, minute=0, second=0, microsecond=0) %}
            {%- set avance = (now() - desde).total_seconds() / (fin - desde).total_seconds() %}
            {{- [[100 - 90 * avance, 10] | max, 100] | min | round(0) | int }}
            {%- else %}100{%- endif %}
          # The lamps to send the warm white and `brillo` to: all of them, or
          # only those already on for the ramp, leaving out any already there
          # (1 % of slack for the 0-255 round trip).
          destino: >-
            {%- set ns = namespace(lista=[]) %}
            {%- for e in lamparas %}
            {%- set prendida = is_state(e, 'on') %}
            {%- set pct = (state_attr(e, 'brightness') | int(0) * 100 / 255) | round(0) | int %}
            {%- set listo = prendida and (pct - brillo) | abs <= 1
                  and (state_attr(e, 'color_temp_kelvin') | int(0) - kelvin) | abs <= 50 %}
            {%- if (prendida or trigger.id != 'rampa') and not listo %}
            {%- set ns.lista = ns.lista + [e] %}
            {%- endif %}
            {%- endfor %}
            {{- ns.lista }}
      # A lamp is touched only when it isn't already where it should be.
      - if: "{{ lampara == 'on' and destino | count > 0 }}"
        then:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: "{{ destino }}"
            data:
              brightness_pct: "{{ brillo }}"
              color_temp_kelvin: "{{ kelvin }}"
      - if: "{{ lampara == 'off' and lamparas | select('is_state', 'on') | list | count > 0 }}"
        then:
          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ lamparas | select('is_state', 'on') | list }}"
    # queued: an HA start and a time trigger can overlap.
    mode: queued

  # A return without a recorded absence changes nothing: coming back sooner
  # never had anything turned on, nor clears a pause set for the outing. The
  # start trigger covers someone who got back while HA was down.
  - id: simulacion_presencia_fin
    alias: Simulación de presencia - Volvió alguien
    description: >-
      Cuando vuelve alguien después de que la casa quedó vacía, saca la pausa.
      Las lámparas quedan como están.
    trigger:
      - platform: template
        value_template: "{{ states('zone.home') | int(0) > 0 }}"
        for: "00:05:00"
      - platform: homeassistant
        event: start
        id: arranque
    action:
      - if:
          - condition: trigger
            id: arranque
        then:
          - delay: "00:05:00"
      - condition: state
        entity_id: input_boolean.simulacion_presencia_ausencia
        state: "on"
      - condition: template
        value_template: "{{ states('zone.home') | int(0) > 0 }}"
      - action: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.simulacion_presencia_ausencia
            - input_boolean.simulacion_presencia_pausa
    mode: queued
