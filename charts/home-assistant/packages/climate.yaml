# HA package: split-AC climate entities. Three are IR (SmartIR + Broadlink); the
# kitchen runs on ESPHome and is not declared here.
#
# Versioned config that HA merges via `homeassistant: packages:`. Rendered into
# the {{ fullname }}-packages ConfigMap and mounted read-only at /config/packages.
# See docs/home-assistant.md ("Air conditioners"). No secrets here — device codes,
# entity ids and private LAN references only.

# Activates the SmartIR custom component (installed via HACS). Shared by the AC
# climate entities here and the TV IR media_players in tv.yaml.
smartir:

climate:
  - platform: smartir
    name: "Aire Living"
    unique_id: aire_living
    device_code: 1382  # Midea MSY-12HRDN1 (BGH Silent Air)
    controller_data: remote.control_living
    temperature_sensor: sensor.atc_29a8_temperatura
    humidity_sensor: sensor.atc_29a8_humedad
  - platform: smartir
    name: "Aire Dormitorio"
    unique_id: aire_dormitorio
    device_code: 5140  # Mitsubishi Electric MSC-A12WV (compatible con el Philco físico)
    controller_data: remote.control_dormitorio
    temperature_sensor: sensor.dormitorio_atc_b6d2_temperatura
    humidity_sensor: sensor.dormitorio_atc_b6d2_humedad
  - platform: smartir
    name: "Aire Chicos"
    unique_id: aire_chicos
    # Philco iView 3800 W — a *Wide WDS12ECO* on the wire. Captured off the
    # physical remote and decoded: the "56" protocol family, which SmartIR's only
    # Philco code (3000) belongs to but covers with cool + heat_cool alone. 3340 is
    # the one code in that family with a complete table. See docs/home-assistant.md.
    device_code: 3340
    # The blaster that used to sit in the kitchen, physically moved to this room.
    # Broadlink is a config-flow integration, so the entity id is whatever HA
    # already stored; renaming it in the UI means editing this line too.
    controller_data: remote.broadlink_cocina
    # No ATC BLE thermometer in this room, so no temperature/humidity sensor.

# The kitchen AC has no block here: it stopped being IR. It arrives through the
# ESPHome integration from the SLWF-01pro module (esphome/aire-cocina.yaml), which
# creates `climate.aire_cocina` by discovery — the same entity id the SmartIR one
# had, so every scene and automation below is untouched. Deleting the stale
# registry entry first is what makes that id land: docs/aire-cocina-slwf01pro.md.

# Escenas de acceso rápido para los aires. Aparecen como entidades script.*
# (botones en la app HA / cards del dashboard) y, al estar `script` en
# googleAssistant.exposedDomains, también como escenas en Google Home.
# Encender fija modo+temperatura en UNA llamada (climate.set_temperature con
# hvac_mode): con IR cada envío manda el frame completo, así un solo blast deja
# el equipo en el estado deseado. Apagar usa climate.turn_off.
script:
  # El dormitorio va un grado abajo que el resto: se duerme mejor a 20.
  aires_todos_encender:
    alias: Aires - Encender todos (calor 21, pieza 20)
    icon: mdi:air-conditioner
    sequence:
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_cocina
        data:
          hvac_mode: heat
          temperature: 21
      - action: climate.set_temperature
        target:
          entity_id: climate.aire_dormitorio
        data:
          hvac_mode: heat
          temperature: 20
    mode: single

  aires_todos_frio:
    alias: Aires - Encender todos (frío 24)
    icon: mdi:snowflake
    sequence:
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_dormitorio
            - climate.aire_cocina
        data:
          hvac_mode: cool
          temperature: 24
    mode: single

  aires_solo_pieza:
    alias: Aires - Solo la pieza (calor 20)
    icon: mdi:bed
    sequence:
      - action: climate.turn_off
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_cocina
      - action: climate.set_temperature
        target:
          entity_id: climate.aire_dormitorio
        data:
          hvac_mode: heat
          temperature: 20
    mode: single

  aires_todos_apagar:
    alias: Aires - Apagar todos
    icon: mdi:air-conditioner
    sequence:
      - action: climate.turn_off
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_dormitorio
            - climate.aire_cocina
    mode: single

  # Un solo botón idempotente: solo apaga cuando los TRES están prendidos; en
  # cualquier otro estado (mezclado o todo apagado) prende los tres en calor
  # (21, y el dormitorio 20). Así un estado mezclado primero se lleva a "todo
  # prendido" y recién el próximo toque apaga. El estado que ve HA es el asumido
  # (IR es unidireccional).
  #
  # The kitchen is the exception since it moved to ESPHome: its state is the real
  # one, so a mixed group resolves correctly at least on that third. It is also the
  # only one that can go `unavailable` (Wi-Fi, not IR), so the condition decides on
  # the units HA can actually see — an offline kitchen is ignored instead of
  # pinning the button to the "turn everything on" branch until it comes back.
  aires_toggle_calor:
    alias: Aires - Toggle todos (calor 21, pieza 20 / off)
    icon: mdi:fire
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = expand('climate.aire_living', 'climate.aire_dormitorio', 'climate.aire_cocina')
                       | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
                  {{ aires | count > 0 and aires | selectattr('state', 'eq', 'off') | list | count == 0 }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_living
                    - climate.aire_dormitorio
                    - climate.aire_cocina
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_living
                - climate.aire_cocina
            data:
              hvac_mode: heat
              temperature: 21
          - action: climate.set_temperature
            target:
              entity_id: climate.aire_dormitorio
            data:
              hvac_mode: heat
              temperature: 20
    mode: single

  # Igual que aires_toggle_calor pero prende en frío 24 (para el verano): solo
  # apaga cuando los tres están prendidos; en cualquier otro estado los pone en frío 24.
  aires_toggle_frio:
    alias: Aires - Toggle todos (frío 24 / off)
    icon: mdi:snowflake
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = expand('climate.aire_living', 'climate.aire_dormitorio', 'climate.aire_cocina')
                       | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
                  {{ aires | count > 0 and aires | selectattr('state', 'eq', 'off') | list | count == 0 }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_living
                    - climate.aire_dormitorio
                    - climate.aire_cocina
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_living
                - climate.aire_dormitorio
                - climate.aire_cocina
            data:
              hvac_mode: cool
              temperature: 24
    mode: single

  # Mismos dos toggles pero sin el dormitorio: la zona de estar (cocina +
  # living), que es la que se usa de día. Misma regla que los de arriba — solo
  # apaga cuando LOS DOS están prendidos; mezclado o todo apagado prende los dos.
  # El blast va a los dos aunque uno ya esté prendido: con IR cada envío manda el
  # frame completo, así que reafirma modo+temperatura en vez de togglear.
  aires_cocina_living_toggle_calor:
    alias: Aires - Toggle cocina + living (calor 21 / off)
    icon: mdi:fire
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = expand('climate.aire_cocina', 'climate.aire_living')
                       | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
                  {{ aires | count > 0 and aires | selectattr('state', 'eq', 'off') | list | count == 0 }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_cocina
                    - climate.aire_living
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_cocina
                - climate.aire_living
            data:
              hvac_mode: heat
              temperature: 21
    mode: single

  aires_cocina_living_toggle_frio:
    alias: Aires - Toggle cocina + living (frío 24 / off)
    icon: mdi:snowflake
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = expand('climate.aire_cocina', 'climate.aire_living')
                       | rejectattr('state', 'in', ['unavailable', 'unknown']) | list %}
                  {{ aires | count > 0 and aires | selectattr('state', 'eq', 'off') | list | count == 0 }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_cocina
                    - climate.aire_living
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_cocina
                - climate.aire_living
            data:
              hvac_mode: cool
              temperature: 24
    mode: single

  # The kids' room stands alone: it is in neither the "todos" scenes nor the
  # scheduled automations below, so it never starts or stops unless someone asks.
  # Heat goes to 20, same as the main bedroom.
  #
  # IR, like the living room and the bedroom, so what these read is the state HA
  # assumes. Someone using the physical remote desyncs it and the next press can
  # look like a no-op — same caveat as the group toggles above.
  aire_chicos_toggle_calor:
    alias: Aire chicos - Toggle (calor 20 / off)
    icon: mdi:fire
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ states('climate.aire_chicos') not in ['off', 'unavailable', 'unknown'] }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id: climate.aire_chicos
        default:
          - action: climate.set_temperature
            target:
              entity_id: climate.aire_chicos
            data:
              hvac_mode: heat
              temperature: 20
    mode: single

  aire_chicos_toggle_frio:
    alias: Aire chicos - Toggle (frío 24 / off)
    icon: mdi:snowflake
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ states('climate.aire_chicos') not in ['off', 'unavailable', 'unknown'] }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id: climate.aire_chicos
        default:
          - action: climate.set_temperature
            target:
              entity_id: climate.aire_chicos
            data:
              hvac_mode: cool
              temperature: 24
    mode: single

# ────────────────────────────────────────────────────────────────────────────
# AUTOMATISMO DE LOS AIRES. Migrado 1:1 desde las automatizaciones de Google
# Home (google-home/automations/*.yaml): mismos horarios, umbrales y guardas.
# Si las de Google Home siguen activas en la app, BORRARLAS — si no, dos
# planificadores mandan sobre los mismos equipos.
#
# Traducción de nombres: los YAML de Google hablan de dispositivos
# `Nombre - Habitación`; acá van entity_id.
#
#   Aire Cocina/Living/Dormitorio  -> climate.aire_{cocina,living,dormitorio}
#   Living - Salón                 -> sensor.atc_29a8_temperatura (renombrado
#                                     "Living" en el registry, es el termómetro
#                                     BTHome del living, no el aire)
#   Temperatura Exterior - Afuera  -> sensor.temperatura_exterior (weather.yaml)
#   home.state.HomePresence: HOME  -> zone.home > 0 (el estado de una zona es la
#                                     cantidad de personas adentro; hay dos
#                                     `person` con device_tracker del celular)
#
# Google separa prender / fijar modo / fijar setpoint en tres comandos; acá va
# un solo `climate.set_temperature` con `hvac_mode`, por el mismo motivo que las
# escenas de arriba: con IR cada envío manda el frame completo, así que un blast
# deja el equipo prendido, en modo y en temperatura.
#
# Los triggers disparan por CRUCE de umbral y no se reevalúan al arrancar HA (a
# diferencia de luces_afuera.yaml, que sí lleva un trigger `homeassistant.start`).
# Es a propósito: perder un ciclo de aires por un reinicio es preferible a que un
# deploy prenda los equipos solo.
#
# OJO con las condiciones sobre el estado de un `climate.*`: el IR es
# unidireccional, así que HA reporta el estado que ASUME, no el del equipo. Si
# alguien lo apagó con el control remoto, HA no se entera.
#
# `climate.aire_cocina` is the exception: it runs on ESPHome over the unit's own
# bus, so it reports what the AC is really doing and is the one entity here whose
# state is worth trusting in a condition.
# ────────────────────────────────────────────────────────────────────────────
automation:
  - id: aires_calor_manana
    alias: Aires - Calor a la mañana (cocina + living)
    description: >-
      Prende cocina y living en calor 21 a las 8:00 de lunes a viernes y a las
      9:00 los fines de semana, sólo si hay alguien en casa y el living está a
      17 °C o menos.
    trigger:
      - platform: time
        at: "08:00:00"
        id: semana
      - platform: time
        at: "09:00:00"
        id: finde
    condition:
      # El trigger sólo aporta la hora; qué días vale cada uno se filtra acá.
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: semana
              - condition: time
                weekday: [mon, tue, wed, thu, fri]
          - condition: and
            conditions:
              - condition: trigger
                id: finde
              - condition: time
                weekday: [sat, sun]
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      # `lessThanOrEqualTo: 17C` en Google. `numeric_state: below` es estricto,
      # así que el <= va por template. El default 99 deja la condición en false
      # si el termómetro está caído: ante la duda no prende nada.
      - condition: template
        value_template: "{{ states('sensor.atc_29a8_temperatura') | float(99) <= 17 }}"
    action:
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_cocina
            - climate.aire_living
        data:
          hvac_mode: heat
          temperature: 21
    mode: single

  - id: aires_apagar_templado
    alias: Aires - Apagar cuando afuera llega a 19 °C
    description: >-
      Apaga los tres aires cuando la temperatura exterior llega a 19 °C, pero
      sólo si están calefaccionando. Mirar el modo en vez de un rango de fechas
      es lo que evita que toque los equipos en verano, cuando están en frío.
    trigger:
      # `greaterThanOrEqualTo: 19C` en Google. Va como template trigger y no
      # como `numeric_state: above: 19` porque `above` es estricto y el `met`
      # suele reportar valores con un decimal: un 19.0 clavado nunca dispararía.
      # Un template trigger dispara en la transición false -> true, que es la
      # misma semántica de cruce.
      - platform: template
        value_template: "{{ states('sensor.temperatura_exterior') | float(-99) >= 19 }}"
    condition:
      - condition: state
        entity_id: climate.aire_living
        state: heat
    action:
      - action: climate.turn_off
        target:
          entity_id:
            - climate.aire_cocina
            - climate.aire_living
            - climate.aire_dormitorio
    mode: single

  - id: aires_frio_dia_caluroso
    alias: Aires - Frío 24 en día caluroso
    description: >-
      Prende los tres aires en frío 24 cuando afuera pasa los 30 °C y adentro
      el living ya pasó los 24 °C, sólo si hay alguien en casa.
    trigger:
      - platform: numeric_state
        entity_id: sensor.temperatura_exterior
        above: 30
    condition:
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      - condition: numeric_state
        entity_id: sensor.atc_29a8_temperatura
        above: 24
    action:
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_cocina
            - climate.aire_living
            - climate.aire_dormitorio
        data:
          hvac_mode: cool
          temperature: 24
    mode: single
