# HA package: split-AC climate entities (SmartIR + Broadlink IR).
#
# Versioned config that HA merges via `homeassistant: packages:`. Rendered into
# the {{ fullname }}-packages ConfigMap and mounted read-only at /config/packages.
# See docs/home-assistant.md ("Air conditioners"). No secrets here — device codes,
# entity ids and private LAN references only.

# Activates the SmartIR custom component (installed via HACS). Shared by the AC
# climate entities here and the TV IR media_players in tv.yaml.
smartir:

climate:
  - platform: smartir
    name: "Aire Living"
    unique_id: aire_living
    device_code: 1382  # Midea MSY-12HRDN1 (BGH Silent Air)
    controller_data: remote.control_living
    temperature_sensor: sensor.atc_29a8_temperatura
    humidity_sensor: sensor.atc_29a8_humedad
  - platform: smartir
    name: "Aire Dormitorio"
    unique_id: aire_dormitorio
    device_code: 5140  # Mitsubishi Electric MSC-A12WV (compatible con el Philco físico)
    controller_data: remote.control_dormitorio
    temperature_sensor: sensor.dormitorio_atc_b6d2_temperatura
    humidity_sensor: sensor.dormitorio_atc_b6d2_humedad
  - platform: smartir
    name: "Aire Cocina"
    unique_id: aire_cocina
    device_code: 1382  # Midea MSY-12HRDN1 (BGH Silent Air) - mismo equipo que el living
    controller_data: remote.broadlink_cocina
  # Philco iView 3800 W, a Wide WDS12ECO on the wire — read off its own remote,
  # see docs/home-assistant.md. No BLE thermometer here, so no ambient reading.
  - platform: smartir
    name: "Aire Chicos"
    unique_id: aire_chicos
    device_code: 3340
    controller_data: remote.broadlink_chicos

# Mode the seasonal buttons pick. Outdoor temperature, falling back to the living
# thermometer when the weather sensor is down.
template:
  - sensor:
      - name: "Aires modo estacional"
        unique_id: aires_modo_estacional
        icon: "{{ 'mdi:snowflake' if this.state == 'cool' else 'mdi:fire' }}"
        state: >-
          {% set exterior = states('sensor.temperatura_exterior') | float(-999) %}
          {% set interior = states('sensor.atc_29a8_temperatura') | float(-999) %}
          {% set t = exterior if exterior > -900 else interior %}
          {{ 'cool' if t >= 22 else 'heat' }}

# Escenas de acceso rápido para los aires. Aparecen como entidades script.*
# (botones en la app HA / el dashboard "Aires") y, al estar `script` en
# googleAssistant.exposedDomains, también como escenas en Google Home.
#
# Setpoints: heat is 21 in the living areas and 20 in the two bedrooms, cool is
# 24 everywhere. Turning on sets mode and temperature in ONE
# `climate.set_temperature` call: every IR send carries the whole frame, so a
# single blast leaves the unit in the wanted state.
#
# The toggles are idempotent — they only turn off when EVERY unit in the group is
# on, so a mixed group is first driven to "all on" and the next tap turns it off.
# HA reports the state it ASSUMED; IR is one-way, so a physical remote goes
# unnoticed.
script:
  aires_todos_encender:
    alias: Aires - Encender todos (calor 21, piezas 20)
    icon: mdi:air-conditioner
    sequence:
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_cocina
        data:
          hvac_mode: heat
          temperature: 21
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_dormitorio
            - climate.aire_chicos
        data:
          hvac_mode: heat
          temperature: 20
    mode: single

  aires_todos_frio:
    alias: Aires - Encender todos (frío 24)
    icon: mdi:snowflake
    sequence:
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_dormitorio
            - climate.aire_cocina
            - climate.aire_chicos
        data:
          hvac_mode: cool
          temperature: 24
    mode: single

  aires_solo_pieza:
    alias: Aires - Solo la pieza (calor 20)
    icon: mdi:bed
    sequence:
      - action: climate.turn_off
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_cocina
            - climate.aire_chicos
      - action: climate.set_temperature
        target:
          entity_id: climate.aire_dormitorio
        data:
          hvac_mode: heat
          temperature: 20
    mode: single

  aires_todos_apagar:
    alias: Aires - Apagar todos
    icon: mdi:air-conditioner
    sequence:
      - action: climate.turn_off
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_dormitorio
            - climate.aire_cocina
            - climate.aire_chicos
    mode: single

  aires_toggle_calor:
    alias: Aires - Toggle todos (calor 21, piezas 20 / off)
    icon: mdi:fire
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = ['climate.aire_living', 'climate.aire_cocina',
                                  'climate.aire_dormitorio', 'climate.aire_chicos'] %}
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_living
                    - climate.aire_dormitorio
                    - climate.aire_cocina
                    - climate.aire_chicos
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_living
                - climate.aire_cocina
            data:
              hvac_mode: heat
              temperature: 21
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_dormitorio
                - climate.aire_chicos
            data:
              hvac_mode: heat
              temperature: 20
    mode: single

  aires_toggle_frio:
    alias: Aires - Toggle todos (frío 24 / off)
    icon: mdi:snowflake
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = ['climate.aire_living', 'climate.aire_cocina',
                                  'climate.aire_dormitorio', 'climate.aire_chicos'] %}
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_living
                    - climate.aire_dormitorio
                    - climate.aire_cocina
                    - climate.aire_chicos
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_living
                - climate.aire_dormitorio
                - climate.aire_cocina
                - climate.aire_chicos
            data:
              hvac_mode: cool
              temperature: 24
    mode: single

  # One button that reads `sensor.aires_modo_estacional` instead of asking which
  # season it is. Same off-only-when-all-on rule as the pair above.
  aires_toggle_estacional:
    alias: Aires - Toggle todos (según la estación)
    icon: mdi:sun-snowflake-variant
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = ['climate.aire_living', 'climate.aire_cocina',
                                  'climate.aire_dormitorio', 'climate.aire_chicos'] %}
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_living
                    - climate.aire_dormitorio
                    - climate.aire_cocina
                    - climate.aire_chicos
        default:
          - if:
              - condition: state
                entity_id: sensor.aires_modo_estacional
                state: cool
            then:
              - action: climate.set_temperature
                target:
                  entity_id:
                    - climate.aire_living
                    - climate.aire_dormitorio
                    - climate.aire_cocina
                    - climate.aire_chicos
                data:
                  hvac_mode: cool
                  temperature: 24
            else:
              - action: climate.set_temperature
                target:
                  entity_id:
                    - climate.aire_living
                    - climate.aire_cocina
                data:
                  hvac_mode: heat
                  temperature: 21
              - action: climate.set_temperature
                target:
                  entity_id:
                    - climate.aire_dormitorio
                    - climate.aire_chicos
                data:
                  hvac_mode: heat
                  temperature: 20
    mode: single

  # Mismos dos toggles pero sin las piezas: la zona de estar (cocina + living),
  # que es la que se usa de día. Misma regla — solo apaga cuando LOS DOS están
  # prendidos. El blast va a los dos aunque uno ya esté prendido: con IR cada
  # envío manda el frame completo, así que reafirma modo+temperatura en vez de
  # togglear.
  aires_cocina_living_toggle_calor:
    alias: Aires - Toggle cocina + living (calor 21 / off)
    icon: mdi:fire
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = ['climate.aire_cocina', 'climate.aire_living'] %}
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_cocina
                    - climate.aire_living
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_cocina
                - climate.aire_living
            data:
              hvac_mode: heat
              temperature: 21
    mode: single

  aires_cocina_living_toggle_frio:
    alias: Aires - Toggle cocina + living (frío 24 / off)
    icon: mdi:snowflake
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = ['climate.aire_cocina', 'climate.aire_living'] %}
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_cocina
                    - climate.aire_living
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_cocina
                - climate.aire_living
            data:
              hvac_mode: cool
              temperature: 24
    mode: single

  # El espejo de noche de los dos de arriba: las dos piezas juntas, a 20 en calor
  # (se duerme mejor un grado abajo) y 24 en frío.
  aires_zona_noche_toggle_calor:
    alias: Aires - Toggle piezas (calor 20 / off)
    icon: mdi:fire
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = ['climate.aire_dormitorio', 'climate.aire_chicos'] %}
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_dormitorio
                    - climate.aire_chicos
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_dormitorio
                - climate.aire_chicos
            data:
              hvac_mode: heat
              temperature: 20
    mode: single

  aires_zona_noche_toggle_frio:
    alias: Aires - Toggle piezas (frío 24 / off)
    icon: mdi:snowflake
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = ['climate.aire_dormitorio', 'climate.aire_chicos'] %}
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_dormitorio
                    - climate.aire_chicos
        default:
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_dormitorio
                - climate.aire_chicos
            data:
              hvac_mode: cool
              temperature: 24
    mode: single

  # Bedrooms on at the seasonal setpoint and the slowest fan each unit declares
  # (`level1` on the 5140, `low` on the 3340); living areas off. The delay keeps
  # the fan frame from stepping on the temperature frame on the same blaster.
  aires_modo_dormir:
    alias: Aires - Modo dormir (piezas suaves, resto apagado)
    icon: mdi:sleep
    sequence:
      - variables:
          modo: "{{ states('sensor.aires_modo_estacional') }}"
          temperatura: "{{ 24 if states('sensor.aires_modo_estacional') == 'cool' else 20 }}"
      - action: climate.turn_off
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_cocina
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_dormitorio
            - climate.aire_chicos
        data:
          hvac_mode: "{{ modo }}"
          temperature: "{{ temperatura }}"
      - delay: "00:00:01"
      - action: climate.set_fan_mode
        target:
          entity_id: climate.aire_dormitorio
        data:
          fan_mode: level1
      - action: climate.set_fan_mode
        target:
          entity_id: climate.aire_chicos
        data:
          fan_mode: low
    mode: single

  # ±1 °C on every unit that is ON, each clamped to its own min/max (they differ:
  # 17-30 on the 1382, 16-31 on the 5140, 16-32 on the 3340). An `if` and not a
  # `condition` step: inside a repeat a failed condition aborts the whole script
  # instead of skipping the item. The pair is identical except for `delta`.
  aires_subir_grado:
    alias: Aires - Subir un grado
    icon: mdi:thermometer-plus
    variables:
      delta: 1
    sequence:
      - repeat:
          for_each:
            - climate.aire_living
            - climate.aire_cocina
            - climate.aire_dormitorio
            - climate.aire_chicos
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ states(repeat.item) not in ['off', 'unavailable', 'unknown']
                       and state_attr(repeat.item, 'temperature') is not none }}
              then:
                - action: climate.set_temperature
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    temperature: >-
                      {{ [[ state_attr(repeat.item, 'temperature') | float + delta,
                            state_attr(repeat.item, 'max_temp') | float(30) ] | min,
                          state_attr(repeat.item, 'min_temp') | float(16) ] | max }}
    mode: single

  aires_bajar_grado:
    alias: Aires - Bajar un grado
    icon: mdi:thermometer-minus
    variables:
      delta: -1
    sequence:
      - repeat:
          for_each:
            - climate.aire_living
            - climate.aire_cocina
            - climate.aire_dormitorio
            - climate.aire_chicos
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ states(repeat.item) not in ['off', 'unavailable', 'unknown']
                       and state_attr(repeat.item, 'temperature') is not none }}
              then:
                - action: climate.set_temperature
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    temperature: >-
                      {{ [[ state_attr(repeat.item, 'temperature') | float + delta,
                            state_attr(repeat.item, 'max_temp') | float(30) ] | min,
                          state_attr(repeat.item, 'min_temp') | float(16) ] | max }}
    mode: single

# ────────────────────────────────────────────────────────────────────────────
# AUTOMATISMO DE LOS AIRES. Migrado 1:1 desde las automatizaciones de Google
# Home (google-home/automations/*.yaml): mismos horarios, umbrales y guardas.
# Si las de Google Home siguen activas en la app, BORRARLAS — si no, dos
# planificadores mandan sobre los mismos equipos.
#
# Traducción de nombres: los YAML de Google hablan de dispositivos
# `Nombre - Habitación`; acá van entity_id.
#
#   Aire Cocina/Living/Dormitorio  -> climate.aire_{cocina,living,dormitorio}
#   Living - Salón                 -> sensor.atc_29a8_temperatura (renombrado
#                                     "Living" en el registry, es el termómetro
#                                     BTHome del living, no el aire)
#   Temperatura Exterior - Afuera  -> sensor.temperatura_exterior (weather.yaml)
#   home.state.HomePresence: HOME  -> zone.home > 0 (el estado de una zona es la
#                                     cantidad de personas adentro; hay dos
#                                     `person` con device_tracker del celular)
#
# Google separa prender / fijar modo / fijar setpoint en tres comandos; acá va
# un solo `climate.set_temperature` con `hvac_mode`, por el mismo motivo que las
# escenas de arriba: con IR cada envío manda el frame completo, así que un blast
# deja el equipo prendido, en modo y en temperatura.
#
# Los triggers disparan por CRUCE de umbral y no se reevalúan al arrancar HA (a
# diferencia de luces_afuera.yaml, que sí lleva un trigger `homeassistant.start`).
# Es a propósito: perder un ciclo de aires por un reinicio es preferible a que un
# deploy prenda los equipos solo.
#
# OJO con las condiciones sobre el estado de un `climate.*`: el IR es
# unidireccional, así que HA reporta el estado que ASUME, no el del equipo. Si
# alguien lo apagó con el control remoto, HA no se entera.
#
# `climate.aire_chicos` is in every group script but only in the turn-OFF
# schedule: nothing here starts that unit on a timer, the room is driven by hand.
# ────────────────────────────────────────────────────────────────────────────
automation:
  - id: aires_calor_manana
    alias: Aires - Calor a la mañana (cocina + living)
    description: >-
      Prende cocina y living en calor 21 a las 8:00 de lunes a viernes y a las
      9:00 los fines de semana, sólo si hay alguien en casa y el living está a
      17 °C o menos.
    trigger:
      - platform: time
        at: "08:00:00"
        id: semana
      - platform: time
        at: "09:00:00"
        id: finde
    condition:
      # El trigger sólo aporta la hora; qué días vale cada uno se filtra acá.
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: semana
              - condition: time
                weekday: [mon, tue, wed, thu, fri]
          - condition: and
            conditions:
              - condition: trigger
                id: finde
              - condition: time
                weekday: [sat, sun]
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      # `lessThanOrEqualTo: 17C` en Google. `numeric_state: below` es estricto,
      # así que el <= va por template. El default 99 deja la condición en false
      # si el termómetro está caído: ante la duda no prende nada.
      - condition: template
        value_template: "{{ states('sensor.atc_29a8_temperatura') | float(99) <= 17 }}"
    action:
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_cocina
            - climate.aire_living
        data:
          hvac_mode: heat
          temperature: 21
    mode: single

  - id: aires_apagar_templado
    alias: Aires - Apagar cuando afuera llega a 19 °C
    description: >-
      Apaga los cuatro aires cuando la temperatura exterior llega a 19 °C, pero
      sólo si están calefaccionando. Mirar el modo en vez de un rango de fechas
      es lo que evita que toque los equipos en verano, cuando están en frío.
    trigger:
      # `greaterThanOrEqualTo: 19C` en Google. Va como template trigger y no
      # como `numeric_state: above: 19` porque `above` es estricto y el `met`
      # suele reportar valores con un decimal: un 19.0 clavado nunca dispararía.
      # Un template trigger dispara en la transición false -> true, que es la
      # misma semántica de cruce.
      - platform: template
        value_template: "{{ states('sensor.temperatura_exterior') | float(-99) >= 19 }}"
    condition:
      - condition: state
        entity_id: climate.aire_living
        state: heat
    action:
      - action: climate.turn_off
        target:
          entity_id:
            - climate.aire_cocina
            - climate.aire_living
            - climate.aire_dormitorio
            - climate.aire_chicos
    mode: single

  - id: aires_frio_dia_caluroso
    alias: Aires - Frío 24 en día caluroso
    description: >-
      Prende los tres aires en frío 24 cuando afuera pasa los 30 °C y adentro
      el living ya pasó los 24 °C, sólo si hay alguien en casa.
    trigger:
      - platform: numeric_state
        entity_id: sensor.temperatura_exterior
        above: 30
    condition:
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      - condition: numeric_state
        entity_id: sensor.atc_29a8_temperatura
        above: 24
    action:
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_cocina
            - climate.aire_living
            - climate.aire_dormitorio
        data:
          hvac_mode: cool
          temperature: 24
    mode: single
