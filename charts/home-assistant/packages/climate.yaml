# HA package: split-AC climate entities (SmartIR + Broadlink IR).
#
# Versioned config that HA merges via `homeassistant: packages:`. Rendered into
# the {{ fullname }}-packages ConfigMap and mounted read-only at /config/packages.
# See docs/home-assistant.md ("Air conditioners"). No secrets here — device codes,
# entity ids and private LAN references only.

# Activates the SmartIR custom component (installed via HACS). Shared by the AC
# climate entities here and the TV IR media_players in tv.yaml.
smartir:

climate:
  - platform: smartir
    name: "Aire Living"
    unique_id: aire_living
    device_code: 1382  # Midea MSY-12HRDN1 (BGH Silent Air)
    controller_data: remote.control_living
    temperature_sensor: sensor.atc_29a8_temperatura
    humidity_sensor: sensor.atc_29a8_humedad
  - platform: smartir
    name: "Aire Dormitorio"
    unique_id: aire_dormitorio
    device_code: 5140  # Mitsubishi Electric MSC-A12WV (compatible con el Philco físico)
    controller_data: remote.control_dormitorio
    temperature_sensor: sensor.dormitorio_atc_b6d2_temperatura
    humidity_sensor: sensor.dormitorio_atc_b6d2_humedad
  - platform: smartir
    name: "Aire Cocina"
    unique_id: aire_cocina
    device_code: 1382  # Midea MSY-12HRDN1 (BGH Silent Air) - mismo equipo que el living
    controller_data: remote.broadlink_cocina
  # Philco iView 3800 W, a Wide WDS12ECO on the wire — read off its own remote,
  # see docs/home-assistant.md. No BLE thermometer here, so no ambient reading.
  - platform: smartir
    name: "Aire Chicos"
    unique_id: aire_chicos
    device_code: 3340
    controller_data: remote.broadlink_chicos

# Mode the seasonal buttons pick. Outdoor temperature, falling back to the living
# thermometer when the weather sensor is down.
template:
  - sensor:
      - name: "Aires modo estacional"
        unique_id: aires_modo_estacional
        icon: "{{ 'mdi:snowflake' if this.state == 'cool' else 'mdi:fire' }}"
        state: >-
          {% set exterior = states('sensor.temperatura_exterior') | float(-999) %}
          {% set interior = states('sensor.atc_29a8_temperatura') | float(-999) %}
          {% set t = exterior if exterior > -900 else interior %}
          {{ 'cool' if t >= 26 else 'heat' }}

# Scheduled shutdown. One timer backs both ways of asking for it — "in N hours"
# starts it with that duration, "at HH:MM" converts the picked time into the
# remaining seconds — so there is a single countdown to read and a single thing to
# cancel. `restore` keeps it running across an HA restart.
timer:
  aires_apagado:
    name: "Apagado programado de los aires"
    icon: mdi:timer-sand
    duration: "01:00:00"
    restore: true

input_datetime:
  aires_apagar_hora:
    name: "Hora de apagado de los aires"
    icon: mdi:clock-outline
    has_date: false
    has_time: true

# Escenas de acceso rápido para los aires. Aparecen como entidades script.*
# (botones en la app HA / el dashboard "Aires") y, al estar `script` en
# googleAssistant.exposedDomains, también como escenas en Google Home.
#
# Setpoints: heat is 21 in the living areas and the kids' room, 20 in Fede's
# bedroom; cool is 24 everywhere. So the two bedrooms share a cool setpoint but
# not a heat one, and every script that heats both sends them separately.
# Turning on sets mode and temperature in ONE
# `climate.set_temperature` call: every IR send carries the whole frame, so a
# single blast leaves the unit in the wanted state.
#
# The kids' unit follows Fede's bedroom while `binary_sensor.chicos_en_casa`
# (chicos.yaml) isn't `off`, so a broken calendar still starts it: every script
# that turns the bedroom on turns it on too, and the whole-house ones include
# it. While it is `off` no script turns it on, so a toggle counts only the
# units left. Turning off is different: every off a script sends includes the
# kids' unit whether they're home or not, so a tap is sure to switch it off.
#
# The toggles are idempotent — they only turn off when EVERY unit in the group is
# on, so a mixed group is first driven to "all on" and the next tap turns it off.
# HA reports the state it ASSUMED; IR is one-way, so a physical remote goes
# unnoticed.
script:
  # Re-blasts what HA believes each unit holds, `off` included. SmartIR builds
  # every frame from the entity's whole state (mode, fan, swing, setpoint), so a
  # `set_temperature` with the current mode and setpoint resends all of it. For a
  # unit that missed an IR frame; it never changes what HA shows.
  aires_reenviar:
    alias: Aires - Re-enviar el estado actual
    icon: mdi:send
    sequence:
      - repeat:
          for_each:
            - climate.aire_living
            - climate.aire_cocina
            - climate.aire_dormitorio
            - climate.aire_chicos
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ is_state(repeat.item, 'off') }}"
                  sequence:
                    - action: climate.turn_off
                      target:
                        entity_id: "{{ repeat.item }}"
                - conditions:
                    - condition: template
                      value_template: >-
                        {{ states(repeat.item) not in ['unavailable', 'unknown']
                           and state_attr(repeat.item, 'temperature') is not none }}
                  sequence:
                    - action: climate.set_temperature
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        hvac_mode: "{{ states(repeat.item) }}"
                        temperature: "{{ state_attr(repeat.item, 'temperature') }}"
    mode: single

  aires_todos_apagar:
    alias: Aires - Apagar todos
    icon: mdi:air-conditioner
    sequence:
      - action: climate.turn_off
        target:
          entity_id:
            - climate.aire_living
            - climate.aire_cocina
            - climate.aire_dormitorio
            - climate.aire_chicos
    mode: single

  # One button for the whole house: the "on" side reads
  # `sensor.aires_modo_estacional` instead of asking which season it is.
  aires_toggle_estacional:
    alias: Aires - Toggle todos (según la estación)
    icon: mdi:sun-snowflake-variant
    variables:
      chicos: "{{ not is_state('binary_sensor.chicos_en_casa', 'off') }}"
    sequence:
      - variables:
          aires: >-
            {{ ['climate.aire_living', 'climate.aire_cocina', 'climate.aire_dormitorio']
               + (['climate.aire_chicos'] if chicos else []) }}
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_living
                    - climate.aire_cocina
                    - climate.aire_dormitorio
                    - climate.aire_chicos
        default:
          - if:
              - condition: state
                entity_id: sensor.aires_modo_estacional
                state: cool
            then:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ aires }}"
                data:
                  hvac_mode: cool
                  temperature: 24
            else:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ aires | reject('eq', 'climate.aire_dormitorio') | list }}"
                data:
                  hvac_mode: heat
                  temperature: 21
              - action: climate.set_temperature
                target:
                  entity_id: climate.aire_dormitorio
                data:
                  hvac_mode: heat
                  temperature: 20
    mode: single

  # The seasonal toggle scoped to half the house: the day zone (kitchen + living)
  # and the bedrooms. Off only when every unit of the zone is on. The "on" side
  # blasts all of them even if one is already on: every IR send carries the
  # whole frame, so it re-asserts mode+setpoint instead of toggling.
  aires_cocina_living_toggle:
    alias: Aires - Toggle cocina + living (según la estación)
    icon: mdi:sofa
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = ['climate.aire_cocina', 'climate.aire_living'] %}
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_cocina
                    - climate.aire_living
        default:
          - variables:
              frio: "{{ is_state('sensor.aires_modo_estacional', 'cool') }}"
          - action: climate.set_temperature
            target:
              entity_id:
                - climate.aire_cocina
                - climate.aire_living
            data:
              hvac_mode: "{{ 'cool' if frio else 'heat' }}"
              temperature: "{{ 24 if frio else 21 }}"
    mode: single

  aires_zona_noche_toggle:
    alias: Aires - Toggle piezas (según la estación)
    icon: mdi:bed-double
    variables:
      chicos: "{{ not is_state('binary_sensor.chicos_en_casa', 'off') }}"
    sequence:
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {% set aires = ['climate.aire_dormitorio'] + (['climate.aire_chicos'] if chicos else []) %}
                  {{ aires | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                     | list | count == aires | count }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_dormitorio
                    - climate.aire_chicos
        default:
          - variables:
              frio: "{{ is_state('sensor.aires_modo_estacional', 'cool') }}"
          - action: climate.set_temperature
            target:
              entity_id: climate.aire_dormitorio
            data:
              hvac_mode: "{{ 'cool' if frio else 'heat' }}"
              temperature: "{{ 24 if frio else 20 }}"
          - if: "{{ chicos }}"
            then:
              - action: climate.set_temperature
                target:
                  entity_id: climate.aire_chicos
                data:
                  hvac_mode: "{{ 'cool' if frio else 'heat' }}"
                  temperature: "{{ 24 if frio else 21 }}"
    mode: single

  # Bedrooms on at the seasonal setpoint and the slowest fan each unit declares
  # (`level1` on the 5140, `low` on the 3340); the rest off. The delay keeps the
  # fan frame from stepping on the temperature frame on the same blaster.
  aires_modo_dormir:
    alias: Aires - Modo dormir (piezas suaves, resto apagado)
    icon: mdi:sleep
    sequence:
      - variables:
          frio: "{{ is_state('sensor.aires_modo_estacional', 'cool') }}"
          chicos: "{{ not is_state('binary_sensor.chicos_en_casa', 'off') }}"
      - action: climate.turn_off
        target:
          entity_id: >-
            {{ ['climate.aire_living', 'climate.aire_cocina']
               + ([] if chicos else ['climate.aire_chicos']) }}
      - action: climate.set_temperature
        target:
          entity_id: climate.aire_dormitorio
        data:
          hvac_mode: "{{ 'cool' if frio else 'heat' }}"
          temperature: "{{ 24 if frio else 20 }}"
      - if: "{{ chicos }}"
        then:
          - action: climate.set_temperature
            target:
              entity_id: climate.aire_chicos
            data:
              hvac_mode: "{{ 'cool' if frio else 'heat' }}"
              temperature: "{{ 24 if frio else 21 }}"
      - delay: "00:00:01"
      - action: climate.set_fan_mode
        target:
          entity_id: climate.aire_dormitorio
        data:
          fan_mode: level1
      - if: "{{ chicos }}"
        then:
          - action: climate.set_fan_mode
            target:
              entity_id: climate.aire_chicos
            data:
              fan_mode: low
    mode: single

  # Fede's bedroom (and so the kids', while they're home) as the only units on:
  # off only when they are ALL on and kitchen and living are off (in any mode),
  # otherwise them on the slowest fan and the rest off. The off frame goes to
  # the rest even when HA has them off, so a unit started from its remote is
  # caught too.
  aires_solo_dormitorio_toggle:
    alias: Aires - Toggle solo dormitorio (según la estación)
    icon: mdi:bed-king
    variables:
      chicos: "{{ not is_state('binary_sensor.chicos_en_casa', 'off') }}"
    sequence:
      - variables:
          piezas: "{{ ['climate.aire_dormitorio'] + (['climate.aire_chicos'] if chicos else []) }}"
          otros: ["climate.aire_living", "climate.aire_cocina"]
      - choose:
          - conditions:
              - condition: template
                value_template: >-
                  {{ piezas | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                         | list | count == piezas | count
                     and otros | map('states') | reject('in', ['off', 'unavailable', 'unknown'])
                         | list | count == 0 }}
            sequence:
              - action: climate.turn_off
                target:
                  entity_id:
                    - climate.aire_dormitorio
                    - climate.aire_chicos
        default:
          - variables:
              frio: "{{ is_state('sensor.aires_modo_estacional', 'cool') }}"
          - action: climate.turn_off
            target:
              entity_id: "{{ otros + ([] if chicos else ['climate.aire_chicos']) }}"
          - action: climate.set_temperature
            target:
              entity_id: climate.aire_dormitorio
            data:
              hvac_mode: "{{ 'cool' if frio else 'heat' }}"
              temperature: "{{ 24 if frio else 20 }}"
          - if: "{{ chicos }}"
            then:
              - action: climate.set_temperature
                target:
                  entity_id: climate.aire_chicos
                data:
                  hvac_mode: "{{ 'cool' if frio else 'heat' }}"
                  temperature: "{{ 24 if frio else 21 }}"
          - delay: "00:00:01"
          - action: climate.set_fan_mode
            target:
              entity_id: climate.aire_dormitorio
            data:
              fan_mode: level1
          - if: "{{ chicos }}"
            then:
              - action: climate.set_fan_mode
                target:
                  entity_id: climate.aire_chicos
                data:
                  fan_mode: low
    mode: single

  # ±1 °C on every unit that is ON, each clamped to its own min/max (they differ:
  # 17-30 on the 1382, 16-31 on the 5140, 16-32 on the 3340). An `if` and not a
  # `condition` step: inside a repeat a failed condition aborts the whole script
  # instead of skipping the item. The pair is identical except for `delta`.
  aires_subir_grado:
    alias: Aires - Subir un grado
    icon: mdi:thermometer-plus
    variables:
      delta: 1
      chicos: "{{ not is_state('binary_sensor.chicos_en_casa', 'off') }}"
    sequence:
      - repeat:
          for_each:
            - climate.aire_living
            - climate.aire_cocina
            - climate.aire_dormitorio
            - climate.aire_chicos
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ states(repeat.item) not in ['off', 'unavailable', 'unknown']
                       and state_attr(repeat.item, 'temperature') is not none
                       and (chicos or repeat.item != 'climate.aire_chicos') }}
              then:
                - action: climate.set_temperature
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    temperature: >-
                      {{ [[ state_attr(repeat.item, 'temperature') | float + delta,
                            state_attr(repeat.item, 'max_temp') | float(30) ] | min,
                          state_attr(repeat.item, 'min_temp') | float(16) ] | max }}
    mode: single

  aires_bajar_grado:
    alias: Aires - Bajar un grado
    icon: mdi:thermometer-minus
    variables:
      delta: -1
      chicos: "{{ not is_state('binary_sensor.chicos_en_casa', 'off') }}"
    sequence:
      - repeat:
          for_each:
            - climate.aire_living
            - climate.aire_cocina
            - climate.aire_dormitorio
            - climate.aire_chicos
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ states(repeat.item) not in ['off', 'unavailable', 'unknown']
                       and state_attr(repeat.item, 'temperature') is not none
                       and (chicos or repeat.item != 'climate.aire_chicos') }}
              then:
                - action: climate.set_temperature
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    temperature: >-
                      {{ [[ state_attr(repeat.item, 'temperature') | float + delta,
                            state_attr(repeat.item, 'max_temp') | float(30) ] | min,
                          state_attr(repeat.item, 'min_temp') | float(16) ] | max }}
    mode: single

  # Both entry points to the scheduled shutdown. The timer is what actually
  # fires; cancelling it is what unschedules, since `timer.finished` does not fire
  # on a cancel.
  aires_apagar_en_horas:
    alias: Aires - Programar apagado en unas horas
    icon: mdi:timer-outline
    fields:
      horas:
        name: Horas
        description: Cuánto falta para que se apaguen los cuatro aires.
        default: 1
        selector:
          number:
            min: 0.5
            max: 12
            step: 0.5
            unit_of_measurement: h
    sequence:
      - action: timer.start
        target:
          entity_id: timer.aires_apagado
        data:
          duration: "{{ (horas | default(1) | float(1) * 3600) | int }}"
    mode: single

  # `input_datetime.aires_apagar_hora` is time-only, so its `timestamp` attribute
  # is seconds since midnight. A target already past today rolls to tomorrow.
  aires_apagar_a_las:
    alias: Aires - Programar apagado a una hora
    icon: mdi:clock-outline
    sequence:
      - variables:
          faltan: >-
            {% set objetivo = state_attr('input_datetime.aires_apagar_hora', 'timestamp') | int(0) %}
            {% set ahora = now().hour * 3600 + now().minute * 60 + now().second %}
            {% set delta = objetivo - ahora %}
            {{ delta if delta > 0 else delta + 86400 }}
      - action: timer.start
        target:
          entity_id: timer.aires_apagado
        data:
          duration: "{{ faltan }}"
    mode: single

  aires_cancelar_apagado:
    alias: Aires - Cancelar el apagado programado
    icon: mdi:timer-off-outline
    sequence:
      - action: timer.cancel
        target:
          entity_id: timer.aires_apagado
    mode: single

# ────────────────────────────────────────────────────────────────────────────
# AC AUTOMATIONS. aires_calor_manana, aires_apagar_templado and
# aires_frio_dia_caluroso are the Google Home schedules
# (google-home/automations/*.yaml) with the same times, thresholds and guards;
# if those are still active in the app, delete them, or two schedulers drive the
# same units. Google's device names map to:
#
#   Aire Cocina/Living/Dormitorio  -> climate.aire_{cocina,living,dormitorio}
#   Living - Salón                 -> sensor.atc_29a8_temperatura (the living's
#                                     BTHome thermometer, not the AC)
#   Temperatura Exterior - Afuera  -> sensor.temperatura_exterior (weather.yaml)
#   home.state.HomePresence: HOME  -> binary_sensor.casa_ocupada on (Fede's or
#                                     Irupé's phone on Pi-hole, presencia.yaml)
#
# Triggers fire on a threshold CROSSING and are not re-evaluated at HA start
# (unlike luces_afuera.yaml): losing one AC cycle to a restart beats a deploy
# starting the units by itself. A condition on a `climate.*` reads the state HA
# ASSUMES: IR is one-way, so a unit switched by its remote goes unnoticed.
#
# The kids' unit follows Fede's bedroom only while `binary_sensor.chicos_en_casa`
# (chicos.yaml) is `on`: every automation that switches the bedroom, on or off,
# switches it too, and the whole-house turn-offs include it. Otherwise no
# automation touches it, so whoever uses the room drives it by hand; the one
# exception is the scheduled shutdown, set by hand, which turns all four off. Their
# coming home or leaving switches nothing by itself; it also keeps aires_se_van
# from cutting the ACs while they're home.
#
# Every automation reports what it did with a push to Fede's phone, on the
# "Aires" Android channel. The push is the LAST step, so a failed notify never
# keeps a unit from switching.
# ────────────────────────────────────────────────────────────────────────────
automation:
  - id: aires_calor_manana
    alias: Aires - Calor a la mañana (cocina + living)
    description: >-
      Prende cocina y living en calor 21 a las 8:00 de lunes a viernes y a las
      9:00 los fines de semana, sólo si hay alguien en casa (el celular de Fede
      o el de Irupé en Pi-hole) y el living está a 17 °C o menos.
    trigger:
      - platform: time
        at: "08:00:00"
        id: semana
      - platform: time
        at: "09:00:00"
        id: finde
    condition:
      # The trigger only brings the time; which days each one counts is here.
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: trigger
                id: semana
              - condition: time
                weekday: [mon, tue, wed, thu, fri]
          - condition: and
            conditions:
              - condition: trigger
                id: finde
              - condition: time
                weekday: [sat, sun]
      - condition: state
        entity_id: binary_sensor.casa_ocupada
        state: "on"
      # Google's `lessThanOrEqualTo: 17C`. `numeric_state: below` is strict, so
      # the <= is a template. The 99 default leaves it false with the
      # thermometer down: when in doubt, nothing turns on.
      - condition: template
        value_template: "{{ states('sensor.atc_29a8_temperatura') | float(99) <= 17 }}"
    action:
      - action: climate.set_temperature
        target:
          entity_id:
            - climate.aire_cocina
            - climate.aire_living
        data:
          hvac_mode: heat
          temperature: 21
      - action: notify.mobile_app_motorola_edge_70
        data:
          title: Aires
          message: >-
            El living está a {{ states('sensor.atc_29a8_temperatura') | float | round(1) }} °C:
            prendí cocina y living en calor 21 °C.
          data:
            channel: Aires
            notification_icon: mdi:air-conditioner
    mode: single

  - id: aires_apagar_templado
    alias: Aires - Apagar cuando afuera llega a 19 °C
    description: >-
      Apaga cocina, living y dormitorio (y el de los chicos si están según el
      calendario) cuando la temperatura exterior llega a 19 °C, pero sólo si
      están calefaccionando. Mirar el modo en vez de un rango de fechas es lo
      que evita que toque los equipos en verano, cuando están en frío.
    trigger:
      # Google's `greaterThanOrEqualTo: 19C`. A template trigger and not
      # `numeric_state: above: 19`, because `above` is strict and `met` reports
      # one decimal: a flat 19.0 would never fire. A template trigger fires on
      # the false -> true transition, the same crossing semantics.
      - platform: template
        value_template: "{{ states('sensor.temperatura_exterior') | float(-99) >= 19 }}"
    condition:
      - condition: state
        entity_id: climate.aire_living
        state: heat
    action:
      - variables:
          aires: >-
            {{ ['climate.aire_cocina', 'climate.aire_living', 'climate.aire_dormitorio']
               + (['climate.aire_chicos'] if is_state('binary_sensor.chicos_en_casa', 'on') else []) }}
      - action: climate.turn_off
        target:
          entity_id: "{{ aires }}"
      - action: notify.mobile_app_motorola_edge_70
        data:
          title: Aires
          message: >-
            Afuera llegó a {{ states('sensor.temperatura_exterior') }} °C: apagué
            {{ aires | map('state_attr', 'friendly_name') | map('replace', 'Aire ', '')
            | map('lower') | join(', ') }}, que estaban en calor.
          data:
            channel: Aires
            notification_icon: mdi:air-conditioner
    mode: single

  - id: aires_apagado_programado
    alias: Aires - Apagado programado
    description: >-
      Apaga los cuatro aires, estén o no los chicos, cuando se termina el timer
      que arrancan los botones de "apagar en unas horas" / "apagar a las". Dispara con el evento
      `timer.finished`, que NO se emite cuando el timer se cancela — por eso
      cancelar el timer alcanza para desprogramar el apagado.
    trigger:
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.aires_apagado
    action:
      - action: script.aires_todos_apagar
      - action: notify.mobile_app_motorola_edge_70
        data:
          title: Aires
          message: "Terminó el apagado programado: apagué los cuatro aires."
          data:
            channel: Aires
            notification_icon: mdi:air-conditioner
    mode: single

  # SmartIR has no display command, so the frames go straight to the blasters.
  # On every unit it is a TOGGLE, and any later command from HA lights the
  # display again. The 1382 units speak Coolix, whose LED frame is the constant
  # B5 F5 A5 (each byte followed by its complement, sent twice), on the 1382
  # code's own timings. The bedroom's Mitsubishi112 has no separate command:
  # the remote's display button sends the full state frame plus 0x40 in byte 5
  # and 0x80 in byte 12, so `dormitorio_led` builds that frame from the state
  # HA assumes (byte 7 is 31 - T, fixed at 7 in dry; byte 8 swing * 8 + fan;
  # byte 13 the sum), LSB first, as a Broadlink packet in base64. The kids'
  # unit is not learned yet.
  - id: aires_display_medianoche
    alias: Aires - Apagar el display a la medianoche
    description: >-
      A las 00:00 apaga la luz del display de los aires que están prendidos,
      para que no molesten de noche. El comando del display es un toggle: si
      ya estaba apagado, se prende.
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - variables:
          coolix_led: >-
            b64:JgDKAJGOEzQTEBM0FDQUEBQ0ExAUNBQQFDQUEBQQFDQUEBQ0FBAUNBQ0FDQUNBQQFDQUEBQ0FBAUEBMQFBAUNBQQFDQUEBQ0FBAUNBQQFBAUNBQQFDQUEBQ0FBATNBQ0FBAUNBQQFKmSjRQ0FBAUNBQ0FBAUNBQQFDQUEBQ0FBAUEBM0FBAUNBQQFDQUNBQ0FDQUEBQ0FBAUNBQQFBAUEBQQFDQUEBQ0FBAUNBQQFDQVEBQQFDQUEBQ0FBAUNBQQFDQUNBQQFDQUEBQADQUAAAAAAAAAAAAAAAAAAA==
          dormitorio_led: >-
            {%- set a = 'climate.aire_dormitorio' %}
            {%- set modo = states(a) %}
            {%- set modos = {'heat': 1, 'dry': 2, 'cool': 3} %}
            {%- set fans = {'auto': 0, 'level1': 2, 'level2': 3, 'level3': 5} %}
            {%- set swings = {'auto': 0, 'top': 1, 'high': 2, 'mid': 3, 'low': 4, 'bottom': 5, 'swing': 7} %}
            {%- set y = [35, 203, 38, 1, 0, 36 + 64, modos.get(modo, 1),
                         7 if modo == 'dry' else 31 - state_attr(a, 'temperature') | int(20),
                         swings.get(state_attr(a, 'swing_mode'), 0) * 8 + fans.get(state_attr(a, 'fan_mode'), 0),
                         0, 0, 0, 128] %}
            {%- set y = y + [y | sum % 256] %}
            {%- set ns = namespace(t=[114, 56], s='b64:') %}
            {%- for b in y %}{% for i in range(8) %}
            {%- set ns.t = ns.t + [15, 41 if (b // 2 ** i) % 2 else 13] %}
            {%- endfor %}{% endfor %}
            {%- set p = [38, 0, ns.t | count + 4, 0] + ns.t + [15, 0, 13, 5] %}
            {%- set abc = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/' %}
            {%- for i in range(0, p | count, 3) %}
            {%- set c = p[i:i + 3] + [0, 0] %}
            {%- set n = c[0] * 65536 + c[1] * 256 + c[2] %}
            {%- set ns.s = ns.s ~ abc[n // 262144] ~ abc[n // 4096 % 64]
                 ~ (abc[n // 64 % 64] if p | count > i + 1 else '=')
                 ~ (abc[n % 64] if p | count > i + 2 else '=') %}
            {%- endfor %}
            {{- ns.s -}}
          displays:
            - aire: climate.aire_living
              remote: remote.control_living
              codigo: "{{ coolix_led }}"
            - aire: climate.aire_cocina
              remote: remote.broadlink_cocina
              codigo: "{{ coolix_led }}"
            - aire: climate.aire_dormitorio
              remote: remote.control_dormitorio
              codigo: "{{ dormitorio_led }}"
          prendidos: >-
            {{ displays | rejectattr('aire', 'is_state', ['off', 'unavailable', 'unknown']) | list }}
      - condition: template
        value_template: "{{ prendidos | count > 0 }}"
      - repeat:
          for_each: "{{ prendidos }}"
          sequence:
            - action: remote.send_command
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item.remote }}"
              data:
                command: "{{ repeat.item.codigo }}"
      - action: notify.mobile_app_motorola_edge_70
        data:
          title: Aires
          message: >-
            Medianoche: apagué el display de {{ prendidos | map(attribute='aire')
            | map('state_attr', 'friendly_name') | map('replace', 'Aire ', '')
            | map('lower') | join(', ') }}.
          data:
            channel: Aires
            notification_icon: mdi:air-conditioner
    mode: single

  - id: aires_frio_dia_caluroso
    alias: Aires - Frío 24 en día caluroso
    description: >-
      Prende cocina, living y dormitorio (y el de los chicos si están según el
      calendario) en frío 24 cuando afuera pasa los 30 °C y adentro el living
      ya pasó los 24 °C, sólo si hay alguien en casa (el celular de Fede o el
      de Irupé en Pi-hole).
    trigger:
      - platform: numeric_state
        entity_id: sensor.temperatura_exterior
        above: 30
    condition:
      - condition: state
        entity_id: binary_sensor.casa_ocupada
        state: "on"
      - condition: numeric_state
        entity_id: sensor.atc_29a8_temperatura
        above: 24
    action:
      - variables:
          aires: >-
            {{ ['climate.aire_cocina', 'climate.aire_living', 'climate.aire_dormitorio']
               + (['climate.aire_chicos'] if is_state('binary_sensor.chicos_en_casa', 'on') else []) }}
      - action: climate.set_temperature
        target:
          entity_id: "{{ aires }}"
        data:
          hvac_mode: cool
          temperature: 24
      - action: notify.mobile_app_motorola_edge_70
        data:
          title: Aires
          message: >-
            Afuera hace {{ states('sensor.temperatura_exterior') }} °C y el living
            está a {{ states('sensor.atc_29a8_temperatura') | float | round(1) }} °C:
            prendí {{ aires | map('state_attr', 'friendly_name') | map('replace', 'Aire ', '')
            | map('lower') | join(', ') }} en frío 24 °C.
          data:
            channel: Aires
            notification_icon: mdi:air-conditioner
    mode: single

  # Each thermometer triggers its own zone; 09:00 (and a manual run, which has no
  # trigger id) checks both, because a crossing inside the night window is not
  # seen again. `queued`: one update of the outdoor sensor can fire both zones.
  - id: aires_apagar_frio_afuera_fresco
    alias: Aires - Apagar el frío cuando afuera está más fresco
    description: >-
      Apaga los aires que están en frío cuando afuera hace la misma temperatura
      o menos que adentro. Cocina y living miran el termómetro del living;
      dormitorio, el del dormitorio, y con él el de los chicos si están según el
      calendario. No actúa entre las 23 y las 9, y a
      las 9 revisa las dos zonas. Si falta un termómetro no apaga nada.
    trigger:
      - platform: template
        value_template: >-
          {{ states('sensor.temperatura_exterior') | float(99)
             <= states('sensor.atc_29a8_temperatura') | float(-99) }}
        id: living
      - platform: template
        value_template: >-
          {{ states('sensor.temperatura_exterior') | float(99)
             <= states('sensor.dormitorio_atc_b6d2_temperatura') | float(-99) }}
        id: piezas
      - platform: time
        at: "09:00:00"
        id: manana
    condition:
      - condition: time
        after: "09:00:00"
        before: "23:00:00"
    action:
      - variables:
          zonas:
            - id: living
              termometro: sensor.atc_29a8_temperatura
              aires: [climate.aire_living, climate.aire_cocina]
            - id: piezas
              termometro: sensor.dormitorio_atc_b6d2_temperatura
              aires: >-
                {{ ['climate.aire_dormitorio']
                   + (['climate.aire_chicos'] if is_state('binary_sensor.chicos_en_casa', 'on') else []) }}
          exterior: "{{ states('sensor.temperatura_exterior') }}"
          # Zones where it is as cool or cooler outside AND something is in cool.
          frescas: >-
            {% set ns = namespace(zonas=[]) %}
            {% for z in zonas if (trigger.id | default('manana', true)) in [z.id, 'manana'] %}
              {% set adentro = states(z.termometro) %}
              {% if exterior | is_number and adentro | is_number
                    and exterior | float <= adentro | float
                    and z.aires | select('is_state', 'cool') | list %}
                {% set ns.zonas = ns.zonas + [z] %}
              {% endif %}
            {% endfor %}
            {{ ns.zonas }}
          apagar: >-
            {{ frescas | map(attribute='aires') | sum(start=[])
               | select('is_state', 'cool') | list }}
      - condition: template
        value_template: "{{ apagar | count > 0 }}"
      - action: climate.turn_off
        target:
          entity_id: "{{ apagar }}"
      - action: notify.mobile_app_motorola_edge_70
        data:
          title: Aires
          message: >-
            Afuera hace {{ exterior }} °C y adentro
            {% for z in frescas %}{{ states(z.termometro) | float | round(1) }} °C
            ({{ state_attr(z.termometro, 'friendly_name') | lower }}){{ ', ' if not loop.last }}{% endfor %}.
            Apagué {{ apagar | map('state_attr', 'friendly_name') | join(', ') }}.
            Abrí las ventanas.
          data:
            channel: Aires
            notification_icon: mdi:air-conditioner
    mode: queued

  # An arrival is the presence sensor's off -> on only, so the phone was gone
  # from Pi-hole for 30 min (45 overnight or on low battery); Pi-hole coming back from a restart
  # is unavailable -> on and doesn't count. From 01:00 to 07:00 only the
  # bedroom's unit is in play. It never turns a unit off. Every unit
  # of a zone out of range gets the command, because the IR state is assumed:
  # one switched off by remote still reads as on. A unit already in that mode
  # keeps its setpoint.
  - id: aires_llegada
    alias: Aires - Prender al llegar Fede
    description: >-
      Cuando Fede llega a casa (su celular vuelve a aparecer en Pi-hole después
      de 30 min sin verse), prende los aires de las zonas que están fuera de
      19-25 °C: calor 21 por debajo de 19, frío 24 por encima de 25. Cocina y
      living miran el termómetro del living; dormitorio, el del dormitorio, y
      con él el de los chicos si están según el calendario. Entre la 1 y las 7
      solo el del dormitorio. Nunca apaga nada.
    trigger:
      - platform: state
        entity_id: binary_sensor.fede_en_casa
        from: "off"
        to: "on"
    action:
      - variables:
          de_noche: "{{ 1 <= now().hour < 7 }}"
      - variables:
          zonas:
            - termometro: sensor.atc_29a8_temperatura
              aires: "{{ [] if de_noche else ['climate.aire_living', 'climate.aire_cocina'] }}"
            - termometro: sensor.dormitorio_atc_b6d2_temperatura
              aires: >-
                {{ ['climate.aire_dormitorio']
                   + (['climate.aire_chicos'] if not de_noche and is_state('binary_sensor.chicos_en_casa', 'on') else []) }}
          planes: >-
            {%- set ns = namespace(planes=[]) %}
            {%- for z in zonas if states(z.termometro) | is_number %}
              {%- set adentro = states(z.termometro) | float %}
              {%- if adentro < 19 or adentro > 25 %}
                {%- set modo = 'heat' if adentro < 19 else 'cool' %}
                {%- for a in z.aires %}
                  {%- set temp = state_attr(a, 'temperature') | float(0) if is_state(a, modo) else 0 %}
                  {%- set ns.planes = ns.planes + [{'aire': a, 'termometro': z.termometro, 'modo': modo,
                        'temp': temp or (21 if modo == 'heat' else 24)}] %}
                {%- endfor %}
              {%- endif %}
            {%- endfor %}
            {{- ns.planes }}
      - condition: template
        value_template: "{{ planes | count > 0 }}"
      - repeat:
          for_each: "{{ planes }}"
          sequence:
            - action: climate.set_temperature
              continue_on_error: true
              target:
                entity_id: "{{ repeat.item.aire }}"
              data:
                hvac_mode: "{{ repeat.item.modo }}"
                temperature: "{{ repeat.item.temp }}"
      - action: notify.mobile_app_motorola_edge_70
        data:
          title: Aires
          message: >-
            {% set modos = {'heat': 'calor', 'cool': 'frío'} %}
            Llegaste:
            {% for t in planes | map(attribute='termometro') | unique %}{{ state_attr(t, 'friendly_name') | lower }}
            a {{ states(t) | float | round(1) }} °C{{ ', ' if not loop.last }}{% endfor %}.
            Prendí {% for p in planes %}{{ state_attr(p.aire, 'friendly_name') | replace('Aire ', '') | lower }}
            en {{ modos[p.modo] }} {{ '%g' | format(p.temp) }} °C{{ ', ' if not loop.last }}{% endfor %}.
          data:
            channel: Aires
            notification_icon: mdi:air-conditioner
    mode: single

  # Fires when the house empties: neither Fede's nor Irupé's phone on Pi-hole
  # (`binary_sensor.casa_ocupada`), so it never cuts the ACs while she minds
  # the house, and catches what she leaves on. Only `on` -> `off` counts, and
  # the kids must read `off`: an unavailable sensor turns nothing off. So the
  # kids' unit is never in it (the room may be someone else's). The off frame
  # goes to the other three whatever HA assumes, which catches a unit started
  # from its remote.
  - id: aires_se_van
    alias: Aires - Apagar cuando queda la casa vacía
    description: >-
      Cuando no queda nadie en casa (ni el celular de Fede ni el de Irupé en
      Pi-hole) y los chicos no están según el calendario, apaga cocina, living
      y dormitorio. El de los chicos lo deja como está.
    trigger:
      - platform: state
        entity_id: binary_sensor.casa_ocupada
        from: "on"
        to: "off"
    condition:
      - condition: state
        entity_id: binary_sensor.chicos_en_casa
        state: "off"
    action:
      - variables:
          aires:
            - climate.aire_living
            - climate.aire_cocina
            - climate.aire_dormitorio
          prendidos: "{{ aires | reject('is_state', ['off', 'unavailable', 'unknown']) | list }}"
      - action: climate.turn_off
        target:
          entity_id: "{{ aires }}"
      - if: "{{ prendidos | count > 0 }}"
        then:
          - action: notify.mobile_app_motorola_edge_70
            data:
              title: Aires
              message: >-
                No queda nadie en casa: apagué {{ prendidos | map('state_attr', 'friendly_name')
                | map('replace', 'Aire ', '') | map('lower') | join(', ') }}.
              data:
                channel: Aires
                notification_icon: mdi:air-conditioner
    mode: single

  # Catches a stray tap on the home-screen widget. A script run shares its
  # context with the state changes it causes, so `user_id` names who pressed the
  # button; automations never set one, so the pushes above are not doubled.
  # `restart` + the delay fold a multi-unit button into one push of the end state.
  - id: aires_avisar_afuera
    alias: Aires - Avisar cambios hechos desde afuera
    description: >-
      Si Fede prende, apaga o cambia de modo algún aire estando fuera de casa, le
      manda un push con cómo quedaron los cuatro. Las automatizaciones no avisan
      por acá: ya mandan su propio push.
    trigger:
      - platform: state
        entity_id:
          - climate.aire_living
          - climate.aire_cocina
          - climate.aire_dormitorio
          - climate.aire_chicos
        to: ~
    condition:
      - condition: template
        value_template: >-
          {{ trigger.to_state.context.user_id is not none
             and trigger.to_state.context.user_id == state_attr('person.federico_agu', 'user_id') }}
      - condition: not
        conditions:
          - condition: state
            entity_id: binary_sensor.fede_en_casa
            state: "on"
    action:
      - delay: "00:00:05"
      - action: notify.mobile_app_motorola_edge_70
        data:
          title: Aires
          message: >-
            {% set modos = {'heat': 'calor', 'cool': 'frío', 'dry': 'seco',
                            'fan_only': 'ventilador', 'heat_cool': 'auto'} %}
            {% set aires = ['climate.aire_living', 'climate.aire_cocina',
                            'climate.aire_dormitorio', 'climate.aire_chicos'] %}
            {% set prendidos = aires | reject('is_state', ['off', 'unavailable', 'unknown']) | list %}
            {% set apagados = aires | reject('in', prendidos) | map('state_attr', 'friendly_name')
                              | map('replace', 'Aire ', '') | list %}
            {% if prendidos %}
            Prendidos: {% for a in prendidos %}{{ state_attr(a, 'friendly_name') | replace('Aire ', '') }}
            ({{ modos.get(states(a), states(a)) }} {{ state_attr(a, 'temperature') }} °C){{ ', ' if not loop.last }}{% endfor %}.
            {{ 'Apagados: ' ~ apagados | join(', ') ~ '.' if apagados }}
            {% else %}
            Quedaron todos apagados.
            {% endif %}
          data:
            channel: Aires
            notification_icon: mdi:air-conditioner
            tag: aires_afuera
    mode: restart
