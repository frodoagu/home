# HA package: unified webOS + IR TV control.
#
# Versioned config that HA merges via `homeassistant: packages:`. Rendered into
# the {{ fullname }}-packages ConfigMap and mounted read-only at /config/packages.
# See docs/home-assistant.md ("LG webOS TVs"). No secrets — MACs and private LAN
# references only (also in charts/pihole and the docs).
#
# The `script:`/`automation:` here are read-only from the UI (they live in this
# package, not scripts.yaml/automations.yaml). New UI-created ones still work —
# they land in the still-writable /config/{scripts,automations}.yaml.

# Registers wake_on_lan.send_magic_packet, used by the WoL automations below.
wake_on_lan:

media_player:
  # --- IR-only entities (SmartIR, LG code 1042: discrete on/off) ---
  # The whole LG blaster (power, volume, mute, channels, sources/nav): the IR
  # power fallback, and full manual control when the network is down.
  - platform: smartir
    name: "TV Sala IR"
    unique_id: tv_sala_ir
    device_code: 1042  # LG webOS (43UM7510 / OLED B8/B9)
    controller_data: remote.control_living
  - platform: smartir
    name: "TV Dormitorio IR"
    unique_id: tv_dormitorio_ir
    device_code: 1042  # LG webOS
    controller_data: remote.control_dormitorio

  # --- Unified entities (one per room) ---
  # webOS over IP gives on/off state and the rich controls (apps, sources,
  # volume level); turn on/off use the WoL/webOS-first scripts with an IR
  # fallback. The only entity exposed to Google Home.
  - platform: universal
    name: "TV Sala"
    unique_id: tv_sala
    device_class: tv
    children:
      - media_player.sala_de_estar
    commands:
      turn_on: { action: script.tv_sala_turn_on }
      turn_off: { action: script.tv_sala_turn_off }
    attributes:
      state: media_player.sala_de_estar
  - platform: universal
    name: "TV Dormitorio"
    unique_id: tv_dormitorio
    device_class: tv
    children:
      - media_player.dormitorio
    commands:
      turn_on: { action: script.tv_dormitorio_turn_on }
      turn_off: { action: script.tv_dormitorio_turn_off }
    attributes:
      state: media_player.dormitorio

# turn_on: webOS/WoL first, IR only if webOS hasn't reported the TV on within
# 20s. The 1042 IR "on" and "off" are the SAME power toggle, so an IR sent while
# the TV is still booting from WoL turns it back off: the wait has to outlast a
# cold boot, not just the WoL send. turn_off mirrors it.
script:
  # The two TVs' turn_on/turn_off, given the webOS entity and the IR one.
  # `parallel` so both TVs can run at once; each TV's own script below is
  # `single`, so a double tap can't send the IR toggle twice.
  tv_encender:
    alias: TV - Encender (WoL + IR de respaldo)
    icon: mdi:television
    fields: &tv_campos
      webos:
        description: El media_player webOS de la tele.
        required: true
        selector:
          entity:
            domain: media_player
      ir:
        description: El media_player IR de la misma tele.
        required: true
        selector:
          entity:
            domain: media_player
    sequence:
      - action: media_player.turn_on
        target:
          entity_id: "{{ webos }}"
      - wait_template: >-
          {{ states(webos) not in ['off', 'unavailable', 'unknown', 'standby'] }}
        timeout: "00:00:20"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: media_player.turn_on
            target:
              entity_id: "{{ ir }}"
    mode: parallel

  tv_apagar:
    alias: TV - Apagar (webOS + IR de respaldo)
    icon: mdi:television-off
    fields: *tv_campos
    sequence:
      - action: media_player.turn_off
        target:
          entity_id: "{{ webos }}"
      - wait_template: >-
          {{ states(webos) in ['off', 'unavailable', 'standby'] }}
        timeout: "00:00:20"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: media_player.turn_off
            target:
              entity_id: "{{ ir }}"
    mode: parallel

  tv_sala_turn_on:
    alias: TV Sala - Encender (WoL + IR fallback)
    sequence:
      - action: script.tv_encender
        data: &tv_sala
          webos: media_player.sala_de_estar
          ir: media_player.tv_sala_ir
    mode: single

  tv_sala_turn_off:
    alias: TV Sala - Apagar (webOS + IR fallback)
    sequence:
      - action: script.tv_apagar
        data: *tv_sala
    mode: single

  tv_dormitorio_turn_on:
    alias: TV Dormitorio - Encender (WoL + IR fallback)
    sequence:
      - action: script.tv_encender
        data: &tv_dormitorio
          webos: media_player.dormitorio
          ir: media_player.tv_dormitorio_ir
    mode: single

  tv_dormitorio_turn_off:
    alias: TV Dormitorio - Apagar (webOS + IR fallback)
    sequence:
      - action: script.tv_apagar
        data: *tv_dormitorio
    mode: single

# Wake on LAN for the LG webOS TVs: media_player.turn_on fires the
# webostv.turn_on trigger, which sends the magic packet to the TV's MAC. Needs
# network standby on the TV ("Encender vía Wi-Fi/Ethernet").
automation:
  - id: tv_sala_wake_on_lan
    alias: TV Sala - Wake on LAN
    description: >-
      Enciende la LG webOS de la sala. media_player.turn_on dispara el trigger
      webostv.turn_on, que manda el magic packet a la MAC de la TV. Requiere que
      en la TV esté activado "Encender vía Wi-Fi/Ethernet" (network standby).
    trigger:
      - platform: webostv.turn_on
        entity_id: media_player.sala_de_estar
    action:
      - action: wake_on_lan.send_magic_packet
        data:
          mac: "4c:ba:d7:11:bb:12"
    mode: single

  - id: tv_dormitorio_wake_on_lan
    alias: TV Dormitorio - Wake on LAN
    description: >-
      Enciende la LG webOS del dormitorio vía Wake on LAN cuando se llama a
      media_player.turn_on (trigger webostv.turn_on).
    trigger:
      - platform: webostv.turn_on
        entity_id: media_player.dormitorio
    action:
      - action: wake_on_lan.send_magic_packet
        data:
          mac: "44:cb:8b:e4:44:c8"
    mode: single
