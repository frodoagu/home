# HA package: turn the outdoor lights on at sunset and off at sunrise.
# The two Shelly 1 Mini Gen4 relays at the front door and the stairs — the full
# hardware context is in docs/shelly.md.
#
# ────────────────────────────────────────────────────────────────────────────
# WHY THIS DOESN'T FIGHT THE DEVICE SCRIPT. The docs/shelly.md rule ("exactly ONE
# controller per wall switch") is about `input:0`: the `luces-afuera.js` mJS
# script is the only thing reacting to the wall-switch event. These automations
# don't look at the inputs — they call `light.turn_on/off` on the relays, the
# same as an operator from the app, and that raises NO input event. Both relays
# are driven explicitly here, so we don't depend on the script's gang either.
#
# ────────────────────────────────────────────────────────────────────────────
# WHY THE `homeassistant.start` TRIGGER. A sun trigger fires once: if HA is down
# at that instant (an OOMKill, a deploy, a Pi reboot) the event is lost and there
# is no retry — the lights stay as they were until the next day. The start
# trigger re-evaluates the condition on boot and leaves the lights in the state
# the current time calls for.
#
# The relays coming back from `unavailable` re-evaluate the same way. A power
# cut at the sun event (the Pi and the APs are on a UPS, the relays aren't)
# leaves the call with nowhere to go, and the relays come back with
# `initial_state: restore_last`: still on after a cut at dawn.
#
# Both catch-ups are deliberately bounded so they never override a manual
# decision:
#   - on: `after: sunset` with no `before` is true from sunset to midnight (HA's
#     `sun` condition semantics), so a restart at 3 AM doesn't turn on lights
#     somebody switched off at 2.
#   - off: only with the sun up, where leaving them on isn't a deliberate choice.
#
# THE TWO WINDOWS MUST NOT OVERLAP. Both automations share the catch-up
# triggers, so if their conditions are true at the same time, starting HA runs
# BOTH: one turns on, the other off, and a race decides. The two windows meet
# at sunset: off ends where on begins. Any offset added to one has to be added
# to the other.
# ────────────────────────────────────────────────────────────────────────────
automation:
  - id: luces_afuera_prender_atardecer
    alias: Luces afuera - Prender al atardecer
    description: >-
      Prende las dos luces de afuera al atardecer y las re-evalúa al arrancar
      HA o al volver los relés, por si el atardecer pasó con HA o los relés
      caídos.
    trigger:
      - platform: sun
        event: sunset
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: &luces
          - light.afuera_interruptor_puerta_principal
          - light.afuera_interruptor_puerta_escalera
        from: unavailable
    condition:
      # Only applies to the catch-up triggers; on the sun one it's true by
      # definition. Sunset to midnight — past that window, if they're off it's
      # because somebody turned them off.
      - condition: sun
        after: sunset
    action:
      - action: light.turn_on
        target:
          entity_id: *luces
    # Each relay's return runs it again, so one still down on the first run
    # gets its turn.
    mode: queued

  - id: luces_afuera_apagar_amanecer
    alias: Luces afuera - Apagar al amanecer
    description: >-
      Apaga las dos luces al amanecer, y también al arrancar HA si el sol ya
      está arriba o cuando vuelven los relés (mismo motivo que el de prender:
      el amanecer pudo haber pasado con HA o los relés caídos).
    trigger:
      - platform: sun
        event: sunrise
      - platform: homeassistant
        event: start
      - platform: state
        entity_id: *luces
        from: unavailable
    condition:
      # `before: sunset` closes this window exactly where the on-side's opens
      # (see the header).
      - condition: sun
        after: sunrise
        before: sunset
    action:
      - action: light.turn_off
        target:
          entity_id: *luces
    # Each relay's return runs it again, so one still down on the first run
    # gets its turn.
    mode: queued
