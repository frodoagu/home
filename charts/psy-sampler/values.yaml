# Default values for psy-sampler.

replicaCount: 1
revisionHistoryLimit: 1
image:
  # The psy.agu.com.ar sampler, built from images/psy-sampler/ by the
  # psy-sampler-image GitHub Action (.github/workflows/psy-sampler-image.yml).
  # CI pushes the mutable `latest` tag; Argo CD Image Updater (ImageUpdater CR in
  # charts/argocd-image-updater) rewrites `tag` below to `latest@sha256:...` via
  # git, so what runs is always an immutable digest — do not hand-edit image.tag.
  repository: ghcr.io/frodoagu/psy-sampler
  pullPolicy: IfNotPresent
  # Managed by Argo CD Image Updater. Starts as the mutable tag; gets pinned to
  # `latest@sha256:<digest>` on the first reconcile after CI pushes the image.
  tag: "latest@sha256:2ed8bee279baab400ff2c879e9004977b9ecd7adf1565df10bd0019234c53a7d"
# The image is static, public content (anyone can fetch the same files from
# psy.agu.com.ar), so the GHCR package is meant to be PUBLIC and needs no pull
# secret. GHCR creates it private on the first push: flip it once in GitHub >
# Packages > psy-sampler > Package settings > Change visibility. To keep it
# private instead, seal a docker-registry Secret named ghcr-creds into this
# namespace (see docs/secrets.md) and list it here.
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
service:
  type: ClusterIP
  port: 80
# Filesystem path inside the container that nginx serves as the web root.
contentRoot: /usr/share/nginx/html
# Ingress via Traefik IngressRoute
ingress:
  enabled: true
  host: psy.agu.com.ar
  # TLS certificate resolver name configured in the Traefik chart (see charts/traefik-config)
  certResolver: letsencrypt
  # Public on purpose (like agu.com.ar): no google-auth.
  middlewares: []
# nginx serving ~20 kB of static files. All audio runs in the browser.
resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
# Cloud save: images/psy-sync, a Bun + SQLite API under /api/ (templates/sync.yaml).
# Anyone with a Google account can sign in and keep their workspace there.
sync:
  enabled: true
  image:
    # Built by .github/workflows/psy-sync-image.yml; like the sampler, the GHCR
    # package must be flipped to PUBLIC once after the first push (until then
    # only /api/ is down: the page hides the cloud UI).
    repository: ghcr.io/frodoagu/psy-sync
    pullPolicy: IfNotPresent
    # Managed by Argo CD Image Updater (pinned to latest@sha256:...).
    tag: "latest@sha256:ec41bd3ae4a6e55c479805d444dbbd45a6c4816d69bc0de402ec59bfa7f4ff88"
  # Public by design (it ships in the page). Same "Web application" client as
  # agu.com.ar: https://psy.agu.com.ar must be listed among its Authorized
  # JavaScript origins in Google Cloud, or the sign-in button refuses to load.
  googleClientId: "1036300943412-3np4as1pb6d2ovkbt9j89aiact2bddc0.apps.googleusercontent.com"
  # New sign-ups stop here (existing accounts keep working). A workspace is
  # capped at 256 KB, so this bounds the database at ~1.3 GB worst case.
  maxUsers: 5000
  # Users' audio samples, stored as BLOBs in the same SQLite file. Per file,
  # per account (count and bytes), and for everyone together: `total` is what
  # keeps uploads from filling the PVC (and the Pi's SD card) whatever the
  # number of accounts.
  samples:
    maxBytes: 3Mi
    maxCount: 24
    quota: 30Mi
    total: 1Gi
  # /metrics on :9787, scraped by a VMPodScrape (dashboard + alerts live in
  # charts/monitoring). `topUsers`: accounts listed by workspace size, labelled
  # by email; the rest only count in the totals.
  metrics:
    enabled: true
    topUsers: 20
  persistence:
    size: 2Gi
    storageClass: "" # cluster default (k3s local-path)
  # Per client IP: `average` requests per `period`, `burst` deep. A page
  # saves at most every few seconds while editing, but a load fetches every
  # sample its sounds use (up to `samples.maxCount`) on top of the usual calls.
  rateLimit:
    average: 120
    period: 1m
    burst: 60
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
nodeSelector: {}
tolerations: []
affinity: {}
