{{- if .Values.ingress.enabled }}
{{- $fullname := include "psy-sampler.fullname" . }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "psy-sampler.labels" . | nindent 4 }}
spec:
  entryPoints:
    - websecure
  routes:
    {{- if .Values.sync.enabled }}
    # Cloud save. Longer rule than the catch-all, so Traefik prefers it for /api/.
    - match: Host(`{{ .Values.ingress.host }}`) && PathPrefix(`/api/`)
      kind: Rule
      middlewares:
        {{- if .Values.googleAuth.enabled }}
        - name: {{ $fullname }}-google-auth-signin
        - name: {{ $fullname }}-google-auth
        {{- end }}
        - name: {{ include "psy-sampler.syncName" . }}-ratelimit
      services:
        - name: {{ include "psy-sampler.syncName" . }}
          port: 8787
    {{- end }}
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ $fullname }}
          port: {{ .Values.service.port }}
      {{- if or .Values.googleAuth.enabled .Values.ingress.middlewares }}
      # The errors middleware (google-auth-signin) must be OUTER so it wraps the
      # forwardAuth and turns its 401 into a sign-in redirect.
      middlewares:
        {{- if .Values.googleAuth.enabled }}
        - name: {{ $fullname }}-google-auth-signin
        - name: {{ $fullname }}-google-auth
        {{- end }}
        {{- range .Values.ingress.middlewares }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
  tls:
    certResolver: {{ .Values.ingress.certResolver }}
    {{- with .Values.ingress.tlsDomains }}
    domains:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
# HTTP → HTTPS redirection is handled globally by the bundled Traefik's web
# entrypoint (see charts/traefik-config), so no separate HTTP route is needed.
