{{- if and .Values.ingress.enabled .Values.googleAuth.enabled }}
# Local copy of the google-auth ForwardAuth pair (canonical one in kube-system,
# charts/traefik-config), as in charts/homepage. Prefixed with the fullname:
# the PR previews share one namespace.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "psy-sampler.fullname" . }}-google-auth
  labels:
    {{- include "psy-sampler.labels" . | nindent 4 }}
spec:
  forwardAuth:
    address: {{ .Values.googleAuth.forwardAuthAddress }}
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
    trustForwardHeader: true
---
# Turns oauth2-proxy 401/403 responses into a browser redirect to sign-in.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "psy-sampler.fullname" . }}-google-auth-signin
  labels:
    {{- include "psy-sampler.labels" . | nindent 4 }}
spec:
  errors:
    status:
      - "401-403"
    service:
      name: {{ .Values.googleAuth.oauth2ProxyService.name }}
      namespace: {{ .Values.googleAuth.oauth2ProxyService.namespace }}
      port: {{ .Values.googleAuth.oauth2ProxyService.port }}
    query: {{ .Values.googleAuth.signInQuery | quote }}
{{- end }}
