apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "psy-sampler.fullname" . }}-conf
  labels:
    {{- include "psy-sampler.labels" . | nindent 4 }}
data:
  # SPA-tuned server, as in charts/agu-spa: index.html is never cached (a
  # deploy is picked up on the next load), content-hashed assets are immutable.
  default.conf: |
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        root   {{ .Values.contentRoot }};
        index  index.html;

        # Lightweight health endpoint for k8s probes.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Only Vite's output dir is content-hashed; public/ files (favicon)
        # keep their name across builds, so they stay revalidatable.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        gzip            on;
        gzip_vary       on;
        gzip_min_length 1024;
        gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    }
