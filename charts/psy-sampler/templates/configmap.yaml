{{- /*
  The page loads nothing but its own files and Google Sign-In (script, its
  stylesheet, the button's iframe). Inline styles stay allowed: the editors set
  style attributes. media-src takes blob: for the silent track that holds the
  media session (src/mediaKeys.js). connect-src adds the ✨ AI's LM Studio
  endpoints and the linked accounts' APIs (ai.connectSrc). A new third-party origin must be added here or it is blocked.
  No Cross-Origin-Opener-Policy: same-origin would cut the sign-in popup off.
*/}}
{{- $connect := concat (list "'self'" "https://accounts.google.com/gsi/") (.Values.ai.connectSrc | default list) }}
{{- $csp := list
  "default-src 'self'"
  "script-src 'self' https://accounts.google.com/gsi/client"
  "style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style"
  "frame-src https://accounts.google.com/gsi/"
  (printf "connect-src %s" (join " " $connect))
  "img-src 'self' data:"
  "media-src 'self' blob:"
  "object-src 'none'"
  "base-uri 'none'"
  "form-action 'self'"
  "frame-ancestors 'none'"
  | join "; " }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "psy-sampler.fullname" . }}-conf
  labels:
    {{- include "psy-sampler.labels" . | nindent 4 }}
data:
  # SPA-tuned server, as in charts/agu-spa: index.html is never cached (a
  # deploy is picked up on the next load), content-hashed assets are immutable.
  default.conf: |
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;
        server_tokens off;

        root   {{ .Values.contentRoot }};
        index  index.html;

        # Lightweight health endpoint for k8s probes.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Every page load ends here (try_files falls back to it), so the page's
        # security headers live in this block: nginx drops server-level
        # add_header in any location that sets its own.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Content-Security-Policy "{{ $csp }}" always;
            add_header X-Content-Type-Options nosniff always;
            # Neither Cloudflare nor Traefik sends it; this host only, no preload.
            add_header Strict-Transport-Security "max-age=31536000" always;
            {{- range .Values.ai.originTrials }}
            add_header Origin-Trial "{{ . }}" always;
            {{- end }}
        }

        # The build id an open page polls to notice a deploy (src/update.js):
        # never cached, here or at Cloudflare, or the notice comes late.
        location = /version.json {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        # Only Vite's output dir is content-hashed; public/ files (favicon)
        # keep their name across builds, so they stay revalidatable.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        gzip            on;
        gzip_vary       on;
        gzip_min_length 1024;
        gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    }
