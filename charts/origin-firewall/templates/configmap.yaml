{{- /* Build a []string of ports so join renders "80, 443" from int values. */ -}}
{{- $ports := list }}
{{- range .Values.webPorts }}{{ $ports = append $ports (printf "%v" .) }}{{- end }}
{{- $quicPorts := list }}
{{- range .Values.quicPorts }}{{ $quicPorts = append $quicPorts (printf "%v" .) }}{{- end }}
{{- $vpnPorts := list }}
{{- if .Values.vpnFromInside.enabled }}
{{- range .Values.vpnFromInside.ports }}{{ $vpnPorts = append $vpnPorts (printf "%v" .) }}{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "origin-firewall.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "origin-firewall.labels" . | nindent 4 }}
data:
  origin-firewall.nft: |
    # Rendered from charts/origin-firewall/values.yaml — do not edit in-cluster.
    # Cloudflare-only origin firewall. Runs at prerouting priority -300, BEFORE
    # klipper's dstnat (-100) and any POSTROUTING masquerade, so it sees the real
    # source IP. Only tcp/{{ $ports | join "," }}{{ if $quicPorts }} and udp/{{ $quicPorts | join "," }}{{ end }} are policed; SSH/6443/DNS/DHCP/etc. untouched.
    #
    # Idempotent (re)load: create-then-delete so `nft -f` can run repeatedly.
    add table inet origin_fw
    delete table inet origin_fw

    table inet origin_fw {
        set cloudflare_v4 {
            type ipv4_addr
            flags interval
            elements = { {{ .Values.cloudflareIPv4 | join ", " }} }
        }
        set cloudflare_v6 {
            type ipv6_addr
            flags interval
            elements = { {{ .Values.cloudflareIPv6 | join ", " }} }
        }
        set local_v4 {
            type ipv4_addr
            flags interval
            elements = { {{ .Values.localIPv4 | join ", " }} }
        }
        {{- if .Values.localIPv6 }}
        set local_v6 {
            type ipv6_addr
            flags interval
            elements = { {{ .Values.localIPv6 | join ", " }} }
        }
        {{- end }}
        {{- if $vpnPorts }}
        set vpn_lan_v4 {
            type ipv4_addr
            flags interval
            elements = { {{ .Values.vpnFromInside.lanIPv4 | join ", " }} }
        }
        # Filled at runtime with the home's public IP (entrypoint.sh).
        set home_public_v4 {
            type ipv4_addr
        }
        {{- end }}

        chain prerouting {
            type filter hook prerouting priority -300; policy accept;
            # Only inbound web ports enter the filters; everything else is accepted.
            tcp dport { {{ $ports | join ", " }} } jump web_filter
            {{- if $quicPorts }}
            udp dport { {{ $quicPorts | join ", " }} } jump quic_filter
            {{- end }}
            {{- if $vpnPorts }}
            udp dport { {{ $vpnPorts | join ", " }} } jump vpn_filter
            {{- end }}
        }

        chain web_filter {
            ip  saddr @cloudflare_v4 counter accept
            ip6 saddr @cloudflare_v6 counter accept
            ip  saddr @local_v4      counter accept
            {{- if .Values.localIPv6 }}
            ip6 saddr @local_v6      counter accept
            {{- else }}
            ip6 saddr ::1            counter accept
            {{- end }}
            # Not Cloudflare, not local → a direct-to-origin bypass. Drop it.
            counter drop
        }
        {{- if $quicPorts }}

        # QUIC (HTTP/3) is a LAN-only path: Traefik answers udp/443 so on-LAN
        # browsers can honour the `alpn=h3` in the zone's Cloudflare HTTPS record,
        # while internet visitors terminate h3 at the Cloudflare edge — which
        # reaches this origin over TCP. So there is no legitimate QUIC from the
        # edge ranges, and this chain allows local sources ONLY.
        chain quic_filter {
            ip  saddr @local_v4 counter accept
            {{- if .Values.localIPv6 }}
            ip6 saddr @local_v6 counter accept
            {{- else }}
            ip6 saddr ::1       counter accept
            {{- end }}
            counter drop
        }
        {{- end }}
        {{- if $vpnPorts }}

        # WireGuard is for outside the house: drop it from the LAN, and from the
        # home's own public IP (what the router's NAT loopback rewrites a LAN
        # client's source to when it dials the public address).
        chain vpn_filter {
            ip saddr @vpn_lan_v4     counter drop
            ip saddr @home_public_v4 counter drop
        }
        {{- end }}
    }

  entrypoint.sh: |
    #!/bin/sh
    set -eu
    RULESET=/etc/origin-firewall/origin-firewall.nft
    INTERVAL="${RECONCILE_INTERVAL:-30}"
    CF_AUTO_UPDATE="${CF_AUTO_UPDATE:-true}"
    CF_UPDATE_INTERVAL="${CF_UPDATE_INTERVAL:-43200}"
    CF_V4_URL="${CF_V4_URL:-https://www.cloudflare.com/ips-v4}"
    CF_V6_URL="${CF_V6_URL:-https://www.cloudflare.com/ips-v6}"
    HOME_IP_URL="${HOME_IP_URL:-}"
    HOME_IP_INTERVAL="${HOME_IP_INTERVAL:-300}"

    # nft + curl are baked into the image (images/origin-firewall/Dockerfile) —
    # nothing is installed at runtime. Fail loudly if the image is wrong.
    for bin in nft curl; do
      command -v "$bin" >/dev/null 2>&1 || { echo "origin-firewall: '$bin' missing from image"; exit 1; }
    done

    # Load the full table (chains + the baked-in fallback CF/local sets).
    apply_base() { nft -f "$RULESET" && echo "origin-firewall: base ruleset applied"; }

    # Fetch one CF list, validate it, and ATOMICALLY replace its set. Any failure
    # (network, garbage response, too few entries) returns non-zero and changes
    # NOTHING, so the last-known-good set — or the baked fallback — is preserved.
    refresh_cf_set() {
      name="$1"; url="$2"; family="$3"   # family: ip | ip6
      data="$(curl -fsS --max-time 20 "$url" 2>/dev/null)" || return 1
      if [ "$family" = "ip" ]; then
        ranges="$(printf '%s\n' "$data" | grep -E '^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$' || true)"
      else
        ranges="$(printf '%s\n' "$data" | grep -E '^[0-9a-fA-F:]+/[0-9]{1,3}$' || true)"
      fi
      count="$(printf '%s\n' "$ranges" | grep -c . || true)"
      [ "$count" -ge 3 ] || return 1   # sanity floor: never accept an empty/short list
      elements="$(printf '%s\n' "$ranges" | tr '\n' ',' | sed 's/,*$//')"
      printf 'flush set inet origin_fw %s\nadd element inet origin_fw %s { %s }\n' \
        "$name" "$name" "$elements" | nft -f - || return 1
      echo "origin-firewall: $name refreshed from Cloudflare ($count ranges)"
    }

    refresh_cf() {
      [ "$CF_AUTO_UPDATE" = "true" ] || return 0
      refresh_cf_set cloudflare_v4 "$CF_V4_URL" ip  || echo "origin-firewall: v4 refresh skipped (keeping current)"
      refresh_cf_set cloudflare_v6 "$CF_V6_URL" ip6 || echo "origin-firewall: v6 refresh skipped (keeping current)"
    }

    # Keep home_public_v4 at the home's current public IP. A failed or odd
    # answer changes nothing, so the last known IP stays blocked.
    home_ip=""
    refresh_home_ip() {
      [ -n "$HOME_IP_URL" ] || return 0
      ip="$(curl -fsS --max-time 10 "$HOME_IP_URL" 2>/dev/null | sed -n 's/^ip=//p')" || return 1
      printf '%s' "$ip" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$' || return 1
      [ "$ip" != "$home_ip" ] || return 0
      printf 'flush set inet origin_fw home_public_v4\nadd element inet origin_fw home_public_v4 { %s }\n' "$ip" | nft -f - || return 1
      echo "origin-firewall: home public IP is $ip (VPN from it dropped)"
      home_ip="$ip"
    }

    apply_base          # ConfigMap changes take effect when pods roll
    refresh_cf
    last_cf="$(date +%s)"
    refresh_home_ip || echo "origin-firewall: home IP refresh failed (retrying)"
    last_home="$(date +%s)"

    while true; do
      sleep "$INTERVAL"
      # Self-heal: if our table vanished, reload it (reverts CF sets to the
      # fallback), then force a fresh CF fetch on the next tick.
      if ! nft list table inet origin_fw >/dev/null 2>&1; then
        echo "origin-firewall: table missing, re-applying"; apply_base; last_cf=0; last_home=0; home_ip=""
      fi
      now="$(date +%s)"
      if [ "$(( now - last_home ))" -ge "$HOME_IP_INTERVAL" ]; then
        refresh_home_ip || echo "origin-firewall: home IP refresh failed (keeping $home_ip)"
        last_home="$now"
      fi
      if [ "$CF_AUTO_UPDATE" = "true" ]; then
        now="$(date +%s)"
        if [ "$(( now - last_cf ))" -ge "$CF_UPDATE_INTERVAL" ]; then
          refresh_cf; last_cf="$now"
        fi
      fi
    done
