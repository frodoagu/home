apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agu-spa.fullname" . }}-conf
  labels:
    {{- include "agu-spa.labels" . | nindent 4 }}
data:
  # nginx server config for the prerendered SPA (images/home-site/scripts/prerender.js):
  #  - every route is a real file (/app/<slug> -> app/<slug>.html), and any
  #    other path is a real 404 serving 404.html, so crawlers never index a
  #    soft 404 and robots.txt/sitemap.xml are never answered with the SPA.
  #  - hashed build assets are cached aggressively; pages are never cached so
  #    new deploys are picked up immediately.
  default.conf: |
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;

        root   {{ .Values.content.root }};
        index  index.html;

        # Lightweight health endpoint for k8s probes (no SPA fallback needed).
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Pages, robots.txt and sitemap.xml are never cached so deploys take
        # effect immediately.
        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            try_files $uri $uri.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Content-hashed build assets are immutable – cache them hard.
        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        gzip            on;
        gzip_vary       on;
        gzip_min_length 1024;
        gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    }
{{- if eq .Values.content.source "configMap" }}
  # Placeholder served only when content.source == configMap.
  index.html: |
{{ .Values.content.placeholderHtml | indent 4 }}
{{- end }}
