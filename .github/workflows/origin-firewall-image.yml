name: 🧱 Origin-firewall · Build & Publish Image

# Build the origin-firewall base image (Debian + nftables/curl/CA certs) and
# push it to GHCR as `latest` (plus an immutable `sha-<commit>` tag). Argo CD
# Image Updater watches `latest`'s digest and writes the pinned digest back to
# charts/origin-firewall/values.yaml, which rolls out the DaemonSet. CI does not
# touch git.
on:
  push:
    branches: [main]
    paths:
      - "images/origin-firewall/**"
      - ".github/workflows/origin-firewall-image.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read # to checkout the repo
      packages: write # to push to GHCR
    with:
      image: ghcr.io/frodoagu/origin-firewall
      context: ./images/origin-firewall
      tags: |
        sha-{sha}
        latest
      title: 🧱 Published image
      note: "Argo CD Image Updater will detect the new `latest` digest and pin it into `charts/origin-firewall/values.yaml` for the rollout."
