name: ☁️ Psy-sync · Build & Publish Image

# Build the psy.agu.com.ar cloud-save API (images/psy-sync, Bun) and push it to
# GHCR as `latest` (plus an immutable `sha-<commit>` tag). Argo CD Image Updater
# watches `latest`'s digest and writes it to `sync.image.tag` in
# charts/psy-sampler/values.yaml. CI does not touch git. The package is meant
# to be public (see that values.yaml).
on:
  push:
    branches: [main]
    paths:
      - "images/psy-sync/**"
      - ".github/workflows/psy-sync-image.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read # to checkout the repo
      packages: write # to push to GHCR
    with:
      image: ghcr.io/frodoagu/psy-sync
      context: ./images/psy-sync
      tags: |
        sha-{sha}
        latest
      title: ☁️ Published image
      note: "Argo CD Image Updater will detect the new `latest` digest and pin it into `sync.image.tag` in `charts/psy-sampler/values.yaml` for the rollout."
