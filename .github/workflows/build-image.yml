name: 🐳 Build & push an arm64 image

# Shared by every image workflow (site.yml, psy-sampler-image.yml,
# psy-sync-image.yml, origin-firewall-image.yml, psy-sampler-preview.yml):
# cross-builds `context` for linux/arm64 (the k3s node is a Raspberry Pi) and
# pushes it to GHCR under each of `tags`.
on:
  workflow_call:
    inputs:
      image:
        description: Image repository, e.g. ghcr.io/frodoagu/home-site.
        required: true
        type: string
      context:
        description: Build context, e.g. ./images/home-site.
        required: true
        type: string
      tags:
        description: >-
          Tags to push, one per line. `{sha}` stands for the built commit's
          first 12 characters, `{sha8}` for its first 8.
        required: true
        type: string
      ref:
        description: Commit to build; the triggering one when empty.
        type: string
        default: ""
      title:
        description: Heading of the job summary.
        type: string
        default: "🐳 Published image"
      note:
        description: Last line of the job summary (what happens next).
        type: string
        default: ""
    outputs:
      digest:
        description: The pushed image's digest; empty when the build failed.
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    name: Build & push arm64 image
    runs-on: ubuntu-26.04
    permissions:
      contents: read # to checkout the repo
      packages: write # to push to GHCR
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: 🏷️ Tag list
        id: tags
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
        run: |
          SHA=$(git rev-parse HEAD)
          {
            echo "list<<EOF"
            printf '%s\n' "$TAGS" | sed '/^\s*$/d; s/^\s*//; s/\s*$//' \
              | sed "s/{sha}/${SHA::12}/g; s/{sha8}/${SHA::8}/g; s|^|$IMAGE:|"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 🧰 Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # FROM images (and the dockerfile frontend) resolve through Google's
          # Docker Hub mirror, like QEMU and BuildKit above: Docker Hub
          # throttles and times out on GitHub's runners (429s, auth timeouts,
          # 500s), with or without a login. Docker Hub is only the fallback.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build & push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 📦 Image summary
        if: always()
        env:
          TITLE: ${{ inputs.title }}
          NOTE: ${{ inputs.note }}
          TAGS: ${{ steps.tags.outputs.list }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## $TITLE"
            echo ""
            if [ -n "$DIGEST" ]; then
              echo "✅ Image built (\`linux/arm64\`) and pushed to GHCR."
              echo ""
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Tags | $(printf '%s\n' "$TAGS" | sed 's/.*/`&`/' | paste -sd ' ') |"
              echo "| Digest | \`$DIGEST\` |"
              echo "| Commit | \`$(git rev-parse --short=12 HEAD)\` |"
              if [ -n "$NOTE" ]; then printf '\n%s\n' "$NOTE"; fi
            else
              echo "⚠️ The build did not complete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
