name: 🧪 Psy-sampler · Tests & Build

# Lint + unit/DOM tests + production build for the psy.agu.com.ar sampler. Runs
# on PRs and pushes, but only when its source changes. Publishes the same job
# summary as site-test.yml (test results + bundle sizes). The image build
# (psy-sampler-image.yml) is separate and gated on push to main.
on:
  push:
    paths:
      - "images/psy-sampler/**"
      - ".github/workflows/psy-sampler-test.yml"
      - ".github/workflows/node-test.yml"
  pull_request:
    paths:
      - "images/psy-sampler/**"
      - ".github/workflows/psy-sampler-test.yml"
      - ".github/workflows/node-test.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test & build the sampler
    uses: ./.github/workflows/node-test.yml
    permissions:
      contents: read # to checkout the repo
    with:
      dir: images/psy-sampler
