---
# ArgoCD Application – deploys Pi-hole from this repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pihole
  namespace: argocd
  labels:
    agu.com.ar/category: networking
    agu.com.ar/exposure: google-auth
    agu.com.ar/blast-radius: lan
  annotations:
    link.argocd.argoproj.io/external-link: "https://pihole.agu.com.ar/admin"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: Description
      value: "LAN DNS ad-blocker + DHCP server (hostNetwork); serves .lan names and the split-horizon records."
    - name: Docs
      value: "https://github.com/frodoagu/home/blob/main/docs/pihole.md"
  source:
    repoURL: git@github.com:frodoagu/home.git
    targetRevision: HEAD
    path: charts/pihole
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: pihole
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
