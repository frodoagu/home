---
# ArgoCD Application – Cloudflare dynamic-DNS updater.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-ddns
  namespace: argocd
  labels:
    agu.com.ar/category: networking
    agu.com.ar/exposure: internal
    agu.com.ar/blast-radius: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: Description
      value: "Keeps the Cloudflare A records of every public hostname on the home IP."
  source:
    repoURL: git@github.com:frodoagu/home.git
    targetRevision: HEAD
    path: charts/cloudflare-ddns
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflare-ddns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
