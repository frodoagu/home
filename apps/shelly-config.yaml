---
# ArgoCD Application - reconciles declarative config onto the LAN Shelly devices.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shelly-config
  namespace: argocd
  labels:
    agu.com.ar/category: home-automation
    agu.com.ar/exposure: internal
    agu.com.ar/blast-radius: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: Description
      value: "Reconciles switch settings + mJS scripts onto the LAN Shelly relays (CronJob + PostSync Job). Deploys no device."
    - name: Docs
      value: "https://github.com/frodoagu/home/blob/main/docs/shelly.md"
  source:
    repoURL: git@github.com:frodoagu/home.git
    targetRevision: HEAD
    path: charts/shelly-config
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: shelly-config
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
