---
# ArgoCD Application – deploys ArgoCD itself from this repository (app-of-apps pattern).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    agu.com.ar/category: gitops
    agu.com.ar/exposure: own-auth
    agu.com.ar/blast-radius: platform
  annotations:
    link.argocd.argoproj.io/external-link: "https://argocd.agu.com.ar"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: Description
      value: "Argo CD itself, self-managed. Google sign-in via Dex; local admin disabled."
    - name: Docs
      value: "https://github.com/frodoagu/home#quick-start"
  source:
    repoURL: git@github.com:frodoagu/home.git
    targetRevision: HEAD
    path: charts/argocd
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
