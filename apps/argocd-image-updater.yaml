---
# ArgoCD Application – Argo CD Image Updater (watches registries and writes new
# image references back to git for Applications annotated with
# argocd-image-updater.argoproj.io/*). See charts/argocd-image-updater.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
  labels:
    agu.com.ar/category: gitops
    agu.com.ar/exposure: internal
    agu.com.ar/blast-radius: app
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: Description
      value: "Writes new digests of the CI-built images back to git (one ImageUpdater CR per image)."
    - name: Docs
      value: "https://github.com/frodoagu/home/blob/main/docs/agu-spa.md"
  source:
    repoURL: git@github.com:frodoagu/home.git
    targetRevision: HEAD
    path: charts/argocd-image-updater
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
