---
# ArgoCD Application – homepage (gethomepage) dashboard / start page for the lab.
# See charts/homepage.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  labels:
    agu.com.ar/category: web
    agu.com.ar/exposure: google-auth
    agu.com.ar/blast-radius: app
  annotations:
    link.argocd.argoproj.io/external-link: "https://dash.agu.com.ar"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: Description
      value: "gethomepage start page with Kubernetes service discovery."
  source:
    repoURL: git@github.com:frodoagu/home.git
    targetRevision: HEAD
    path: charts/homepage
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
