---
# ArgoCD Application – deploys the Cloudflare-only origin firewall DaemonSet.
# Host-level networking infra (like sealed-secrets), so it lives in kube-system.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: origin-firewall
  namespace: argocd
  labels:
    agu.com.ar/category: security
    agu.com.ar/exposure: internal
    agu.com.ar/blast-radius: platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: Description
      value: "Privileged hostNetwork DaemonSet programming nftables: 80/443 only from Cloudflare + LAN."
    - name: Docs
      value: "https://github.com/frodoagu/home/blob/main/docs/origin-firewall.md"
    - name: Image
      value: "ghcr.io/frodoagu/origin-firewall (digest pinned by Image Updater)"
  source:
    repoURL: git@github.com:frodoagu/home.git
    targetRevision: HEAD
    path: charts/origin-firewall
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
