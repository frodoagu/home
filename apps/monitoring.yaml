---
# ArgoCD Application – observability stack (VictoriaMetrics k8s-stack + blackbox).
# Metrics, Grafana dashboards, Alertmanager→Telegram alerts, node/hardware and
# Raspberry Pi throttling metrics, plus external uptime/TLS probes.
# See charts/monitoring.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  labels:
    agu.com.ar/category: observability
    agu.com.ar/exposure: google-auth
    agu.com.ar/blast-radius: app
  annotations:
    link.argocd.argoproj.io/external-link: "https://grafana.agu.com.ar"
    # Any key under this prefix adds a link; one key per URL.
    link.argocd.argoproj.io/alertmanager: "https://alertmanager.agu.com.ar"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  info:
    - name: Description
      value: "VictoriaMetrics k8s-stack + Grafana + blackbox; Telegram alerts, RPi temp/throttle, uptime/TLS probes."
    - name: Docs
      value: "https://github.com/frodoagu/home/blob/main/docs/monitoring.md"
  source:
    repoURL: git@github.com:frodoagu/home.git
    targetRevision: HEAD
    path: charts/monitoring
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The VictoriaMetrics operator ships large CRDs; server-side apply avoids
      # the client-side "metadata.annotations too long" error.
      - ServerSideApply=true
  # The VMRule CRD schema defaults `record` (and `alert`) to "", so the API
  # server stamps `record: ""` onto every alerting rule and the live object can
  # never match the rendered manifest — a permanent OutOfSync that selfHeal
  # cannot fix, because applying does not remove a server-side default. Drop the
  # field only when it holds that default: a real recording rule still diffs.
  # (ServerSideDiff=true also hides it, but it surfaces false diffs on Grafana
  # and the operator's webhook instead — don't reach for it here.)
  ignoreDifferences:
    - group: operator.victoriametrics.com
      kind: VMRule
      jqPathExpressions:
        - '.spec.groups[].rules[] | select(.record == "") | .record'
    # The operator chart mints its webhook cert with genCA on every render, so
    # without these any commit to the repo, whatever it touches, makes the app
    # OutOfSync and selfHeal syncs it (a "Deploy: monitoring" line on every
    # dashboard). A real sync applies the Secret and the caBundle from the same
    # render, so the pair stays matched.
    - kind: Secret
      name: monitoring-victoria-metrics-operator-validation
      namespace: monitoring
      jsonPointers:
        - /data
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: monitoring-victoria-metrics-operator-admission
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'
